# .github/workflows/gitleaks.yml
# Phase 4 GATE-01: CI secret scanning gate.
# Runs gitleaks on every PR and every push to main.
# Reuses .gitleaks.toml rules from Phase 1 (auto-detected at repo root).
# gitleaks-action v2.3.9 — personal repo (johntrottadev) — no GITLEAKS_LICENSE required.
name: gitleaks

on:
  push:
    branches:
      - main
  pull_request:

# Minimum permissions for gitleaks-action: needs pull-requests=read to fetch the
# PR's commit list when triggered by pull_request events (#1 caught this gap —
# previously implicit GITHUB_TOKEN scope did not include pull_requests).
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE not required: johntrottadev is a personal GitHub account
          # GITLEAKS_CONFIG not required: .gitleaks.toml is auto-detected at repo root
