# .gitleaks.toml — extends upstream default ruleset, adds project allowlist.
# Phase 1 (M1 SEC-05). Same file is consumed by Phase 4 GATE-01 CI verbatim.
# Source: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
# gitleaks v8.25+ requires [[allowlists]] (plural). [allowlist] singular is silently ignored.

[extend]
useDefault = true

[[allowlists]]
description = "Known-safe placeholder syntaxes used in this repo's templates"
regexTarget = "secret"
regexes = [
  '''\{\{[a-zA-Z0-9_.-]+\}\}''',                                  # Helm/Jinja: {{var_name}}
  '''\$\{[A-Z0-9_]+(:-[^}]*)?\}''',                               # shell/compose: ${VAR} or ${VAR:-default}
  '''<[a-zA-Z0-9 _.-]+>''',                                       # docs placeholder: <your-token-here>
  '''(?i)your[-_](github[-_]client[-_])?(id|secret|token|key)''', # "your-github-client-secret"
  '''(?i)example[-_]?(token|secret|key|password)''',
  '''(?i)changeme|placeholder|REPLACE_ME|TODO''',
]

[[allowlists]]
description = "Phase-1 self-test fixture — EVIDENCE.md may contain --redact'd canary references"
paths = ['''\.planning/phases/01-quarantine-rotate/01-EVIDENCE\.md''']

[[allowlists]]
description = "Kopia env-var names in README.md docs (preserve-env lists and export lines are variable names, not key values)"
regexTarget = "match"
regexes = [
  '''KOPIA_S3_ACCESS_KEY''',  # shell env var name in --preserve-env list / export; no real value ever committed
]
paths = ['''terraform/dock_nodes/README\.md''']

[[allowlists]]
description = "Gitignored out-of-band credential files — never committed, present in working tree as applied secrets (gitignored via *-creds and wasabi-creds patterns)"
paths = [
  '''clusters/default/netalert/secret-paloarp-creds''',  # gitignored via .gitignore:10:*-creds; 0 commits in history
  '''velero/wasabi-creds''',                              # gitignored via velero/.gitignore:2:wasabi-creds; 0 commits in history
]

[[allowlists]]
description = "Pre-rewrite hoarder secrets in origin/main pre-Phase-2 commit (e2dd29e) — expunged from local main by git filter-repo (Phase 2, 2026-05-06); will disappear from --all after Wave 3 force-push overwrites origin/main. Rotated: hoarder NextAuth/Meilisearch keys rotated in Phase 1 plan 01-03."
commits = ["e2dd29eeb352f5b7fbe25f25ab92034713f91c3a"]

# --- TOPO-03: Topology defense-in-depth rules (Phase 6 extension) ---
# Source: .planning/phases/06-sanitization-tooling/06-CONTEXT.md §<decisions> D-06.
# These [[rules]] mirror the banned-pattern set in tools/sanitize/topology-gate.sh
# so that gitleaks (pre-commit hook + public-mirror CI scan) catches the same
# topology surface the sanitizer's post-filter gate guards. Defense-in-depth.
#
# This file ships to the public mirror via tools/sanitize/paths-from-file.txt
# allow-list — the topology rules are not sensitive and are valuable on the
# public side too.
#
# Regex alignment note (2026-05-08): topology-base-domain uses \bjt-lab\.net\b
# (broader, matches bare __BASE-DOMAIN__) and topology-known-hostnames includes pve[123]
# (real Proxmox hostname) instead of placeholder hv-[123]; these align this file
# with the post-Wave-4 form of tools/sanitize/topology-gate.sh.

[[rules]]
id = "topology-lab-subnets"
description = "RFC-1918 lab subnets (10.10.1/2/3.x) — D-06 banned-pattern set"
regex = '''\b10\.10\.[123]\.[0-9]{1,3}\b'''
tags = ["topology", "lab-subnet", "TOPO-03"]

[[rules]]
id = "topology-base-domain"
description = "__BASE-DOMAIN__ base-domain literal — D-06 banned-pattern set"
regex = '''\bjt-lab\.net\b'''
tags = ["topology", "domain", "TOPO-03"]

[[rules]]
id = "topology-wasabi-bucket"
description = "Wasabi bucket name — D-06 banned-pattern set"
regex = '''\b__WASABI-BUCKET__\b'''
tags = ["topology", "bucket", "TOPO-03"]

[[rules]]
id = "topology-acme-email"
description = "ACME registration email — D-06 banned-pattern set"
regex = '''johntrottacv@gmail\.com'''
tags = ["topology", "email", "TOPO-03"]

[[rules]]
id = "topology-known-hostnames"
description = "Real hostnames (pve[123], kub[1-7], dock[12], app-vm, __NAS-USER__, pve mgmt) — D-06 banned-pattern set"
regex = '''\b(pve[123]|kub[1-7]|dock[12]|app-vm[-_]vm|__NAS-USER__|__PVE-MGMT-1__|pve[123]-mgmt)\b'''
tags = ["topology", "hostname", "TOPO-03"]

[[rules]]
id = "topology-private-repo-url"
# FLUX-05 banned literal — private repo URL must not appear in any committed file.
# The literal is split via [h]omelab-priv[a]te so the regex source itself does not
# contain the bare literal — prevents topology-gate.sh self-match against this file.
description = "FLUX-05 banned literal — private GitHub repo URL must not appear in any committed file"
regex = '''johntrottadev/[h]omelab-priv[a]te'''
tags = ["topology", "repo-url", "TOPO-03", "FLUX-05"]
