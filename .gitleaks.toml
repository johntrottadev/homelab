# .gitleaks.toml — extends upstream default ruleset, adds project allowlist.
# Phase 1 (M1 SEC-05). Same file is consumed by Phase 4 GATE-01 CI verbatim.
# Source: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
# gitleaks v8.25+ requires [[allowlists]] (plural). [allowlist] singular is silently ignored.

[extend]
useDefault = true

[[allowlists]]
description = "Known-safe placeholder syntaxes used in this repo's templates"
regexTarget = "secret"
regexes = [
  '''\{\{[a-zA-Z0-9_.-]+\}\}''',                                  # Helm/Jinja: {{var_name}}
  '''\$\{[A-Z0-9_]+(:-[^}]*)?\}''',                               # shell/compose: ${VAR} or ${VAR:-default}
  '''<[a-zA-Z0-9 _.-]+>''',                                       # docs placeholder: <your-token-here>
  '''(?i)your[-_](github[-_]client[-_])?(id|secret|token|key)''', # "your-github-client-secret"
  '''(?i)example[-_]?(token|secret|key|password)''',
  '''(?i)changeme|placeholder|REPLACE_ME|TODO''',
]

[[allowlists]]
description = "Phase-1 self-test fixture — EVIDENCE.md may contain --redact'd canary references"
paths = ['''\.planning/phases/01-quarantine-rotate/01-EVIDENCE\.md''']

[[allowlists]]
description = "Kopia env-var names in README.md docs (preserve-env lists and export lines are variable names, not key values)"
regexTarget = "match"
regexes = [
  '''KOPIA_S3_ACCESS_KEY''',  # shell env var name in --preserve-env list / export; no real value ever committed
]
paths = ['''terraform/dock_nodes/README\.md''']

[[allowlists]]
description = "Gitignored out-of-band credential files — never committed, present in working tree as applied secrets (gitignored via *-creds and wasabi-creds patterns)"
paths = [
  '''clusters/default/netalert/secret-paloarp-creds''',  # gitignored via .gitignore:10:*-creds; 0 commits in history
  '''velero/wasabi-creds''',                              # gitignored via velero/.gitignore:2:wasabi-creds; 0 commits in history
]

[[allowlists]]
description = "Pre-rewrite hoarder secrets in origin/main pre-Phase-2 commit (e2dd29e) — expunged from local main by git filter-repo (Phase 2, 2026-05-06); will disappear from --all after Wave 3 force-push overwrites origin/main. Rotated: hoarder NextAuth/Meilisearch keys rotated in Phase 1 plan 01-03."
commits = ["e2dd29eeb352f5b7fbe25f25ab92034713f91c3a"]
