# Static PV for jellyfin's movie library — external 5TB Synology share at
# /volume1/storage/media/movies (distinct from /volume1/kub/homelab where every
# other k8s PVC lives). Brought under Flux 2026-05-12; was kubectl-managed
# previously. Permanent exception: not a candidate for dynamic provisioning
# since it points at a curated media tree, not a per-PVC managed subdir.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-movies-pv
spec:
  capacity:
    storage: 5000Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  # Pre-bind to defeat the wrong-PVC-capture pitfall.
  claimRef:
    namespace: jellyfin
    name: jellyfin-movies-pvc
  nfs:
    server: __NAS-IP__
    path: /volume1/storage/media/movies
    readOnly: false
