# Static PV for jellyfin's movie library — TrueNAS NFS share at
# /mnt/movies/data (cutover from Synology 2026-07-07; distinct from the
# homelab share where every other k8s PVC lives). Brought under Flux
# 2026-05-12; was kubectl-managed previously. Permanent exception: not a
# candidate for dynamic provisioning since it points at a curated media
# tree, not a per-PVC managed subdir.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-movies-pv
spec:
  capacity:
    storage: 5000Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  # Pre-bind to defeat the wrong-PVC-capture pitfall.
  claimRef:
    namespace: jellyfin
    name: jellyfin-movies-pvc
  mountOptions:
    - nfsvers=4.1
    - noatime
    - ro
  nfs:
    server: __LAN-IP__
    path: /mnt/movies/data
    readOnly: false
