# Live-exported during Wave 0 (260511-utf), then subDir template added 2026-05-12
# alongside the jellyfin PVC rename + Wave 7-equivalent normalization.
#
# Per-PVC subdirectories auto-created at:
#   __NAS-IP__:/volume1/kub/homelab/jellyfin/<pvc-name>/
# (No namespace prefix in subDir since the SC's share is already scoped to /jellyfin/.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jellyfin
provisioner: nfs.csi.k8s.io
parameters:
  server: __NAS-IP__
  share: /volume1/kub/homelab/jellyfin
  # $$ escapes Flux envsubst so the CSI driver sees the literal ${...} template.
  subDir: $${pvc.metadata.name}
reclaimPolicy: Retain
volumeBindingMode: Immediate
