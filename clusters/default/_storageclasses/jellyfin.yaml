# Live-exported during Wave 0 (260511-utf) — repo was drifted from cluster reality.
# StorageClass.parameters are immutable, so this file must match the live SC byte-for-byte
# until Wave 5 recreates the SC. Used by jellyfin-config PVC (dynamic).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jellyfin
provisioner: nfs.csi.k8s.io
parameters:
  server: __NAS-IP__
  share: /volume1/kub/homelab/jellyfin
reclaimPolicy: Retain
volumeBindingMode: Immediate
