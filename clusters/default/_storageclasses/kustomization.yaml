# StorageClasses for the default cluster. Brought under Flux in Wave 0 of
# PV/PVC standardization (quick-260511-utf). The existing SCs (jellyfin,
# monitoring, storage, storage-db, nfs-snapclass) adopt in place via SSA — their
# definitions were live-exported to match the cluster byte-for-byte because
# StorageClass.parameters is immutable post-creation. storage-apps and storage-dbs are
# net-new and use nfs.csi.k8s.io subDir templating ($$ escapes Flux envsubst).
#
# storage-csi-storageclass.yaml (SC name: nfs-csi) is intentionally NOT listed here
# — the SC does not exist in the live cluster; Wave 5 cleanup will delete the
# file. Including it would create an unused SC.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - jellyfin.yaml
  - monitoring.yaml
  - storage-apps.yaml
  - storage-db.yaml
  - storage-dbs.yaml
  - storage.yaml
  - nfs-snapclass.yaml
