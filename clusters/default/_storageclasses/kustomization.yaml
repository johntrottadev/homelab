# StorageClasses for the default cluster. Brought under Flux in Wave 0 of
# PV/PVC standardization (quick-260511-utf, 2026-05-12). After Waves 1-2-4
# completed migration off the legacy `storage-db` SC, that SC and the
# `storage-csi-storageclass.yaml` file (which defined an unused `nfs-csi` SC, never
# in the live cluster) were both removed in Wave 5. The legacy `storage` SC was
# removed in Wave 7 (quick-260512-mxm, 2026-05-12) after Loki — its sole
# remaining binding — migrated to dynamic `storage-apps`.
#
# Current active set:
#   storage-apps — flexible SC for app data; subDir templating: ${namespace}/${pvc-name}
#   storage-dbs  — flexible SC for DB data; same subDir templating
#   jellyfin — flexible SC scoped to jellyfin's NAS root (existing, pre-Wave-0)
#   monitoring — flexible SC scoped to monitoring's NAS root (existing, pre-Wave-0)
#   nfs-snapclass — VolumeSnapshotClass for nfs.csi.k8s.io (driver-level; no
#                   active VolumeSnapshots, kept for ad-hoc snapshot capability)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - jellyfin.yaml
  - monitoring.yaml
  - storage-apps.yaml
  - storage-dbs.yaml
  - nfs-snapclass.yaml
