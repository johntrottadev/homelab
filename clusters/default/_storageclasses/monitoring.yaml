apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: monitoring
parameters:
  path: /volume1/kub/homelab/monitoring
  # Hostname retained (not __NAS-IP__). StorageClass.parameters is immutable
  # post-creation; the live SC was created with this hostname. IP swap is
  # deferred to Wave 5 cleanup when this SC is recreated.
  server: __NAS-HOST__
provisioner: nfs.csi.k8s.io
reclaimPolicy: Retain
volumeBindingMode: Immediate