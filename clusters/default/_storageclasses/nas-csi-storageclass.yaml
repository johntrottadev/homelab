apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi
provisioner: nfs.csi.k8s.io
parameters:
  # Hostname retained (not __NAS-IP__). StorageClass.parameters is immutable
  # post-creation; the live SC was created with this hostname. IP swap is
  # deferred to Wave 5 cleanup when this SC is recreated (or deleted as unused).
  server: __NAS-HOST__
  share: /volume1/kub
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
