# Legacy DB-tier SC used by static-PV-per-DB pattern that Wave 1+ migrates off.
# storage-dbs is the new flexible replacement. Path-style parameter (`path:` rather
# than canonical `share:`) retained until Wave 5 recreation; reclaimPolicy
# flipped from Delete to Retain (live SC delete+recreate handled out-of-band
# alongside this commit) since DB data must never auto-vanish on PVC delete.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-db
provisioner: nfs.csi.k8s.io
parameters:
  path: /volume1/kubdbs
  readOnly: "false"
  server: __NAS-IP__
reclaimPolicy: Retain
volumeBindingMode: Immediate
