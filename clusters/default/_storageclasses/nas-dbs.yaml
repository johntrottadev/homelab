# DB-tier NFS-backed StorageClass for database workloads.
# Per-PVC subdirectories are auto-created at:
#   __NAS-IP__:/volume1/kubdbs/<namespace>/<pvc-name>/
# Bind PVCs as RWO — single-writer semantics are expected for DB volumes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-dbs
provisioner: nfs.csi.k8s.io
parameters:
  server: __NAS-IP__
  share: /volume1/kubdbs
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - hard
  - nfsvers=4.1
