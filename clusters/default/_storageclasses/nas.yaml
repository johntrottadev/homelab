# Live-exported during Wave 0 (260511-utf) — repo was drifted from cluster reality.
# Legacy general-purpose SC used by the static-PV-per-app pattern that Wave 1+
# migrates off. storage-apps is the new flexible replacement. Match live byte-for-byte
# until Wave 5 deletes this SC.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage
provisioner: nfs.csi.k8s.io
parameters:
  server: __NAS-IP__
  share: /volume1/kub
reclaimPolicy: Retain
volumeBindingMode: Immediate
