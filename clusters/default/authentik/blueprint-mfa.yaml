# Arms the MFA validation stage that authentik ships bound-but-disabled.
#
# Out of the box `default-authentication-mfa-validation` sits at order 30 in
# `default-authentication-flow` with `not_configured_action: skip` and no
# configuration stages — so a user with no enrolled device is waved straight
# past it and the flow is effectively password-only.
#
# This blueprint flips that to `configure` and attaches the three enrollment
# stages, so an un-enrolled user is pushed into setup instead of skipped.
#
# Note on where `skip` came from: no bundled blueprint sets
# `not_configured_action` at all — `grep -rl` across /blueprints/{default,system,
# migrations} returns nothing, and the bundled flow creates the stage with
# identifiers only, no attrs. `skip` is the Django model field default. So the
# system blueprint will NOT fight this one on upgrade. It stays a blueprint
# rather than a UI click because that keeps the setting in git and re-asserts it
# if the stage object is ever recreated (fresh DB, disaster recovery).
#
# `static` is kept in device_classes so recovery codes are actually usable at
# login. The tradeoff: a user who enrolls ONLY static codes passes MFA on
# burnable one-time strings. With one human account that is managed by verifying
# a TOTP device exists; revisit if more users are added.
#
# Discovery cadence: the worker imports mounted blueprints on start and on a
# periodic task. To force it immediately:
#   kubectl -n authentik exec -i deploy/authentik-worker -- /lifecycle/ak shell <<'PY'
#   from authentik.blueprints.v1.tasks import blueprints_discovery; blueprints_discovery.send()
#   PY
#
# Rollback (no browser needed, tested end to end 2026-08-29):
#   kubectl -n authentik exec -i deploy/authentik-server -- /lifecycle/ak shell <<'PY'
#   from authentik.stages.authenticator_validate.models import AuthenticatorValidateStage
#   s = AuthenticatorValidateStage.objects.get(name="default-authentication-mfa-validation")
#   s.not_configured_action = "skip"; s.save()
#   PY
# ...then remove this file from kustomization.yaml in the same commit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-mfa
  namespace: authentik
data:
  # Only keys ending in `.yaml` are discovered by authentik's blueprint watcher.
  mfa-enforcement.yaml: |
    version: 1
    metadata:
      name: homelab-mfa-enforcement
      labels:
        blueprints.goauthentik.io/description: >-
          Enforce MFA enrollment on the default authentication flow.
    entries:
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          # `configure` pushes an un-enrolled user into the setup stages below
          # instead of skipping the check entirely.
          not_configured_action: configure
          # Deliberately narrower than the default six: duo and sms are not
          # provisioned, and email is a weak factor. `static` stays — backup
          # codes are the offline way back in.
          device_classes:
            - totp
            - webauthn
            - static
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
            - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
            - !Find [authentik_stages_authenticator_static.authenticatorstaticstage, [name, default-authenticator-static-setup]]
