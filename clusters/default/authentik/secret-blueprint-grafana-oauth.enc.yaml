# OAuth2 provider + application for Grafana.
#
# This is a Secret rather than a ConfigMap because the blueprint embeds the
# OIDC client secret. The authentik chart mounts blueprint Secrets the same way
# it mounts ConfigMaps, at /blueprints/mounted/secret-<name>/.
#
# The domain is hardcoded rather than ${BASE_DOMAIN}: Flux post-build
# substitution ordering against SOPS-decrypted content is not something to bet a
# redirect URI on, and a wrong redirect URI fails with an opaque OAuth error.
apiVersion: v1
kind: Secret
metadata:
    name: authentik-blueprint-grafana-oauth
    namespace: authentik
type: Opaque
stringData:
    grafana-oauth.yaml: ENC[AES256_GCM,data:,iv:jO5h8JJB4kYLT/V0R7n1ws0dCGiA8DZhCELiJtSwxlc=,tag:uXSwJJB7P53IwcupuZNIAg==,type:str]
