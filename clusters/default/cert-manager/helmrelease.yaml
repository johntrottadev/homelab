# cert-manager — adopting an existing kubectl-applied Helm release (rev 1, chart cert-manager-v1.20.2, JT-36).
# Flux helm-controller adopts in place when releaseName + targetNamespace + chart
# version + values match the existing release. Values mirror `helm get values cert-manager -n cert-manager`
# exactly — both DNS-01 extraArgs are required:
#   - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53  (sets upstream resolvers)
#   - --dns01-recursive-nameservers-only=true              (forces ONLY those resolvers, bypasses Pi-hole)
# ClusterIssuers (letsencrypt-prod, letsencrypt-staging) and wildcard Certificates
# are already Flux-managed (cluster-issuer-prod.yaml et al.) — out of scope for JT-36.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.0"  # pin EXACT — match running release; leading `v` matches chart version string
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
      - --dns01-recursive-nameservers-only=true
