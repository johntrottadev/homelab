# Jetstack Helm chart repository — source for cert-manager (JT-36 adoption).
# Lives in flux-system ns alongside the `csi-driver-nfs` and `grafana`
# HelmRepositories so any future cert-manager version bump is a single-line
# change in clusters/default/cert-manager/helmrelease.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.jetstack.io
