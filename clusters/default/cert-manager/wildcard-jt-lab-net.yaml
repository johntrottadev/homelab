apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-jt-lab-net
  namespace: kube-system
spec:
  secretName: wildcard-jt-lab-net
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  dnsNames:
  - "*.${BASE_DOMAIN}"
  - "${BASE_DOMAIN}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
