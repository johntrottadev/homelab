# External-IP-backend bundle for checkmk on docker-1:5000.
# Pattern mirrors clusters/default/wazuh.yaml / torrents.yaml — Service +
# EndpointSlice + IngressRoute, all in kube-system. Backend is plain HTTP
# (checkmk's mod_wsgi listener); Traefik does TLS termination at the edge.
apiVersion: v1
kind: Service
metadata:
  name: ext-checkmk
  namespace: kube-system
spec:
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-checkmk-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-checkmk
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 5000
endpoints:
  - addresses:
      - __LAN-IP__
    conditions:
      ready: true
      serving: true
      terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: checkmk-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`checkmk.${BASE_DOMAIN}`)
      kind: Rule
      services:
        - name: ext-checkmk
          port: 5000
          scheme: http
