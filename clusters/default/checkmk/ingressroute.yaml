apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: checkmk
  namespace: checkmk
spec:
  entryPoints:
    - websecure
  routes:
    # checkmk site lives at /cmk/ — the bare host redirects there, so
    # match Host only and let the app handle the path itself.
    - match: Host(`checkmk.__BASE-DOMAIN__`)
      kind: Rule
      services:
        - name: checkmk
          port: 80
