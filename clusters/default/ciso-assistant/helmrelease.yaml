# CISO Assistant (intuitem community) — official OCI chart via Flux.
# Chart 0.10.3 = appVersion v3.16.5. Backend pod runs backend + huey containers.
# DB: dedicated Postgres (postgres.ciso-assistant.svc) via externalPgsql.
# Ingress handled out-of-chart by ingressroute.yaml (Traefik websecure).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ciso-assistant
  namespace: ciso-assistant
spec:
  interval: 1h
  chart:
    spec:
      chart: ciso-assistant
      version: "0.11.6"  # appVersion v3.21.3 (images overridden to v3.21.4 below) — pin EXACT for reproducibility (bumped 2026-09-02 from 0.11.1, patch-level within 0.11.x)
      sourceRef:
        kind: HelmRepository
        name: intuitem
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      domain: ciso.${BASE_DOMAIN}
      tls: true
      image:
        registry: ghcr.io
        imagePullPolicy: IfNotPresent
    backend:
      config:
        emailAdmin: __ACME-EMAIL__
        databaseType: externalPgsql
        # secret key: django-secret-key
        djangoExistingSecretKey: ciso-assistant-secret
        djangoDebug: false
      persistence:
        # SQLite PVC is REQUIRED for the Huey task queue even with external Postgres.
        sqlite:
          enabled: true
          size: 2Gi
          storageClass: storage-apps
          accessMode: ReadWriteMany
        # Uploaded files / attachments.
        localStorage:
          enabled: true
          size: 10Gi
          storageClass: storage-apps
          accessMode: ReadWriteMany
      # First-boot runs ~350 migrations + an "initialize database" startup
      # handler that loads 180 framework libraries — CPU-bound and slow under
      # CFS throttling. Generous limits so startup isn't throttled / OOM-killed.
      # Image override: chart 0.11.6 ships appVersion v3.21.3; v3.21.4 is the
      # last v3 release (chart 0.12.x+ = app v4 major — not taken). The chart
      # renders `<registry>/<repository>:<tag>`, so tag@digest pins the
      # multi-arch index. Keep backend + frontend on the same version.
      image:
        # renovate: datasource=docker depName=ghcr.io/intuitem/ciso-assistant-community/backend
        tag: "v3.21.4@sha256:0d1ebae3b35035e45f047a889bfbd20bdd0004e329298baed5e2680ee21dd7ee"
      resources:
        requests:
          cpu: 250m
          memory: 768Mi
        limits:
          cpu: "3"
          memory: 2Gi
    frontend:
      # v3.21.4 frontend is a distroless DHI node image running as uid 1000.
      image:
        # renovate: datasource=docker depName=ghcr.io/intuitem/ciso-assistant-community/frontend
        tag: "v3.21.4@sha256:79c4028563244c45a14e3ca63b0cd66128b0d3bdbb0dc703bf4fd54e6a85d5e7"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Ingress provided by clusters/default/ciso-assistant/ingressroute.yaml instead.
    ingress:
      enabled: false
    # Dedicated Postgres in-namespace; secret key: password
    externalPgsql:
      host: postgres
      port: 5432
      user: ciso_assistant
      database: ciso_assistant
      existingSecret: ciso-assistant-secret
    # Bundled Bitnami Postgres disabled (chart-deprecated).
    postgresql:
      enabled: false
