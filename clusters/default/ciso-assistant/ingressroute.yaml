# Traefik IngressRoute on websecure (wildcard default cert: wildcard-jt-lab-net).
# Path split mirrors the chart's Ingress: /api -> backend, everything else -> frontend.
# Host && PathPrefix has a longer matcher than Host alone, so /api wins by priority.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ciso-assistant
  namespace: ciso-assistant
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ciso.${BASE_DOMAIN}`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
      services:
        - name: ciso-assistant-backend
          port: 80
    - match: Host(`ciso.${BASE_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
      services:
        - name: ciso-assistant-frontend
          port: 80
