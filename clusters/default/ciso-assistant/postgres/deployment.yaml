apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ciso-assistant
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  # Recreate: RWO volume is single-writer; never let two pods mount during rollout.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          value: ciso_assistant
        - name: POSTGRES_USER
          value: ciso_assistant
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ciso-assistant-secret
              key: password
        # Subdir keeps Postgres off the NFS mount root (lost+found / non-empty dir).
        # pgdata18: pg16->18 logical migration 2026-07-03 inits pg18 in a fresh
        # subdir; the old pg16 cluster stays at ./pgdata for rollback.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata18
        ports:
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      securityContext:
        fsGroup: 999
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: pgsql-pvc
