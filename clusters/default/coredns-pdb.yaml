# CoreDNS PodDisruptionBudget — keep >=1 DNS pod during node drains/reboots.
# Added 2026-07-03 after a single-replica CoreDNS on a flaky node caused a
# cluster-wide DNS outage. Deployment runs replicas=2 with hostname anti-affinity.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
