# crowdsec — behavioral IPS baseline. The agent DaemonSet tails container logs
# (Traefik ingress + k8s), ships parsed events to the LAPI, and the LAPI holds
# ban decisions. This baseline gives immediate detection + CrowdSec console
# enrollment. Two follow-ups (both need your input):
#   1. Traefik acquisition tuning — point the agent at Traefik access logs with
#      the traefik parser collection for HTTP-layer scenarios.
#   2. Palo Alto bouncer — a remote bouncer + PA API key so decisions become
#      firewall blocks (the enforcement half; the reason CrowdSec > maltrail).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 1h
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    container_runtime: containerd
    # Overrides the chart's default config.yaml.local, so auto_registration is
    # restated here. Two changes from the default:
    #
    # 1. agents_autodelete. The agent init container registers with
    #    --machine $POD_NAME. After a node reboot the DaemonSet pod restarts
    #    under the SAME name, the LAPI answers 403 "user already exist", and the
    #    agent crash-loops forever. That happened 2026-09-17 and all 6 agents
    #    sat in CrashLoopBackOff for 8 days, parsing nothing, while the bouncer
    #    kept serving stale decisions. Deleting machines unseen for 30m lets the
    #    next backoff retry register cleanly: self-heals in ~35m, not never.
    # 2. allowed_ranges narrowed from all of RFC1918 to the k3s pod CIDR.
    config:
      config.yaml.local: |
        api:
          server:
            auto_registration:
              enabled: true
              # Double-dollar escapes Flux postBuild substitution (strict mode):
              # Flux emits a single-dollar placeholder, which the chart's
              # entrypoint then expands from the pod's REGISTRATION_TOKEN env.
              token: "$${REGISTRATION_TOKEN}"
              allowed_ranges:
                - "127.0.0.1/32"
                - "10.42.0.0/16"
        db_config:
          flush:
            agents_autodelete:
              login_password: 30m
    agent:
      # Acquire logs from Traefik + high-value app namespaces. Broad to start;
      # tighten once scenarios are validated.
      acquisition:
        - namespace: kube-system
          podName: traefik-*
          program: traefik
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/linux"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    lapi:
      persistentVolume:
        data:
          enabled: true
          storageClassName: longhorn-ssd
          size: 2Gi
        config:
          enabled: true
          storageClassName: longhorn-ssd
          size: 100Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
