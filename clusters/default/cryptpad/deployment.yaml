apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptpad
  namespace: cryptpad
  labels:
    app: cryptpad
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cryptpad
  template:
    metadata:
      labels:
        app: cryptpad
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: cryptpad
          # Pinned to a 2024.x release. The container's entrypoint renders
          # config.js from these env vars on first start.
          image: cryptpad/cryptpad:version-2024.6.1
          imagePullPolicy: IfNotPresent
          env:
            - name: CPAD_MAIN_DOMAIN
              value: https://cryptpad.__BASE-DOMAIN__
            - name: CPAD_SANDBOX_DOMAIN
              value: https://cryptpad-sandbox.__BASE-DOMAIN__
            - name: CPAD_CONF_HTTP_PORT
              value: "3000"
            - name: CPAD_CONF_HTTP_ADDRESS
              value: 0.0.0.0
            - name: CPAD_CONF_ADMIN_EMAIL
              value: __ACME-EMAIL__
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /cryptpad/data
              subPath: data
            - name: data
              mountPath: /cryptpad/blob
              subPath: blob
            - name: data
              mountPath: /cryptpad/block
              subPath: block
            - name: data
              mountPath: /cryptpad/customize
              subPath: customize
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cryptpad-pvc
