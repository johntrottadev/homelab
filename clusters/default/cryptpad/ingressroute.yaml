apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cryptpad
  namespace: cryptpad
spec:
  entryPoints:
    - websecure
  routes:
    # CryptPad's security model requires two distinct origins served by the
    # same backend: the "unsafe" main domain and the "safe" sandbox domain.
    # Both Host() matches route to the same Service.
    - match: Host(`cryptpad.__BASE-DOMAIN__`) || Host(`cryptpad-sandbox.__BASE-DOMAIN__`)
      kind: Rule
      services:
        - name: cryptpad
          port: 80
