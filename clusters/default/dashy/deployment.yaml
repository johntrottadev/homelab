apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashy
  namespace: dashy
  labels:
    app: dashy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dashy
  template:
    metadata:
      labels:
        app: dashy
      annotations:
        # Bump to force a rolling restart that reloads conf.yml from the NFS PV.
        dashy.__BASE-DOMAIN__/conf-revision: "2026-05-01-1"
    spec:
      # IMPORTANT: dashy's image entrypoint requires root for first-run setup
      # (build assets into /app/dist, chown). Setting runAsUser/runAsGroup
      # at pod level breaks the image. Keep fsGroup-only for PVC ownership;
      # the entrypoint drops privileges to UID/GID env values internally.
      securityContext:
        fsGroup: 1000
      containers:
        - name: dashy
          # T-999.2-07: pin tag (3.1.1 from planner does not exist on Docker Hub;
          # 3.3.1 is the latest 3.x release, matches version family the running
          # :latest pod was on at cutover time).
          image: lissy93/dashy:3.3.1
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/user-data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # Cold-start vue-cli-service legacy build OOMs at 1Gi too.
              # 2Gi is the empirical floor for dashy 3.3.1 fresh build.
              # Steady-state runtime usage is ~200Mi after build completes.
              # The old :latest pod never restarted so this limit was never
              # binding for it.
              cpu: 1500m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dashy-pvc
