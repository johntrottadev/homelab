apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashy
  namespace: dashy
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashy.${BASE_DOMAIN}`)
      kind: Rule
      # CrowdSec bouncer — Traefik consults CrowdSec's decision list before
      # proxying. Pilot route; roll out to the rest once proven here.
      # Chain order matters: CrowdSec drops known-bad IPs first, so a banned
      # scanner never costs an auth round-trip. authentik then gates the rest.
      # Pilot route for forward-auth, same as it was for CrowdSec.
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
        - name: authentik-forwardauth
          namespace: kube-system
      services:
        - name: dashy
          port: 80
