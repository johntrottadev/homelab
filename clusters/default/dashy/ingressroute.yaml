apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashy
  namespace: dashy
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashy.${BASE_DOMAIN}`)
      kind: Rule
      # CrowdSec bouncer — Traefik consults CrowdSec's decision list before
      # proxying. Pilot route; roll out to the rest once proven here.
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
      services:
        - name: dashy
          port: 80
