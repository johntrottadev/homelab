apiVersion: v1
kind: PersistentVolume
metadata:
  name: dashy-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  # Pre-bind to defeat Pitfall 4 (PVC capture by wrong PV).
  claimRef:
    namespace: dashy
    name: dashy-pvc
  nfs:
    # Use NAS IP, not __NAS-HOST__ — that DNS A record currently points at
    # the Traefik LoadBalancer VIP (__K3S-VIP__), not the NAS at __NAS-IP__.
    # Existing flux PVs that use the hostname work only via cached mounts.
    server: ${NAS_HOST}
    path: /volume1/kub/homelab/dashy
    readOnly: false
