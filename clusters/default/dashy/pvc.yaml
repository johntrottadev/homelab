# Dynamic PVC against storage-apps SC (Wave 2, 260511-utf).
# Path: __NAS-IP__:/volume1/kub/homelab/dashy/dashy-pvc/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashy-pvc
  namespace: dashy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-ssd
