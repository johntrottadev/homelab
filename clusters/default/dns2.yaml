apiVersion: v1
kind: Service
metadata:
  name: ext-dns2
  namespace: kube-system
spec:
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-dns2-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-dns2
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
- name: http
  protocol: TCP
  port: 80
endpoints:
- addresses:
  - __PIHOLE2-IP__
  conditions:
    ready: true
    serving: true
    terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dns2-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`dns2.__BASE-DOMAIN__`)
    kind: Rule
    services:
    - name: ext-dns2
      port: 80
      scheme: http
