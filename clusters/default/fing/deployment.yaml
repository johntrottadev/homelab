# Image pinned to digest captured 2026-04-29 (this commit).
# Re-pin via `crane digest fing/fing-agent:latest` whenever a security/feature update is needed.
# Project policy: never `:latest`. Fing publishes ONLY rolling :latest; digest is the only stable handle.
#
# Plan deviation note (Rule 1 — bug): plan specified `fingapp/fing-agent`. That repo
# does not exist on Docker Hub ("object not found"); the canonical image is
# `fing/fing-agent`. The previous in-cluster Deployment had `fingapp/fing-agent:latest`
# which is why it was permanently scaled to 0 (image pull would have failed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fing-agent
  namespace: fing
  labels:
    app: fing-agent
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC, single-replica
  selector:
    matchLabels:
      app: fing-agent
  template:
    metadata:
      labels:
        app: fing-agent
    spec:
      # NOTE: Currently using pod-network (NOT hostNetwork). If LAN
      # discovery is incomplete after deploy, escalate to hostNetwork:true
      # in a follow-up plan. Do NOT toggle here.
      containers:
        - name: fing-agent
          image: fing/fing-agent@sha256:19dad245d2a5216e958d6616c973818aa373e394335936a05925d81c2a9e3959
          imagePullPolicy: IfNotPresent
          env:
            - name: FINGAGENT_HTTP_BIND
              value: "0.0.0.0"
            - name: FINGAGENT_HTTP_PORT
              value: "4444"
            - name: FINGAGENT_LOGGING_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 4444
              protocol: TCP
          securityContext:
            capabilities:
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/fingdata
          livenessProbe:
            httpGet:
              path: /
              port: 4444
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 4444
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fing-data
