# Static NFS PV — mirrors uptime-kuma/pv.yaml shape.
# NAS path /volume1/kub/homelab/fing is pre-created by operator
# (owned 1000:1000, mode 0755) per quick task 260429-k88 user_setup.
# Plan considered dynamic provisioning via the `storage` StorageClass; static binding
# chosen for determinism and to match the uptime-kuma precedent.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: fing-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  nfs:
    server: __NAS-HOST__
    path: /volume1/kub/homelab/fing
    readOnly: false
