apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly
  namespace: firefly
  labels:
    app: firefly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefly
  template:
    metadata:
      labels:
        app: firefly
    spec:
      # Firefly's PHP-FPM container runs as www-data (UID/GID 33).
      securityContext:
        fsGroup: 33
      containers:
        - name: firefly
          image: fireflyiii/core:version-6.1.21
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: SITE_OWNER
              value: ${ACME_EMAIL}
            - name: APP_URL
              value: https://firefly.${BASE_DOMAIN}
            - name: TRUSTED_PROXIES
              value: "**"
            - name: TZ
              value: America/New_York
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: firefly-secrets
                  key: APP_KEY
            - name: STATIC_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefly-secrets
                  key: STATIC_CRON_TOKEN
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: firefly-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: firefly
            - name: DB_USERNAME
              value: firefly
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-secrets
                  key: POSTGRES_PASSWORD
            - name: DEFAULT_LANGUAGE
              value: en_US
            - name: DEFAULT_LOCALE
              value: equal
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/storage/upload
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: firefly-pvc
