apiVersion: v1
kind: PersistentVolume
metadata:
  name: firefly-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage-db
  mountOptions:
    - hard
    - nfsvers=4.1
  claimRef:
    namespace: firefly
    name: firefly-postgres-pvc
  nfs:
    server: __NAS-HOST__
    path: /volume1/kubdbs/firefly
    readOnly: false
