# Dynamic PVC against storage-dbs SC (Wave 1, 260511-utf — DB tier).
# Path: __NAS-IP__:/volume1/kubdbs/firefly/firefly-postgres-pvc/
# Postgres is single-writer; RWO enforced (was RWX in legacy static PV — wrong).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-postgres-pvc
  namespace: firefly
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-ssd
