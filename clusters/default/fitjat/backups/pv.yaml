apiVersion: v1
kind: PersistentVolume
metadata:
  name: fitjat-mirror-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  mountOptions:
    - hard
    - nfsvers=4.1
  claimRef:
    namespace: fitjat
    name: fitjat-mirror-pvc
  csi:
    driver: nfs.csi.k8s.io
    volumeAttributes:
      server: ${NAS_HOST}
      share: /volume1/kub/homelab/fitjat-backups-mirror
    volumeHandle: fitjat-mirror-pv
