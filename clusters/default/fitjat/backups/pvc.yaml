# Dynamic PVC against storage-apps SC (Wave 2, 260511-utf).
# Path: __NAS-IP__:/volume1/kub/homelab/fitjat/fitjat-mirror-pvc/
# Was at /volume1/kub/homelab/fitjat-backups-mirror/ pre-migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fitjat-mirror-pvc
  namespace: fitjat
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: storage-apps
