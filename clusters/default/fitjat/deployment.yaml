apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitjat
  namespace: fitjat
  labels:
    app: fitjat
  annotations:
    # Stakater Reloader auto-rolls the pod when fitjat-config or fitjat-secrets
    # change (Phase 6 POL-04 — cloudflared rotation drill required this for the
    # cloudflared Deployment; same pattern applied here for fitjat-secrets
    # rotation). Patched manually during the 2026-05-07 drill; codifying here
    # in the Flux source so it survives reconciliation.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fitjat
  template:
    metadata:
      labels:
        app: fitjat
    spec:
      # Hardened security profile — fitjat image runs as UID 1001 cleanly.
      # T-999.2-04 fully applied.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fitjat
          # T-999.2-07: image pinned with both tag AND digest. Rolled back
          # to 0.1.0 on 2026-05-16 — the 1.0.0 image (built from fitjat SHA
          # 2ebffc8) hit a Drizzle migration crash on startup. The PVC's
          # __drizzle_migrations state is out of sync with the migrations in
          # the new image: 0002_session_programday_setnull does an ALTER-via-
          # recreate on `sessions`, but the live DB doesn't have that table.
          # Roll-forward blocked on schema reconciliation via
          # fitjat/runbooks/schema-migration.md (`make migrate` with backup).
          image: docker.io/blueboy8888/fitjat:0.1.0@sha256:e205d3251bee7c0ca2011bd888bebbfa6b79c5177342ec417c2792bbffa308b0
          imagePullPolicy: IfNotPresent
          envFrom:
            # ConfigMap and Secret stay kubectl-managed (the migration is
            # intentionally limited to workload + service + PVC; secrets
            # for fitjat are not in scope of this phase).
            - configMapRef:
                name: fitjat-config
            - secretRef:
                name: fitjat-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fitjat-pvc
