apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitjat
  namespace: fitjat
  labels:
    app: fitjat
  annotations:
    # Stakater Reloader auto-rolls the pod when fitjat-config or fitjat-secrets
    # change (Phase 6 POL-04 — cloudflared rotation drill required this for the
    # cloudflared Deployment; same pattern applied here for fitjat-secrets
    # rotation). Patched manually during the 2026-05-07 drill; codifying here
    # in the Flux source so it survives reconciliation.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fitjat
  template:
    metadata:
      labels:
        app: fitjat
    spec:
      # Hardened security profile — fitjat image runs as UID 1001 cleanly.
      # T-999.2-04 fully applied.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fitjat
          # T-999.2-07: image pinned with both tag AND digest. Rolled
          # 0.1.0 → 1.0.1 → 1.0.2 across 2026-05-16. 1.0.0 was a failed
          # first attempt (drizzle journal timestamp on migration 0001 was
          # earlier than 0000, causing better-sqlite3 migrator to skip it
          # on the partial prod DB). 1.0.1 fixed that. 1.0.2 adds real-use
          # polish from the POL-01 round-trip: BackBar in root layout and
          # auto-derived slug in the add-exercise forms. See
          # fitjat/runbooks/deploy.md for the round-trip procedure.
          image: docker.io/blueboy8888/fitjat:1.0.2@sha256:d9308b0150db76b5ef00616765d33f2046913ffda15a1c3953cc940c008accbf
          imagePullPolicy: IfNotPresent
          envFrom:
            # ConfigMap and Secret stay kubectl-managed (the migration is
            # intentionally limited to workload + service + PVC; secrets
            # for fitjat are not in scope of this phase).
            - configMapRef:
                name: fitjat-config
            - secretRef:
                name: fitjat-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fitjat-pvc
