# Phase 12 (SOPS-03). Kustomize patches:[] directive applies the strategic-merge
# Deployment patch to the in-cluster kustomize-controller Deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
  - path: kustomize-controller-sops-patch.yaml
    target:
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
