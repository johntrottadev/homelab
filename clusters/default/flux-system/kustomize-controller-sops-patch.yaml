# clusters/default/flux-system/kustomize-controller-sops-patch.yaml
#
# Sources:
#   .planning/phases/12-sops-age-secret-migration/12-CONTEXT.md §<decisions> D-05 step 5
#   .planning/phases/12-sops-age-secret-migration/12-RESEARCH.md §Q2 (flag verified in
#     fluxcd/kustomize-controller main.go, introduced commit 30275f2, first in v1.7.0,
#     bundled in Flux v2.7.0+; this cluster runs Flux v2.8.6)
#   .planning/phases/12-sops-age-secret-migration/12-PATTERNS.md §`kustomize-controller-sops-patch.yaml`
#
# Phase 12 (SOPS-03). Strategic-merge patch adds --sops-age-secret=sops-age
# to the kustomize-controller Deployment so it can decrypt the .enc.yaml files
# committed under clusters/default/<app>/. The patch is applied by the
# kustomize-controller TO ITSELF on the next reconcile pass via SSA.
#
# DEVIATION FROM PATTERNS.md template (intentional, recorded in 12-02-SUMMARY.md):
#   The PATTERNS.md template lists 5 args. The LIVE Flux v2.8.6 kustomize-controller
#   ships with 5 args INCLUDING `--events-addr=http://notification-controller...`
#   which the template omitted. Strategic-merge on `containers[].args` replaces the
#   entire list (no merge key on string list); applying the template's 5-arg list
#   would have DROPPED `--events-addr` and broken notification-controller event flow.
#   This patch lists all 6 args (5 live + the new `--sops-age-secret=sops-age`).
#   Live args dump captured 2026-05-15T15:39Z immediately before patch authoring.
#
#   Future Flux upgrades that add new args will require updating this patch in lockstep.
#   Alternative considered: JSON Patch with `op: add` to /args/- (append-only) — rejected
#   because it is not idempotent across reconciles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
            - --watch-all-namespaces=true
            - --log-level=info
            - --log-encoding=json
            - --enable-leader-election
            - --sops-age-secret=sops-age
