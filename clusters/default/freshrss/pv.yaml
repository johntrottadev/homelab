apiVersion: v1
kind: PersistentVolume
metadata:
  name: freshrss-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  mountOptions:
    - hard
    - nfsvers=4.1
  claimRef:
    namespace: rss
    name: freshrss-pvc
  nfs:
    # Mirrors existing PV server (immutable once Bound). __NAS-HOST__
    # latent DNS issue is documented; not in scope to fix here.
    server: __NAS-HOST__
    path: /volume1/kub/homelab/freshrss
    readOnly: false
