apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-db
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole-db
  strategy:
    # RWO Longhorn PVC + single replica: Recreate avoids the Multi-Attach
    # deadlock a rolling update would hit (new pod can't attach the volume
    # until the old one detaches).
    type: Recreate
  template:
    metadata:
      labels:
        app: guacamole-db
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: guacamole
        - name: POSTGRES_USER
          value: guacadmin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: guacamole-db-credentials
        # Subdir PGDATA (not the volume mount root): keeps initdb off the
        # ext4 lost+found and, during the pg15->18 migration (2026-07-03),
        # let pg18 init cleanly in a fresh subdir while the old pg15 cluster
        # stayed untouched at the volume root for instant rollback.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        imagePullPolicy: IfNotPresent
        name: postgres
        ports:
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: db-storage
      securityContext: {}
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: guacamole-db-pvc

