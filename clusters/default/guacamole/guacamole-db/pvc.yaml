# Dynamic PVC against storage-dbs SC (Wave 1, 260511-utf — DB tier).
# Path: __NAS-IP__:/volume1/kubdbs/guacamole/guacamole-db-pvc/
# Namespace moved from `homelab` to dedicated `guacamole` ns 2026-05-12.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guacamole-db-pvc
  namespace: guacamole
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: storage-dbs
