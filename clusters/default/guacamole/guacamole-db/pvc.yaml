# Dynamic PVC against storage-dbs SC (Wave 1, 260511-utf — DB tier).
# Path: __NAS-IP__:/volume1/kubdbs/homelab/guacamole-db-pvc/
# NOTE: namespace is `homelab` (not `guacamole`), so subDir lands at homelab/.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guacamole-db-pvc
  namespace: homelab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: storage-dbs
