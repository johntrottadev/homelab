apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
spec:
  # Parked 2026-09-02 (idle since 2026-05-04; its key sits on the bastion account
  # across ~13 hosts). That scale-down was kubectl-only, so Flux restored this
  # field to 1 on 2026-09-07. Pinned here so the decision survives re-applies.
  # guacamole-db stays up: the 28 connection definitions are kept.
  replicas: 0
  selector:
    matchLabels:
      app: guacamole
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      containers:
      - env:
        - name: GUACD_HOSTNAME
          value: guacd
        - name: POSTGRESQL_HOSTNAME
          value: guacamole-db
        - name: POSTGRESQL_DATABASE
          value: guacamole
        - name: POSTGRESQL_USER
          value: guacadmin
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: guacamole-db-credentials
        image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
        imagePullPolicy: Always
        name: guacamole
        ports:
        - containerPort: 8080
          protocol: TCP
      securityContext: {}

