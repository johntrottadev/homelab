apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      containers:
      - env:
        - name: GUACD_HOSTNAME
          value: guacd
        - name: POSTGRESQL_HOSTNAME
          value: guacamole-db
        - name: POSTGRESQL_DATABASE
          value: guacamole
        - name: POSTGRESQL_USER
          value: guacadmin
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: guacamole-db-credentials
        image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
        imagePullPolicy: Always
        name: guacamole
        ports:
        - containerPort: 8080
          protocol: TCP
      securityContext: {}

