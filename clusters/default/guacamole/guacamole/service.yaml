apiVersion: v1
kind: Service
metadata:
  # Service name intentionally differs from deployment name (legacy);
  # the IngressRoute references this name.
  name: guacamole-service
  namespace: guacamole
  labels:
    app: guacamole
spec:
  type: ClusterIP
  selector:
    app: guacamole
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
