apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: guacamole
spec:
  # Parked 2026-09-02 (idle since 2026-05-04; its key sits on the bastion account
  # across ~13 hosts). That scale-down was kubectl-only, so Flux restored this
  # field to 1 on 2026-09-07. Pinned here so the decision survives re-applies.
  # guacamole-db stays up: the 28 connection definitions are kept.
  replicas: 0
  selector:
    matchLabels:
      app: guacd
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: guacd
    spec:
      containers:
      - image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
        imagePullPolicy: Always
        name: guacd
        ports:
        - containerPort: 4822
          protocol: TCP
      securityContext: {}

