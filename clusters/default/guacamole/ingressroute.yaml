apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guac
  namespace: guacamole
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`guac.${BASE_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
      services:
        - name: guacamole-service
          port: 8080
