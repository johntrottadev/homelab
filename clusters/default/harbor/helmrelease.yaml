# harbor — private image registry, gives k3s-builder outputs a home and adds
# supply-chain hygiene (signing, RBAC). TLS terminates at Traefik; the chart's
# internal nginx proxy is fronted by our IngressRoute (harbor.__BASE-DOMAIN__).
# Storage: registry blobs on storage-apps (NAS-backed, grows), component DBs on
# longhorn-ssd. Internal Trivy DISABLED — trivy-operator already scans running
# images cluster-wide; flip trivy.enabled=true later if you want on-push registry
# scanning too. Admin password + secretKey come from the SOPS harbor-secrets.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 1h
  chart:
    spec:
      chart: harbor
      version: "1.19.1"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    externalURL: https://harbor.${BASE_DOMAIN}
    expose:
      type: clusterIP
      tls:
        enabled: false
    existingSecretAdminPassword: harbor-secrets
    existingSecretAdminPasswordKey: admin-password
    existingSecretSecretKey: harbor-secrets
    updateStrategy:
      type: Recreate
    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          storageClass: storage-apps
          size: 50Gi
        jobservice:
          jobLog:
            storageClass: longhorn-ssd
            size: 1Gi
        database:
          storageClass: longhorn-ssd
          size: 8Gi
        redis:
          storageClass: longhorn-ssd
          size: 2Gi
        trivy:
          storageClass: longhorn-ssd
          size: 5Gi
    trivy:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: prometheus
    core:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    registry:
      registry:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      controller:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    jobservice:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    portal:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
    database:
      internal:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    redis:
      internal:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
