apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: hoarder
  labels:
    app: chrome
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
    spec:
      containers:
        - name: chrome
          # Mirrors running spec — :latest is intentional for now (cluster pod
          # has been on this for ~13 months without restart). Pin to a digest
          # in a future hardening pass.
          image: browserless/chrome:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: ENABLE_DEBUGGER
              value: "true"
            - name: FUNCTION_ENABLE_INCOGNITO_MODE
              value: "true"
            - name: DEFAULT_STEALTH
              value: "true"
            - name: CONNECTION_TIMEOUT
              value: "60000"
            - name: WORKSPACE_DIR
              value: /tmp/workspace
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
