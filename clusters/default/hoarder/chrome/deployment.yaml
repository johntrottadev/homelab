apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: hoarder
  labels:
    app: chrome
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
    spec:
      containers:
        - name: chrome
          # karakeep's officially-tested crawler image (headless Chromium exposing
          # CDP on :9222). Migrated off the deprecated, floating browserless/chrome:latest
          # on 2026-07-03. Browserless v2 was rejected: it needs a token + native
          # Playwright endpoint that is version-coupled to karakeep's Playwright and
          # breaks on karakeep upgrades. This CDP path is what karakeep ships/tests.
          # Note: gcr.io/zenika-hub/alpine-chrome is amd64-only (our nodes are amd64).
          image: gcr.io/zenika-hub/alpine-chrome:124
          imagePullPolicy: IfNotPresent
          args:
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --hide-scrollbars
          ports:
            - containerPort: 9222
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
