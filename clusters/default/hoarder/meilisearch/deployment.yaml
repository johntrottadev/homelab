apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: hoarder
  labels:
    app: meilisearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.42.1
          imagePullPolicy: Always
          envFrom:
            # Secret stays kubectl-managed (out-of-band; matches web/deployment.yaml).
            # Phase 1 (SEC-01) hardening: was previously keyless dev mode (RESEARCH Pitfall #4).
            - secretRef:
                name: hoarder-secrets
          env:
            - name: MEILI_ENV
              value: production
          ports:
            - containerPort: 7700
              protocol: TCP
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
      volumes:
        - name: meilisearch-data
          persistentVolumeClaim:
            claimName: meilisearch-pvc
