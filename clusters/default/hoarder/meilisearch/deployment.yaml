apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: hoarder
  labels:
    app: meilisearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.49.0@sha256:bdc7d7e7939911c40d88d6bcd01f9c72c81f7293135916d48bce241569f721bd
          imagePullPolicy: Always
          envFrom:
            # Secret stays kubectl-managed (out-of-band; matches web/deployment.yaml).
            # Phase 1 (SEC-01) hardening: was previously keyless dev mode (RESEARCH Pitfall #4).
            - secretRef:
                name: hoarder-secrets
          env:
            - name: MEILI_ENV
              value: production
            # In-place DB migration across the v1.42->v1.48 index-format change
            # (2026-07-03 upgrade). Safe to remove once migrated.
            - name: MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE
              value: "true"
          ports:
            - containerPort: 7700
              protocol: TCP
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
      volumes:
        - name: meilisearch-data
          persistentVolumeClaim:
            claimName: meilisearch-pvc
