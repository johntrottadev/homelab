apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: hoarder
  labels:
    app: meilisearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.53.1@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
          imagePullPolicy: Always
          envFrom:
            # Secret stays kubectl-managed (out-of-band; matches web/deployment.yaml).
            # Phase 1 (SEC-01) hardening: was previously keyless dev mode (RESEARCH Pitfall #4).
            - secretRef:
                name: hoarder-secrets
          env:
            - name: MEILI_ENV
              value: production
            # In-place DB migration. MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE was the
            # flag for the v1.42->v1.48 change (2026-07-03); newer engines renamed
            # it to MEILI_UPGRADE_DB, so the old key silently stopped applying.
            # The image moved to v1.53.1 while the data stayed at 1.49.0 and the
            # engine refused to start — 230 restarts. Both keys are kept so the
            # migration works regardless of which one this engine honours.
            # Safe to remove once the on-disk version matches the engine.
            - name: MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE
              value: "true"
            - name: MEILI_UPGRADE_DB
              value: "true"
          ports:
            - containerPort: 7700
              protocol: TCP
          volumeMounts:
            - name: meilisearch-data
              mountPath: /meili_data
      volumes:
        - name: meilisearch-data
          persistentVolumeClaim:
            claimName: meilisearch-pvc
