apiVersion: v1
kind: Namespace
metadata:
  name: hoarder
  labels:
    # Pod Security Admission - the API-server-native floor. Kyverno enforces
    # the same baseline, but through a webhook with failurePolicy=Ignore on a
    # single replica: if Kyverno is down, evicted, or mid-upgrade, everything
    # admits unchecked and nothing logs a denial. PSA has no such dependency.
    pod-security.kubernetes.io/enforce: baseline
    # restricted at audit/warn only - visibility toward a future tightening,
    # with no admission impact today.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
