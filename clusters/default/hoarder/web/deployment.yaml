apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hoarder
  labels:
    app: web
spec:
  replicas: 1
  strategy:
    type: Recreate  # single RWO longhorn PVC: avoid Multi-Attach deadlock on rollout
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/karakeep-app/karakeep:0.32.0@sha256:64d6a9bbf2d37b5c808cf06b5d87f1f1c7846fdd3844724145a9741aeb06fd31
          imagePullPolicy: IfNotPresent
          envFrom:
            # Secret + ConfigMap stay kubectl-managed (intentional — secret
            # values not in scope of this phase).
            - secretRef:
                name: hoarder-secrets
            - configMapRef:
                name: hoarder-configuration
          env:
            - name: MEILI_ADDR
              value: http://meilisearch:7700
            - name: BROWSER_WEB_URL
              value: http://chrome:9222
            - name: DATA_DIR
              value: /data
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
