apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hoarder
  labels:
    app: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/karakeep-app/karakeep:0.31.0
          imagePullPolicy: IfNotPresent
          envFrom:
            # Secret + ConfigMap stay kubectl-managed (intentional — secret
            # values not in scope of this phase).
            - secretRef:
                name: hoarder-secrets
            - configMapRef:
                name: hoarder-configuration
          env:
            - name: MEILI_ADDR
              value: http://meilisearch:7700
            - name: BROWSER_WEB_URL
              value: http://chrome:9222
            - name: DATA_DIR
              value: /data
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
