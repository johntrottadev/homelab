apiVersion: v1
kind: PersistentVolume
metadata:
  name: hoarder-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  claimRef:
    namespace: hoarder
    name: data-pvc
  nfs:
    server: __NAS-HOST__
    path: /volume1/kub/homelab/hoarder/data
    readOnly: false
