apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
  labels:
    app.kubernetes.io/instance: homarr
    app.kubernetes.io/name: homarr
    app.kubernetes.io/version: v1.50.0
    helm.sh/chart: homarr-8.9.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: homarr
      app.kubernetes.io/name: homarr
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: homarr
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: homarr
        app.kubernetes.io/version: v1.50.0
        helm.sh/chart: homarr-8.9.0
    spec:
      containers:
      - env:
        - name: ENABLE_DOCKER
          value: 'false'
        - name: ENABLE_KUBERNETES
          value: 'false'
        - name: AUTH_LDAP_GROUP_CLASS
          value: groupOfUniqueNames
        - name: AUTH_LDAP_GROUP_MEMBER_ATTRIBUTE
          value: member
        - name: AUTH_LDAP_GROUP_MEMBER_USER_ATTRIBUTE
          value: dn
        - name: AUTH_LDAP_SEARCH_SCOPE
          value: base
        - name: AUTH_LDAP_USERNAME_ATTRIBUTE
          value: uid
        - name: AUTH_LDAP_USER_MAIL_ATTRIBUTE
          value: mail
        - name: AUTH_OIDC_AUTO_LOGIN
          value: 'false'
        - name: AUTH_OIDC_CLIENT_NAME
          value: OIDC
        - name: AUTH_OIDC_GROUPS_ATTRIBUTE
          value: groups
        - name: AUTH_OIDC_SCOPE_OVERWRITE
          value: openid email profile groups
        - name: AUTH_PROVIDERS
          value: credentials
        - name: AUTH_SESSION_EXPIRY_TIME
          value: 30d
        - name: ENABLE_DNS_CACHING
          value: 'false'
        - name: LOG_LEVEL
          value: info
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: '0'
        - name: NO_EXTERNAL_CONNECTION
          value: 'false'
        - name: TZ
          value: Europe/Paris
        - name: DB_MIGRATIONS_DISABLED
          value: 'false'
        - name: DB_DRIVER
          value: better-sqlite3
        - name: DB_DIALECT
          value: sqlite
        - name: DB_URL
          value: /appdata/db/db.sqlite
        - name: SECRET_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: db-encryption-key
              name: db-secret
        image: ghcr.io/homarr-labs/homarr:v1.59.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health/live
            port: 7575
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: homarr
        ports:
        - containerPort: 7575
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health/ready
            port: 7575
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        securityContext: {}
        volumeMounts:
        - mountPath: /appdata/db
          name: homarr-database
      securityContext: {}
      volumes:
      - name: homarr-database
        persistentVolumeClaim:
          claimName: homarr-database-pvc

