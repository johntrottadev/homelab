apiVersion: v1
kind: PersistentVolume
metadata:
  name: homarr-database
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage-db
  claimRef:
    namespace: homarr
    name: homarr-database
  nfs:
    server: ${NAS_HOST}
    path: /volume1/kubdbs/homelab/homarr
    readOnly: false
