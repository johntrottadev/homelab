# Dynamic PVC against storage-dbs SC (Wave 1, 260511-utf — DB tier).
# Path: __NAS-IP__:/volume1/kubdbs/homarr/homarr-database/
# Was previously at /kubdbs/homelab/homarr/ — Wave 1 cutover relocated data to
# the canonical ${namespace}/${pvc-name} template path.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-database-pvc
  namespace: homarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-ssd
