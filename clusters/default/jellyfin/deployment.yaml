apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  # Recreate (not RollingUpdate): jellyfin has a single RWO longhorn-ssd config
  # PVC. A rolling update spins a 2nd pod that can't attach the volume (Multi-Attach
  # deadlock). Recreate stops the old pod first, releasing the volume. (2026-07-03)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
      annotations:
        # 5TB media volume is excluded from Velero backups (movies are
        # backed up at the NAS layer; doubling them in cluster snapshots
        # would blow out backup storage).
        backup.velero.io/backup-volumes-excludes: movies
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          imagePullPolicy: Always
          ports:
            - containerPort: 8096
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /media/movies
      volumes:
        - name: config
          persistentVolumeClaim:
            # Both PVCs are now Flux-managed under jellyfin-config-pvc.yaml and
            # jellyfin-movies-pvc.yaml (renamed 2026-05-12 to match the
            # project-wide <name>-pvc convention; jellyfin SC also gained a
            # subDir template so config lands at /jellyfin/jellyfin-config-pvc/).
            claimName: jellyfin-config-pvc
        - name: movies
          persistentVolumeClaim:
            claimName: jellyfin-movies-pvc
