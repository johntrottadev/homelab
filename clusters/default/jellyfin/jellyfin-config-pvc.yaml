# Dynamic PVC against the storage-apps StorageClass.
# Path: __NAS-IP__:/volume1/kub/homelab/jellyfin/jellyfin-config-pvc/
# Renamed from `jellyfin-config` 2026-05-12 to follow the project-wide <name>-pvc
# naming convention. Migrated from the (now-deleted) `jellyfin` SC to `storage-apps`
# 2026-05-12 (Wave 8 of storage standardization) — storage-apps subDir template
# ${ns}/${pvc-name} resolves to the same NFS path, so this was a metadata-only
# swap with no data movement.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: storage-apps
