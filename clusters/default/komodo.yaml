# JT-40 follow-up — Komodo Core UI exposure on https://komodo.__BASE-DOMAIN__.
# Pattern 5 (external-IP-backend bundle): Service + EndpointSlice + IngressRoute,
# all in kube-system. HTTP upstream on docker-1:9120 (Komodo Core's container port);
# Traefik fronts it with the wildcard *.__BASE-DOMAIN__ cert at :443.
#
# Note: Komodo Core's KOMODO_HOST in /opt/komodo/.env is still set to
# http://__LAN-IP__:9120 (legacy LAN-direct value). After this lands, consider
# updating KOMODO_HOST=https://komodo.__BASE-DOMAIN__ so OAuth callback URLs and
# webhook URLs the UI suggests use the public ingress instead. That edit is
# out-of-band on docker-1 (the .env is host-only) — not in this commit.
apiVersion: v1
kind: Service
metadata:
  name: ext-komodo
  namespace: kube-system
spec:
  ports:
  - name: http
    protocol: TCP
    port: 9120
    targetPort: 9120
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-komodo-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-komodo
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
- name: http
  protocol: TCP
  port: 9120
endpoints:
- addresses:
  - __LAN-IP__
  conditions:
    ready: true
    serving: true
    terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: komodo-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`komodo.${BASE_DOMAIN}`)
    kind: Rule
    services:
    - name: ext-komodo
      port: 9120
      scheme: http
