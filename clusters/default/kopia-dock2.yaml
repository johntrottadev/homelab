# IngressRoute bundle for the read-only Kopia web UI on docker-2.
# Browser → https://kopia-docker-2.__BASE-DOMAIN__ → Traefik → http://__LAN-IP__:51515
# Basic auth (user=kopia, password in /etc/kopia/env on docker-2).
apiVersion: v1
kind: Service
metadata:
  name: ext-kopia-docker-2
  namespace: kube-system
spec:
  ports:
    - name: http
      protocol: TCP
      port: 51515
      targetPort: 51515
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-kopia-docker-2-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-kopia-docker-2
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 51515
endpoints:
  - addresses:
      - __LAN-IP__
    conditions:
      ready: true
      serving: true
      terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kopia-docker-2-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kopia-docker-2.${BASE_DOMAIN}`)
      kind: Rule
      services:
        - name: ext-kopia-docker-2
          port: 51515
          scheme: http
