  # Traefik IngressRoute (websecure, wildcard default cert). Host: ciso.${BASE_DOMAIN}.
  - ciso-assistant/namespace.yaml
  - ciso-assistant/helmrepository.yaml
  # keys: password (db) + django-secret-key
  - ciso-assistant/secret-ciso-assistant.enc.yaml
  - ciso-assistant/postgres/pvc.yaml
  - ciso-assistant/postgres/deployment.yaml
  - ciso-assistant/postgres/service.yaml
  - ciso-assistant/helmrelease.yaml
  - ciso-assistant/ingressroute.yaml

