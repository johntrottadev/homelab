  # the day. To be re-engineered from the ground up; rclone-cronjob.yaml is
  # removed from resources below. secret-rclone-wasabi retained for the rebuild.
  # Postgres on local-path (node-pinned, fast), daily pg_dump → NFS for
  # safety. Redis ephemeral (file locking + memcache).
  # Secrets applied manually (paloarp pattern); see clusters/default/nextcloud/README.md.
  # Phase 12 wave 12-06 — were secret-{nextcloud,rclone-wasabi}.template (kubectl apply).
