  # Bucket A — admin-user, admin-password, db-password. Was kubectl one-liner.
  - paperless/secret-paperless.enc.yaml
  - paperless/ingressroute.yaml
  # paperless/paperless/pv.yaml + pv-media.yaml removed — Wave 1 (260511-utf) migrated to dynamic storage-apps SC.
  - paperless/paperless/pvc.yaml
  - paperless/paperless/deployment.yaml
  - paperless/paperless/service.yaml
  # paperless/postgres/pv.yaml removed — Wave 1 (260511-utf) migrated to dynamic storage-dbs SC.
  - paperless/postgres/pvc.yaml
  - paperless/postgres/deployment.yaml
  - paperless/postgres/service.yaml
  - paperless/redis/deployment.yaml
  - paperless/redis/service.yaml

