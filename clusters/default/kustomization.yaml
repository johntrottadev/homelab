  - libre/namespace.yaml
  # libre/pv.yaml removed — Wave 2 (260511-utf) migrated to dynamic storage-apps SC.
  - libre/pvc.yaml
  - libre/deployment.yaml
  - libre/service.yaml
  - libre/ingressroute.yaml

  # Phase 999.2 plan-02 — n8n (per-app subdir; supersedes top-level n8n.yaml).
  # PV file deleted in Wave 1 of PV/PVC standardization (quick-260511-utf);
  # n8n/pvc.yaml now provisions dynamically against the storage-apps SC.
  - n8n/namespace.yaml
  - n8n/pvc.yaml
  - n8n/deployment.yaml
  - n8n/service.yaml
  - n8n/ingressroute.yaml

  # Phase 999.2 plan-02 — jellyfin (supersedes top-level jellyfin.yaml).
