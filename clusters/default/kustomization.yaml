# Flux entrypoint for cluster `default` (k3s, 5 nodes, kube-vip VIP __K3S-VIP__).
#
# Referenced by `Kustomization flux-system/flux-system` with `spec.path: ./clusters/default`.
# Flux's source-controller fetches this repo; kustomize-controller applies the resources
# listed below. New cluster-shared manifests land here; per-app k8s objects (PVCs, Deployments,
# Services) continue to live in their per-app directories at the repo root and are referenced
# from this list.
#
# Bootstrap created during Phase 14 Wave 1 prep
# (bastion .planning/phases/14-traefik-cert-manager-subdomain-split/) — Plan 14-04 will append:
#   - cert-manager/cluster-issuer-prod.yaml
#   - cert-manager/cluster-issuer-staging.yaml
#   - cert-manager/wildcard-jt-lab-net.yaml
#   - traefik/tlsstore-default.yaml
#   - traefik/serverstransport-lan-self-signed.yaml
#
# Kept as `explicit-list` (not `directory-scan`) so reviewers see exactly what Flux applies.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Wave 1 — cert-manager + Traefik shared
  - cert-manager/cluster-issuer-prod.yaml
  - cert-manager/cluster-issuer-staging.yaml
  - cert-manager/wildcard-jt-lab-net.yaml
  - cert-manager/wildcard-jt-lab-net-staging.yaml
  # JT-36 — adopt cert-manager (cert-manager ns) into Flux. Was kubectl-applied via
  # `helm install` (rev 1, chart cert-manager-v1.20.2). Adoption is in place:
  # helm-controller takes ownership of the existing release because releaseName +
  # targetNamespace + chart version + values all match. ClusterIssuers and wildcard
  # Certificates above are already Flux-managed — out of scope.
  - cert-manager/helmrepository.yaml
  - cert-manager/helmrelease.yaml
  - traefik/tlsstore-default.yaml
  - traefik/serverstransport-lan-self-signed.yaml

  # Wave 4 — Traefik k3s HelmChartConfig (Phase 13 values + Phase 14 D-04 redirect).
  # Brings the previously kubectl-applied HelmChartConfig under Flux management.
  - traefik/helmchartconfig.yaml

  # Wave 2 — cluster-app IngressRoutes (Pattern 4 — one file per cluster-routed host
  # in 14-NPM-INVENTORY.md; IngressRoute lives in the app's namespace, no Service)
  # Workload + routing — uptime-kuma precedent (homelab GitOps migration scope).
  - netalert/namespace.yaml
  - netalert/pv.yaml
  - netalert/pvc.yaml
  - netalert/deployment.yaml
  - netalert/service.yaml
  - netalert/endpoints.yaml
  - netalert/ingressroute.yaml
  # freshrss.yaml superseded by freshrss/ subdir below (Phase 999.2 plan-02)
  - grafana.yaml
  # guac.yaml superseded by guacamole/ subdir below (Phase 999.2 plan-03)
  # hoarder.yaml superseded by hoarder/ subdir below (Phase 999.2 plan-03)
  # homarr.yaml superseded by homarr/ subdir below (Phase 999.2 spinoff)
  # ittools.yaml superseded by ittools/ subdir below (Phase 999.2 plan-01)
  # jellyfin.yaml superseded by jellyfin/ subdir below (Phase 999.2 plan-02)
  # libre.yaml superseded by libre/ subdir below (Phase 999.2 plan-01)
  # n8n.yaml superseded by n8n/ subdir below (Phase 999.2 plan-02)
  # paperless.yaml superseded by paperless/ subdir below (Phase 999.2 plan-03)
  - prometheus.yaml
  # Workload + routing — preview of v1.2 GitOps migration scope.
  # Unlike the IngressRoute-only files above, this subdirectory holds the full
  # uptime-kuma workload (Namespace/PV/PVC/Deployment/Service/IngressRoute).
  # Don't propagate this pattern to other apps yet — the migration phase will
  # sequence per-app moves explicitly.
  - uptime-kuma/namespace.yaml
  - uptime-kuma/pv.yaml
  - uptime-kuma/pvc.yaml
  - uptime-kuma/deployment.yaml
  - uptime-kuma/service.yaml
  - uptime-kuma/ingressroute.yaml

  # Phase 999.2 plan-01 — dashy (full per-app subdir; supersedes top-level dashy.yaml,
  # which never existed; IR moves into the subdir). Manifest mirrors the working
  # kubectl spec; only intentional diff is image pin :latest → :3.3.1.
  - dashy/namespace.yaml
  - dashy/pv.yaml
  - dashy/pvc.yaml
  - dashy/deployment.yaml
  - dashy/service.yaml
  - dashy/ingressroute.yaml

  # Phase 999.2 plan-01 — ittools (per-app subdir; supersedes top-level ittools.yaml).
  # PVC kept kubectl-managed (local-path dynamically-provisioned, single-node pinned).
  # Image already digest-pinned; no spec drift from running pod.
  - ittools/namespace.yaml
  - ittools/deployment.yaml
  - ittools/service.yaml
  - ittools/ingressroute.yaml

  # Phase 999.2 plan-01 — libre / libreoffice (per-app subdir; supersedes top-level libre.yaml).
  # linuxserver image — root entrypoint + PUID/PGID env. Multi-port service
  # (80→3000 http, 443→3001 https). PV uses NAS IP, mountOptions preserved.
  - libre/namespace.yaml
  - libre/pv.yaml
  - libre/pvc.yaml
  - libre/deployment.yaml
  - libre/service.yaml
  - libre/ingressroute.yaml

  # Phase 999.2 plan-02 — n8n (per-app subdir; supersedes top-level n8n.yaml).
  # PV mirrors existing __NAS-HOST__ hostname (immutable once Bound).
  - n8n/namespace.yaml
  - n8n/pv.yaml
  - n8n/pvc.yaml
  - n8n/deployment.yaml
  - n8n/service.yaml
  - n8n/ingressroute.yaml

  # Phase 999.2 plan-02 — jellyfin (supersedes top-level jellyfin.yaml).
  # PVCs stay kubectl-managed: jellyfin-config is CSI-dynamic (nfs.csi.k8s.io,
  # SC=jellyfin), jellyfin-movies is statically bound to a 5TB __NAS-HOST__
  # NFS volume excluded from Velero backups.
  - jellyfin/namespace.yaml
  - jellyfin/deployment.yaml
  - jellyfin/service.yaml
  - jellyfin/ingressroute.yaml

  # Phase 999.2 plan-02 — freshrss (in ns "rss", supersedes top-level freshrss.yaml).
  - freshrss/namespace.yaml
  - freshrss/pv.yaml
  - freshrss/pvc.yaml
  - freshrss/deployment.yaml
  - freshrss/service.yaml
  - freshrss/ingressroute.yaml

  # Phase 999.2 plan-02 — vscode (deploy "code-server", IR "vs", host vs.__BASE-DOMAIN__,
  # supersedes top-level vs.yaml). Privileged container intentional — IDE.
  - vscode/namespace.yaml
  - vscode/pv.yaml
  - vscode/pvc.yaml
  - vscode/deployment.yaml
  - vscode/service.yaml
  - vscode/ingressroute.yaml

  # Phase 999.2 plan-02 — fitjat (main deploy + svc + primary PVC).
  # No IngressRoute — external access is via Cloudflare Tunnel, not Traefik.
  - fitjat/namespace.yaml
  - fitjat/pv.yaml
  - fitjat/pvc.yaml
  - fitjat/deployment.yaml
  - fitjat/service.yaml

  # Phase 999.2 spinoff — fitjat continuation (cloudflared tunnel + backups).
  # cloudflared-token Secret and cloudflared-info ConfigMap stay kubectl-managed
  # (token is sensitive; CM content is config detail).
  - fitjat/cloudflared/deployment.yaml
  - fitjat/backups/pv.yaml
  - fitjat/backups/pvc.yaml
  - fitjat/backups/cronjob-backup.yaml
  - fitjat/backups/cronjob-backup-health.yaml
  - fitjat/backups/cronjob-rsync-storage.yaml

  # Phase 999.2 spinoff — homarr (was Helm-managed via homarr-8.9.0 chart;
  # superseded by flat manifests; supersedes top-level homarr.yaml).
  # The 5 sh.helm.release.v1.homarr.* secrets remain in the namespace as
  # historical record; harmless. db-secret (SECRET_ENCRYPTION_KEY) stays
  # kubectl-managed (sensitive, scope-out).
  - homarr/namespace.yaml
  - homarr/pv.yaml
  - homarr/pvc.yaml
  - homarr/deployment.yaml
  - homarr/service.yaml
  - homarr/ingressroute.yaml

  # Phase 999.2 plan-03 — hoarder (per-component subdirs; supersedes hoarder.yaml).
  # 3 components: web (port 3000, svc 80), chrome (headless browser, port 3000,
  # svc 9222), meilisearch (port 7700). Secrets + ConfigMap stay kubectl-managed.
  - hoarder/namespace.yaml
  - hoarder/ingressroute.yaml
  - hoarder/web/pv.yaml
  - hoarder/web/pvc.yaml
  - hoarder/web/deployment.yaml
  - hoarder/web/service.yaml
  - hoarder/chrome/deployment.yaml
  - hoarder/chrome/service.yaml
  - hoarder/meilisearch/pv.yaml
  - hoarder/meilisearch/pvc.yaml
  - hoarder/meilisearch/deployment.yaml
  - hoarder/meilisearch/service.yaml

  # Phase 999.2 plan-03 — paperless (per-component subdirs; supersedes paperless.yaml).
  # 3 components: paperless-ngx (web, port 8000), postgres (port 5432, fsGroup 999),
  # redis (port 6379, in-memory cache, no PV). Admin/DB credentials are inline env
  # values in the running spec (pre-existing security debt; out of scope here).
  - paperless/namespace.yaml
  - paperless/ingressroute.yaml
  - paperless/paperless/pv.yaml
  - paperless/paperless/pv-media.yaml
  - paperless/paperless/pvc.yaml
  - paperless/paperless/deployment.yaml
  - paperless/paperless/service.yaml
  - paperless/postgres/pv.yaml
  - paperless/postgres/pvc.yaml
  - paperless/postgres/deployment.yaml
  - paperless/postgres/service.yaml
  - paperless/redis/deployment.yaml
  - paperless/redis/service.yaml

  # Phase 999.2 plan-03 — guacamole (per-component subdirs in homelab ns;
  # supersedes guac.yaml). 3 components: guacamole (web, svc named
  # "guacamole-service"), guacd (proxy, port 4822), guacamole-db (postgres,
  # 5Gi PV at /volume1/kubdbs/homelab/guacamole). Stays in homelab ns so the
  # existing guacamole-db-pv claimRef.namespace remains valid.
  - guacamole/ingressroute.yaml
  - guacamole/guacamole/deployment.yaml
  - guacamole/guacamole/service.yaml
  - guacamole/guacd/deployment.yaml
  - guacamole/guacd/service.yaml
  - guacamole/guacamole-db/pv.yaml
  - guacamole/guacamole-db/pvc.yaml
  - guacamole/guacamole-db/deployment.yaml
  - guacamole/guacamole-db/service.yaml

  # Phase 999.2 spinoff — monitoring exporters (4 deployments + services in
  # the existing monitoring ns). ConfigMaps (blackbox-exporter-config,
  # snmp-exporter-config), Secrets (backup-host-exporter-secrets, pihole-exporter-secrets),
  # and ServiceMonitors (backup-host-exporter, pihole-exporter — release: prometheus
  # label preserved) intentionally stay kubectl-managed: cm content is config
  # detail, secrets are creds, ServiceMonitors are owned by kube-prometheus-stack
  # adjacent tooling.
  - monitoring/blackbox-exporter/deployment.yaml
  - monitoring/blackbox-exporter/service.yaml
  - monitoring/backup-host-exporter/deployment.yaml
  - monitoring/backup-host-exporter/service.yaml
  - monitoring/pihole-exporter/deployment.yaml
  - monitoring/pihole-exporter/service.yaml
  - monitoring/snmp-exporter/deployment.yaml
  - monitoring/snmp-exporter/service.yaml

  # speedtest-exporter — Ookla CLI Prometheus exporter. Hourly scrape via
  # ServiceMonitor (Flux-managed unlike the older backup-host/pihole exporters,
  # because there's no historical kubectl-applied SM to preserve).
  # Pairs with grafana.com dashboard 13665.
  - monitoring/speedtest-exporter/deployment.yaml
  - monitoring/speedtest-exporter/service.yaml
  - monitoring/speedtest-exporter/servicemonitor.yaml
  - monitoring/speedtest-exporter/grafana-dashboard-cm.yaml

  # bastion dashboard — Grafana visualization for the 34 opsman_* metrics
  # exposed by the LXC at __LAN-IP__:9090 (scraped via additionalScrapeConfigs
  # in the kube-prometheus-stack helmrelease). Sidecar auto-imports via
  # `grafana_dashboard: '1'` label. 6 rows / 24 panels covering overview,
  # drift+gitops, task runs, approval gate, audit catalog, subsystem health.
  - monitoring/bastion-dashboard/grafana-dashboard-cm.yaml

  # Nextcloud — filesystem-primary on NFS (cutover 2026-05-04 from MinIO-
  # primary, which itself replaced Wasabi-primary on 2026-04-30; the MinIO
  # ns + replicate-cronjob were removed in this same change). User uploads
  # land at /var/www/html/data/<user>/files/ on nextcloud-data-pv; the
  # nextcloud-rclone-wasabi CronJob mirrors that tree to Wasabi every
  # 15 min as real-named S3 objects (Wasabi is standalone-restorable).
  # Postgres on local-path (node-pinned, fast), daily pg_dump → NFS for
  # safety. Redis ephemeral (file locking + memcache).
  # Secrets applied out-of-band (paloarp pattern); see clusters/default/nextcloud/README.md.
  - nextcloud/namespace.yaml
  - nextcloud/postgres-pvc.yaml
  - nextcloud/postgres-deployment.yaml
  - nextcloud/postgres-service.yaml
  - nextcloud/postgres-backup-pv.yaml
  - nextcloud/postgres-backup-pvc.yaml
  - nextcloud/postgres-backup-cronjob.yaml
  - nextcloud/redis-deployment.yaml
  - nextcloud/redis-service.yaml
  - nextcloud/pv.yaml
  - nextcloud/pvc.yaml
  - nextcloud/data-pv.yaml
  - nextcloud/data-pvc.yaml
  - nextcloud/deployment.yaml
  - nextcloud/service.yaml
  - nextcloud/ingressroute.yaml
  - nextcloud/cronjob.yaml
  - nextcloud/rclone-cronjob.yaml
  # Workload + routing — log aggregation (Loki monolithic + Promtail).
  # Internal-only: NO IngressRoute. Grafana queries via in-cluster Service.
  # First flux-managed HelmRepository + HelmRelease in this repo.
  - loki/namespace.yaml
  - loki/helmrepository-grafana.yaml
  - loki/loki-pv.yaml
  - loki/loki-helmrelease.yaml
  - loki/promtail-helmrelease.yaml
  - loki/grafana-datasource-configmap.yaml

  # JT-38 — adopt csi-driver-nfs (kube-system) into Flux. Was kubectl-applied via
  # `helm install` (rev 1, chart 4.11.0, single override controller.replicas: 1).
  # Adoption is in place: helm-controller takes ownership of the existing release
  # because releaseName + targetNamespace + chart version + values all match.
  # StorageClasses (jellyfin, monitoring, storage, storage-db) stay kubectl-managed — out of scope.
  - csi-nfs-driver/helmrepository.yaml
  - csi-nfs-driver/helmrelease.yaml

  # JT-37 — adopt velero + vui (velero ns) into Flux. Two HelmRepositories +
  # two HelmReleases. Adoption is in place: helm-controller takes ownership of
  # the existing releases (velero rev 2 chart velero-12.0.0; vui rev 4 chart
  # vui-1.0.6) because releaseName + targetNamespace + chart version + values
  # all match. External dependencies stay kubectl-managed — out of scope:
  #   - Secret  velero/velero-wasabi-creds         (Wasabi cloud creds)
  #   - CM      velero/vui-api-repo-schema-patch   (vui-api schema bug workaround)
  # BSL `wasabi` (CR-based, Available), Schedules, Backups, Restores, kopia
  # maintenance Jobs all stay as-is.
  - velero/helmrepository-velero.yaml
  - velero/helmrepository-vui.yaml
  - velero/helmrelease-velero.yaml
  - velero/helmrelease-vui.yaml

  # JT-39 — adopt kube-vip (kube-system) into Flux. Was kubectl-applied as plain
  # manifests (Deployment kube-vip-cloud-provider + DaemonSet kube-vip-ds + RBAC
  # + ConfigMap kubevip). Adoption is byte-faithful capture of the running spec
  # so that on first reconcile, kustomize-controller takes ownership via SSA
  # without mutating the spec — zero pod churn, no VIP flap on __K3S-VIP__.
  # K3s does NOT auto-re-apply kube-vip (no kube-vip*.yaml in /var/lib/rancher/k3s/server/manifests/),
  # so adoption is safe with parent Kustomization prune=false.
  # StorageClasses on the cluster stay kubectl-managed — out of scope.
  - kube-vip/serviceaccount-kube-vip.yaml
  - kube-vip/serviceaccount-kube-vip-cloud-controller.yaml
  - kube-vip/clusterrole-kube-vip.yaml
  - kube-vip/clusterrole-kube-vip-cloud-controller.yaml
  - kube-vip/clusterrolebinding-kube-vip.yaml
  - kube-vip/clusterrolebinding-kube-vip-cloud-controller.yaml
  - kube-vip/configmap-kubevip.yaml
  - kube-vip/deployment-cloud-provider.yaml
  - kube-vip/daemonset.yaml

  # JT-41 — adopt default/k3s-builder0 BuildKit Deployment via Flux SSA. Originally
  # created out-of-band by `docker buildx create --driver kubernetes --name k3s-builder`
  # (12h before adoption). Byte-faithful capture so first reconcile is a no-op SSA
  # upsert — zero pod churn. Privileged + network.host insecure-entitlement preserved
  # verbatim (required for buildkitd build sandbox). Lives in `default` ns to match
  # the buildx driver's default; namespace move is a follow-up if desired.
  - k3s-builder/deployment.yaml

  # JT-34 — adopt kube-prometheus-stack (monitoring ns) into Flux. Was kubectl-applied
  # via `helm install` (rev 24, chart kube-prometheus-stack-69.3.1, appVersion v0.80.0).
  # Adoption is in place: helm-controller takes ownership of the existing release
  # because releaseName (`prometheus`) + targetNamespace (`monitoring`) + chart
  # version + values all match. Values mirror `helm get values prometheus -n monitoring`
  # verbatim — Alertmanager Pushover routing, Velero CR custom-resource-state metrics,
  # Grafana persistence pinned to grafana-pv. Static PVs (alertmanager-pv, grafana-pv,
  # prometheus-pv) and Secrets (grafana-admin-credentials, pushover-creds) stay
  # kubectl-managed — out of scope. CRDs use CreateReplace policy (cert-manager pattern).
  - monitoring/kube-prometheus-stack/helmrepository.yaml
  - monitoring/kube-prometheus-stack/helmrelease.yaml

  - velero-ui.yaml
  # vs.yaml superseded by vscode/ subdir below (Phase 999.2 plan-02)

  # Wave 1 of new-app deploy.
  #   - drawio + firefly run as native k3s deployments
  #   - checkmk + cryptpad run as docker-compose stacks on docker-1 (Komodo
  #     polls docker-1/<svc>/compose.yaml). Their cluster footprint is just
  #     the external-IP-backend bundle in checkmk.yaml / cryptpad.yaml.
  - drawio/namespace.yaml
  - drawio/deployment.yaml
  - drawio/service.yaml
  - drawio/ingressroute.yaml

  # Wave 2 — netdata DaemonSet (one pod per node, hostNetwork on :19999).
  # Cluster-side IngressRoute lives in clusters/default/netdata.yaml above.
  - netdata/namespace.yaml
  - netdata/daemonset.yaml

  - firefly/namespace.yaml
  - firefly/postgres-pv.yaml
  - firefly/postgres-pvc.yaml
  - firefly/postgres-deployment.yaml
  - firefly/postgres-service.yaml
  - firefly/pv.yaml
  - firefly/pvc.yaml
  - firefly/deployment.yaml
  - firefly/service.yaml
  - firefly/ingressroute.yaml

  # quick-260501-ln4 — bastion-reader SA + ClusterRole + Binding for the dedicated
  # bastion LXC (__PVE-NODE-3__ / __LAN-IP__). READ-ONLY (get/list/watch) on the kinds the
  # K8s scanner + audit_drift agent task touch. Secrets EXCLUDED.
  # Token minted out-of-band via `kubectl -n kube-system create token bastion-reader
  # --duration=8760h`, written to /etc/bastion/kube/bastion-reader.yaml on the LXC,
  # renewed annually. Adding a new kind to bastion scanner requires editing
  # bastion-reader/clusterrole.yaml.
  - bastion-reader/serviceaccount.yaml
  - bastion-reader/clusterrole.yaml
  - bastion-reader/clusterrolebinding.yaml

  # Wave 2 — external-IP-backend bundles (Pattern 5 — Service + EndpointSlice +
  # IngressRoute, all in kube-system; ServersTransport lan-self-signed for HTTPS)
  - dns.yaml
  - dns2.yaml
  - komodo.yaml           # docker-1:9120 Komodo Core UI (HTTP upstream, JT-40 follow-up)
  - pa.yaml
  - backup-host.yaml
  - __PVE-NODE-1__.yaml
  - __PVE-MGMT-1__.yaml
  - __PVE-NODE-2__.yaml
  - __PVE-NODE-3__.yaml
  - sw.yaml
  # sw10.yaml retired 2026-05-02 (quick-260502-juw) — switch __LAN-IP__ offline,
  # operator confirmed drop per 14-NPM-INVENTORY.md OUT-OF-SCOPE classification.
  - synology.yaml         # consolidated synology.__BASE-DOMAIN__ + __NAS-HOST__
  - torrents.yaml
  - wazuh-dashboard-ca-secret.yaml  # Wazuh internal root CA (public cert) trusted by wazuh-trusted ServersTransport
  - wazuh-serverstransport.yaml     # Wazuh-specific ServersTransport (rootCAs + serverName, no insecureSkipVerify)
  - wazuh.yaml            # docker-1:5601 (HTTPS upstream, wazuh-trusted) — first docker-1-backed external-IP HTTPS bundle with proper CA verification
  - checkmk.yaml          # docker-1:5000 — checkmk Raw via Komodo (docker-1/checkmk/compose.yaml)
  - cryptpad.yaml         # docker-1:3000 — cryptpad via Komodo (docker-1/cryptpad/compose.yaml); main + sandbox hosts to same Service
  - netdata.yaml          # multi-endpoint EndpointSlice → k3s-1/2/5/6 + docker-1, all on :19999
  - maltrail.yaml         # docker-1:8338 — maltrail server (sensor host-net for libpcap)
  - legacy-vm.yaml             # docker-1:3010 — OSTE-Meta-Scan webtop (Tkinter GUI in noVNC; cryptpad has 3000)
  - openvas.yaml          # docker-1:9392 — Greenbone CE GSA web UI
  - kopia-docker-1.yaml      # docker-1:51515 — read-only Kopia web UI for the docker-1 backup repo
  - kopia-docker-2.yaml      # docker-2:51515 — read-only Kopia web UI for the docker-2 backup repo

# ConfigMaps generated from on-disk files. disableNameSuffixHash keeps the
# generated name stable so volume mounts in deployment.yaml reference a
# predictable name.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # PALOARP plugin source for NetAlertX. Mounted into the netalert pod at
  # /app/front/plugins/PALOARP. To force a re-roll on plugin code change,
  # bump a label on the netalert Deployment.
  - name: paloarp-plugin
    namespace: netalert
    files:
      - netalert/plugin-PALOARP/script.py
      - netalert/plugin-PALOARP/config.json
      - netalert/plugin-PALOARP/README.md
