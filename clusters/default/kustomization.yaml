  # itself lives under _storageclasses/ per repo convention (all PV files
  # consolidated there; PVCs stay with their app).
  - jellyfin/namespace.yaml
  - jellyfin/jellyfin-config-pvc.yaml
  - jellyfin/jellyfin-movies-pvc.yaml
  - jellyfin/deployment.yaml
  - jellyfin/service.yaml
  - jellyfin/ingressroute.yaml

  # freshrss removed 2026-07-12 — consolidated read-later onto Hoarder (overlap).
  # Namespace "rss" pruned by Flux; manifests deleted from clusters/default/freshrss/.

  # Phase 999.2 plan-02 — vscode (deploy "code-server", IR "vs", host vs.__BASE-DOMAIN__,
  # supersedes top-level vs.yaml). Privileged container intentional — IDE.
  - vscode/namespace.yaml
  # Bucket A — was kubectl one-liner (password + sudo-password).
  - vscode/secret-vscode.enc.yaml
  # vscode/pv.yaml removed — Wave 1 (260511-utf) migrated to dynamic storage-apps SC.
  - vscode/pvc.yaml
  - vscode/deployment.yaml
  - vscode/service.yaml
  - vscode/ingressroute.yaml

  # Phase 999.2 plan-02 — fitjat (main deploy + svc + primary PVC).
  # No IngressRoute — external access is via Cloudflare Tunnel, not Traefik.
  - fitjat/namespace.yaml
  # Phase 12 wave 12-07 — was secret-fitjat.template (kubectl apply).
  # NOTE: live secret has only CF_ACCESS_AUD; template's GITHUB_CLIENT_ID/etc.
  # was never deployed. Plan 12-08 to update or note the obsolete template.
  - fitjat/secret-fitjat.enc.yaml
  # fitjat/pv.yaml removed — Wave 2 (260511-utf) migrated to dynamic storage-apps SC.
  - fitjat/pvc.yaml
  - fitjat/deployment.yaml
  - fitjat/service.yaml

  # Phase 999.2 spinoff — fitjat continuation (cloudflared tunnel + backups).
  # Bucket A — cloudflared-token Secret moved from kubectl one-liner to SOPS.
  # cloudflared-info ConfigMap stays kubectl-managed (config detail, not sensitive).
  - fitjat/secret-cloudflared-token.enc.yaml
  - fitjat/cloudflared/deployment.yaml
  # fitjat/backups/pv.yaml removed — Wave 2 (260511-utf) migrated to dynamic storage-apps SC.
  - fitjat/backups/pvc.yaml
  - fitjat/backups/cronjob-backup.yaml
  - fitjat/backups/cronjob-backup-health.yaml
  - fitjat/backups/cronjob-rsync-storage.yaml

  # homarr removed 2026-07-12 — consolidated dashboards onto Dashy (two dashboards).
  # Namespace "homarr" + leftover sh.helm.release.v1.homarr.* secrets pruned by Flux;
