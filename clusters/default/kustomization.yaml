  # Pairs with grafana.com dashboard 13665.
  - monitoring/speedtest-exporter/deployment.yaml
  - monitoring/speedtest-exporter/service.yaml
  - monitoring/speedtest-exporter/servicemonitor.yaml
  - monitoring/speedtest-exporter/grafana-dashboard-cm.yaml

  # bastion dashboard — generated from ops/grafana/dashboards/bastion.json in the bastion repo.
  # Regenerate: make grafana-sync (bastion repo). Sidecar auto-imports via grafana_dashboard: "1".
  # 31 opsman_* metric families; 24 panels, 7 explicitly allowlisted.
  # Moved to flat dashboards/ convention (Phase 20 GRA-02). bastion-dashboard/ dir removed.

  # Phase 12 wave 12-04 canary — was secret-pushover.template (kubectl apply);
  # now SOPS-encrypted .enc.yaml decrypted by Flux per spec.decryption (Mode A).
  - monitoring/secret-pushover.enc.yaml
  # Phase 12 wave 12-06 — was secret-grafana-admin.template (kubectl apply).
  - monitoring/secret-grafana-admin.enc.yaml

  # Nextcloud — filesystem-primary on NFS (cutover 2026-05-04 from MinIO-
