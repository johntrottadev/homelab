# quick-260504-oee — Kyverno operator dashboard.
#
# Sidecar discovery via `grafana_dashboard: '1'` label (kube-prometheus-stack
# default; verified against existing speedtest/loki dashboard CMs).
#
# Dashboard source: hand-rolled (NOT grafana.com/15921). Deviation from plan:
# 15921 ("Controller Runtime Webhooks Detail") visualizes generic
# controller-runtime webhook latency/rate, not Kyverno-specific metrics. The
# operational signal we want during audit-mode bootstrap is
# `kyverno_policy_results_total{rule_result="fail"}` and controller
# readiness — neither covered by 15921. This dashboard focuses on those.
#
# UID `kyverno-policy-reports` matches the dashboard_url annotation on the
# KyvernoPolicyViolation alert in prometheusrule.yaml — keep them in sync.
#
# Panels (7 total):
#   1. Stat: total fail count over 24h
#   2. Stat: admission controller ready replicas
#   3. Stat: active ClusterPolicies (count from metric labels)
#   4. Stat: total pass count over 24h
#   5. Timeseries: violations by policy
#   6. Bar gauge: top 10 violating resource kinds (24h)
#   7. Timeseries: kyverno controller readiness over time
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kyverno
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  kyverno.json: "{\"annotations\":{\"list\":[]},\"description\":\"Kyverno policy reports \\u2014 audit-mode violations + controller health. quick-260504-oee.\",\"editable\":true,\"fiscalYearStartMonth\":0,\"graphTooltip\":0,\"id\":null,\"links\":[],\"liveNow\":false,\"panels\":[{\"id\":1,\"title\":\"Audit-mode violations (24h)\",\"type\":\"stat\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"Prometheus\"},\"gridPos\":{\"h\":4,\"w\":6,\"x\":0,\"y\":0},\"fieldConfig\":{\"defaults\":{\"color\":{\"mode\":\"thresholds\"},\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":1},{\"color\":\"red\",\"value\":100}]},\"unit\":\"short\"},\"overrides\":[]},\"options\":{\"colorMode\":\"background\",\"graphMode\":\"area\",\"justifyMode\":\"center\",\"orientation\":\"auto\",\"reduceOptions\":{\"calcs\":[\"lastNotNull\"],\"fields\":\"\",\"values\":false},\"textMode\":\"value\"},\"pluginVersion\":\"12.4.3\",\"targets\":[{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"Prometheus\"},\"expr\":\"sum(increase(kyverno_policy_results_total{rule_result=\\\"fail\\\"}[24h]))\",\"legendFormat\":\"fails 24h\",\"refId\":\"A\"}]},{\"id\":2,\"title\":\"Admission controller pods ready\",\"type\":\"stat\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"Prometheus\"},\"gridPos\":{\"h\":4,\"w\":6,\"x\":6,\"y\":0},\"fieldConfig\":{\"defaults\":{\"color\":{\"mode\":\"thresholds\"},\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"red\",\"value\":null},{\"color\":\"green\",\"value\":1}]},\"unit\":\"short\"},\"overrides\":[]},\"options\":{\"colorMode\":\"background\",\"graphMode\":\"none\",\"justifyMode\":\"center\",\"orientation\":\"auto\",\"reduceOptions\":{\"calcs\":[\"lastNotNull\"],\"fields\":\"\",\"values\":false},\"textMode\":\"value\"},\"pluginVersion\":\"12.4.3\",\"targets\":[{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"Prometheus\"},\"expr\":\"sum(kube_deployment_status_replicas_available{namespace=\\\"kyv