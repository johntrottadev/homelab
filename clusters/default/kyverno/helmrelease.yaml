# Kyverno — policy-as-code admission engine for the homelab. quick-260504-oee.
#
# WHY failurePolicy: Ignore is non-negotiable
# ------------------------------------------
# Single-cluster homelab — there is no fleet of redundant operators waiting in
# the wings. If the Kyverno admission webhook is unreachable (pod restart,
# OOMKill, cert rotation lockout, network blip), every kube-apiserver write
# would stall until the webhook comes back. By forcing failurePolicy: Ignore
# on every webhook the chart creates, cluster admission survives Kyverno
# being down — at the cost that no policies are evaluated during the outage.
# That cost is the right trade for a homelab: better to skip policy checks
# than to break unrelated workloads (cert-manager renewals, flux reconciles,
# kube-vip elections).
# Reference: https://kyverno.io/docs/installation/customization/#ignore-failurepolicy
#
# Chart values key shape
# ----------------------
# As of chart 3.7.1 the canonical way to force Ignore on every webhook is
# `features.forceFailurePolicyIgnore.enabled: true` (NOT
# `admissionController.failurePolicy: Ignore` — that key does not exist in
# this chart version; older Kyverno docs from the v3.0 era show outdated
# names). Verified against `helm show values kyverno/kyverno --version 3.7.1`
# 2026-05-04. Re-verify when bumping the chart version.
#
# WHY this is audit-mode bootstrap
# --------------------------------
# Policies live in clusters/default/kyverno-policies/ (separate Kustomization
# entries so the controller and the policies can be paused independently).
# The first policy ships with `validationFailureAction: Audit` — violations
# show up in PolicyReports + the Prometheus metric
# `kyverno_policy_results_total{rule_result="fail"}`, but nothing is actually
# blocked. Flip-to-Enforce is a separate follow-up after 24h of clean reports.
#
# WHY replicas: admission 2, everything else 1
# --------------------------------------------
# Five-node homelab cluster, single operator, no external SLAs. Chart default
# is 3 replicas per controller (admission/background/cleanup/reports = 12
# pods). One replica each kept the footprint trivial, on the reasoning that
# failurePolicy: Ignore covered the availability gap.
#
# Revised 2026-09-05. That reasoning was self-defeating for the ADMISSION
# controller specifically: fail-open plus a single replica means that while
# that one pod is evicted, crash-looping, mid-upgrade or on a draining node,
# every workload in every non-excluded namespace admits UNCHECKED - and no
# denial is logged, because no denial happens. The control had a silent
# off-switch that any node drain could flip.
#
# admissionController -> 2 (it is the only one on the request path).
# background/reports/cleanup stay at 1; they reconcile asynchronously and a
# brief outage delays reports rather than removing enforcement.
#
# failurePolicy stays Ignore deliberately. Since 2026-09-04, Pod Security
# Admission enforces the same baseline at the API server across 21 namespaces
# (see clusters/default/*/namespace.yaml), so a Kyverno outage no longer means
# nothing is enforcing. Fail-open is now a defensible choice rather than the
# only survivable one.
#
# Chart version pinning
# ---------------------
# Bumped 3.7.1 -> 3.8.2 (2026-07-19, Class 4 chart pass). Re-verified the
# forceFailurePolicyIgnore values key still exists in chart 3.8.2
# (values.yaml: features.forceFailurePolicyIgnore.enabled, default false —
# we set true below). Resource-validating webhook confirmed failurePolicy:
# Ignore live before the bump, so admission stays fail-open through upgrade.
# Prior: 3.7.1 (app v1.17.1) selected for k8s API support + JMESPath time helpers.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: "3.8.2"  # pin EXACT — see chart version pinning rationale above
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Force every webhook the chart creates to use failurePolicy: Ignore —
    # see header comment. This is the canonical 3.x chart key (verified against
    # `helm show values kyverno/kyverno --version 3.7.1`); it rewrites every
    # ValidatingWebhookConfiguration / MutatingWebhookConfiguration the chart
    # produces to set failurePolicy: Ignore.
    features:
      forceFailurePolicyIgnore:
        enabled: true

    # Single-replica per controller — see header comment.
    # `metricsService.create: true` is the chart default; restated here so it
    # is grep-able as a contract this manifest depends on (the ServiceMonitor
    # in clusters/default/kyverno-policies/servicemonitor.yaml selects
    # the kyverno-svc-metrics + per-controller metrics services on
    # port 8000 / name metrics-port).
    admissionController:
      # 2, not 1 - see "WHY replicas" above. This is the controller on the
      # admission request path; a single replica gave enforcement a silent
      # off-switch.
      replicas: 2
      metricsService:
        create: true
    backgroundController:
      replicas: 1
      metricsService:
        create: true
    reportsController:
      replicas: 1
      metricsService:
        create: true
    cleanupController:
      replicas: 1
      metricsService:
        create: true
