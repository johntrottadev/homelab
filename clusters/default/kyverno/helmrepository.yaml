# Kyverno Helm chart repo — quick-260504-oee.
# Lives in flux-system ns alongside jetstack/grafana/csi-driver-nfs HelmRepositories
# so any future Kyverno version bump is a single-line change in
# clusters/default/kyverno/helmrelease.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 24h
  url: https://kyverno.github.io/kyverno/
