# Pod Security Standards — BASELINE, in Audit mode.
#
# Before this, the cluster had exactly one ClusterPolicy
# (velero-business-hours-block), which is scheduling hygiene, not security. A
# four-controller Kyverno admission stack was running full time and enforcing
# no security control at all.
#
# Audit first, deliberately. Enforce would reject non-compliant Pods at
# admission, and several existing workloads (Longhorn, Netdata, NetAlertX,
# CrowdSec) legitimately need privileged access. Audit produces PolicyReports
# so the real violations can be read before anything is blocked.
#
# Kyverno 1.13+ moved failureAction onto the rule; spec.validationFailureAction
# is deprecated. This is 1.18.2, so it belongs under validate.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-baseline
  annotations:
    policies.kyverno.io/title: Pod Security Standards - Baseline
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Applies the Kubernetes Pod Security Standards "baseline" profile, which
      blocks known privilege escalations: host namespaces, privileged
      containers, hostPath volumes, hostPorts, unsafe sysctls and unmasked
      proc mounts. Enforced on application namespaces; infrastructure that
        requires host access is excluded explicitly below.
spec:
  background: true
  rules:
    - name: baseline
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          # Infrastructure that legitimately requires host access. Every entry was
          # confirmed against PolicyReports on 2026-09-02 - these are not blanket
          # exemptions, they are the namespaces whose function depends on hostPath,
          # hostNetwork or privileged mode.
          #
          # Adding a namespace here is a security decision. Do not extend this list
          # to make a failing application pass; fix the application.
          - resources:
              namespaces:
                - kube-system       # kubelet, CNI, k3s components
                - longhorn-system   # storage engine, 24 privileged pods by design
                - kyverno           # the admission controller itself
                - monitoring        # node-exporter reads host metrics
                - netdata           # host monitoring
                - datadog           # host metrics/logs agent
                - loki              # promtail reads host logs
                - crowdsec          # reads host logs
                - velero            # node-agent mounts pod volumes to back them up
                - netalert          # hostNetwork + NET_ADMIN/NET_RAW for ARP scanning
                - k3s-builder       # buildkit requires privileged
      validate:
        # 2026-09-02: Audit -> Enforce. The audit produced 64 violations across 10
        # namespaces and EVERY ONE was a hostPath/host-namespace use by infrastructure
        # that cannot work without it. Zero application workloads were violating.
        # vscode (6) was removed outright; a stray buildkit deployment in default (3)
        # was deleted. Non-compliant Pods in any namespace not excluded above are now
        # REJECTED at admission.
        failureAction: Enforce
        podSecurity:
          level: baseline
          version: latest
