apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreoffice
  namespace: libre
  labels:
    app: libreoffice
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: libreoffice
  template:
    metadata:
      labels:
        app: libreoffice
    spec:
      # linuxserver image pattern: container starts as root, s6-overlay drops
      # privileges to PUID/PGID. Pod-level fsGroup ensures /config NFS mount
      # is writable by the dropped UID. Don't set runAsUser/runAsGroup —
      # would block the s6-overlay init that handles ownership for us.
      securityContext:
        fsGroup: 1000
      containers:
        - name: libreoffice
          # T-999.2-07: image already version-pinned (linuxserver follows
          # upstream LibreOffice releases via semantic tags).
          image: linuxserver/libreoffice:25.8.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
            - name: DISPLAY
              value: ":1"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: https
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: libreoffice-storage
              mountPath: /config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: libreoffice-storage
          persistentVolumeClaim:
            claimName: libreoffice-pvc
