apiVersion: v1
kind: PersistentVolume
metadata:
  name: libreoffice-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime
    - nodiratime
  claimRef:
    namespace: libre
    name: libreoffice-pvc
  nfs:
    server: ${NAS_HOST}
    path: /volume1/kub/homelab/libreoffice
    readOnly: false
