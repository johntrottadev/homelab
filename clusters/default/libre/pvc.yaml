# Dynamic PVC against storage-apps SC (Wave 2, 260511-utf).
# Path moves: /apps/libreoffice/ -> /apps/libre/libreoffice-pvc/ (PVC ns is `libre`).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: libreoffice-pvc
  namespace: libre
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: storage-apps
