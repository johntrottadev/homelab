# First flux-managed Helm chart repository in flux-source.
# Future Helm-shipped apps (Alloy, Tempo, Mimir, ...) can reuse this
# by referencing `kind: HelmRepository, name: grafana, namespace: flux-system`.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
