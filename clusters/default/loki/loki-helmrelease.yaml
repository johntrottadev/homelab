# Loki monolithic mode (SingleBinary) — homelab single-replica deployment.
# Internal-only: ClusterIP only, no IngressRoute, no LoadBalancer.
# Storage: filesystem on the loki-data PVC (NFS-backed via static PV).
# Auth disabled (single-tenant homelab).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.1.0"  # pin EXACT for reproducibility
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    # force: true triggers helm upgrade --force, which lets helm-controller
    # recreate the StatefulSet when its volumeClaimTemplate changes (an
    # otherwise-immutable field). Required for the 260512-mxm cutover from
    # static `storage` SC to dynamic `storage-apps`. Safe to leave on indefinitely.
    force: true
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1  # REQUIRED for 1-replica monolithic
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 336h  # 14 days
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      analytics:
        reporting_enabled: false  # don't phone home
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        # Fresh-start on longhorn-ssd (blue/green migration 2026-07-02): the
        # old storage-apps subDir (${ns}/${pvc}) collided with the still-running
        # old cluster's live loki data → corrupt WAL ("segments not sequential").
        # New empty longhorn-ssd volume gives a clean fresh start.
        storageClass: longhorn-ssd
        size: 20Gi
        accessModes:
          - ReadWriteOnce
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1.5Gi
    # Disable everything that's not relevant for monolithic homelab use:
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    # Monitoring integration — surface metrics to existing kube-prometheus-stack.
    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: prometheus  # match kube-prometheus-stack ServiceMonitor selector (verified)
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
    # `lokiCanary` is a TOP-LEVEL chart key in 7.0.0, not under monitoring.
    # Disabling here avoids the 5-pod canary DaemonSet (one per node).
    lokiCanary:
      enabled: false
    test:
      enabled: false
