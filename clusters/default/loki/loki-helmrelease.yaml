# Loki monolithic mode (SingleBinary) — homelab single-replica deployment.
# Internal-only: ClusterIP only, no IngressRoute, no LoadBalancer.
# Storage: filesystem on the loki-data PVC (NFS-backed via static PV).
# Auth disabled (single-tenant homelab).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.0.0"  # appVersion 3.6.7 — pin EXACT for reproducibility
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1  # REQUIRED for 1-replica monolithic
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 336h  # 14 days
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      analytics:
        reporting_enabled: false  # don't phone home
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        # Chart 7.0.0 has no `existingClaim` knob for singleBinary — the
        # volumeClaimTemplate `storage` auto-creates PVC `storage-loki-0`.
        # Bind that PVC to our static NFS-backed PV via storageClass + size +
        # label selector match. The PV (loki-pv.yaml) carries
        # `loki-storage: "true"`.
        storageClass: storage
        size: 50Gi
        accessModes:
          - ReadWriteOnce
        selector:
          matchLabels:
            loki-storage: "true"
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1.5Gi
    # Disable everything that's not relevant for monolithic homelab use:
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    # Monitoring integration — surface metrics to existing kube-prometheus-stack.
    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: prometheus  # match kube-prometheus-stack ServiceMonitor selector (verified)
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
    # `lokiCanary` is a TOP-LEVEL chart key in 7.0.0, not under monitoring.
    # Disabling here avoids the 5-pod canary DaemonSet (one per node).
    lokiCanary:
      enabled: false
    test:
      enabled: false
