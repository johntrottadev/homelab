# Static NFS PV. NAS path /volume1/kub/homelab/loki pre-created by operator
# (chown 10001:10001 — Loki upstream chart default UID; mode 0755).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  nfs:
    server: __NAS-HOST__
    path: /volume1/kub/homelab/loki
    readOnly: false
