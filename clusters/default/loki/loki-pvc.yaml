apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: loki
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: storage
  # Static binding — guarantees this PVC binds to OUR PV, not some other
  # 50Gi storage-class PV that happens to be Available.
  volumeName: loki-pv
