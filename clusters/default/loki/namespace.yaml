apiVersion: v1
kind: Namespace
metadata:
  name: loki
  labels:
    # Exempt WITH A REASON, mirroring the Kyverno exclusion list exactly:
    # promtail reads host log paths.
    # Stated explicitly rather than left unlabelled, so the exemption is a
    # decision recorded in git rather than an absence nobody notices.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
