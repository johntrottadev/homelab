# Promtail DaemonSet — ships k8s pod logs + node syslog/journald to Loki.
# Promtail is in maintenance mode upstream (Grafana Labs prefers Alloy).
# Choosing Promtail for simpler config in this homelab; Alloy migration is
# a deferred follow-up. Loki backend is identical either way.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: promtail
      version: "6.17.1"  # appVersion 3.5.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      clients:
        - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push
    # Run on every node, including control-plane (k3s-1).
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus  # match kube-prometheus-stack serviceMonitorSelector (verified)
