# IngressRoute bundle for maltrail server on docker-1:8338.
apiVersion: v1
kind: Service
metadata:
  name: ext-maltrail
  namespace: kube-system
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8338
      targetPort: 8338
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-maltrail-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-maltrail
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8338
endpoints:
  - addresses:
      - __LAN-IP__
    conditions:
      ready: true
      serving: true
      terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: maltrail-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`maltrail.${BASE_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
      services:
        - name: ext-maltrail
          port: 8338
          scheme: http
