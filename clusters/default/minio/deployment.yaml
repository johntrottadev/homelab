apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    # Single-server single-drive (SNSD) MinIO. Rolling updates can race
    # on the same /data dir and corrupt the meta tree. Recreate is safe
    # and the right choice for this topology.
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        # MinIO runs as UID 1000 by default in the official image.
        # NFS-mounted /data needs to be writable by that UID.
        fsGroup: 1000
      containers:
        - name: minio
          # T-pin: latest is fine to start; pin to a RELEASE.YYYY-MM-DDT...
          # tag once we've verified the running version works for our setup.
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --address
            - :9000
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_REGION
              value: us-east-1
            # Console URL announced to browsers — used for OAuth redirects
            # and the "Get me a download link" buttons.
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://minio.__BASE-DOMAIN__
          ports:
            - containerPort: 9000
              name: s3
              protocol: TCP
            - containerPort: 9001
              name: console
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc
