# File-level S3 replication MinIO -> Wasabi every 15 min.
#
# Replaces the Hyper Backup block-level archive of /volume1/kub/minio.
# Block-level archives can't surface a single corrupted/lost object —
# each object as a discrete S3 entity in Wasabi means we can pull just
# one back when needed, and Wasabi's bucket versioning preserves prior
# versions on overwrite/delete.
#
# RPO: 15 min. Acceptable for personal Nextcloud; tighten cron if you
# ever need closer (mc replicate continuous would be the next step, but
# its 3s health-check fails over WAN to Wasabi from inside the cluster).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-replicate-wasabi
  namespace: minio
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mc
              image: minio/mc:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: minio-root
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: minio-root
                      key: MINIO_ROOT_PASSWORD
                - name: WASABI_KEY
                  valueFrom:
                    secretKeyRef:
                      name: wasabi-creds
                      key: ACCESS_KEY_ID
                - name: WASABI_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: wasabi-creds
                      key: SECRET_ACCESS_KEY
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  export MC_HOST_local="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio.minio.svc:9000"
                  export MC_HOST_wasabi="https://${WASABI_KEY}:${WASABI_SECRET}@__WASABI-ENDPOINT__"
                  echo "[mirror] $(date -u +%FT%TZ) starting"
                  mc mirror --overwrite --remove local/nextcloud/ wasabi/nextcloud-mirror/
                  SRC=$(mc ls --recursive local/nextcloud/ | wc -l)
                  DST=$(mc ls --recursive wasabi/nextcloud-mirror/ | wc -l)
                  echo "[mirror] $(date -u +%FT%TZ) done; src=$SRC dst=$DST"
                  if [ "$SRC" != "$DST" ]; then
                    echo "[mirror] WARN: count mismatch — investigate"
                    exit 1
                  fi
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
