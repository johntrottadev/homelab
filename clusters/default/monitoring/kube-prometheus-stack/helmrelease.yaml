# kube-prometheus-stack — adopting an existing kubectl-applied Helm release
# (rev 24, chart kube-prometheus-stack-69.3.1, appVersion v0.80.0, JT-34).
# Flux helm-controller adopts in place when releaseName + targetNamespace +
# chart version + values match the existing release. Values mirror
# `helm get values prometheus -n monitoring` exactly.
#
# In-scope: 6 chart-managed workloads picking up `helm.toolkit.fluxcd.io/name=prometheus`:
#   - Deployment   monitoring/prometheus-operator
#   - Deployment   monitoring/kube-state-metrics
#   - StatefulSet  monitoring/grafana
#   - StatefulSet  monitoring/prometheus-prometheus-prometheus
#   - StatefulSet  monitoring/alertmanager-prometheus-alertmanager
#   - DaemonSet    monitoring/node-exporter
#
# Out of scope (stays kubectl-managed):
#   - Static PVs:   alertmanager-pv, grafana-pv, prometheus-pv (NFS-backed)
#   - Secrets:      grafana-admin-credentials, pushover-creds (sensitive creds)
#   - CRDs:         Prometheus/Alertmanager/ServiceMonitor/PrometheusRule
#                   (CreateReplace policy — chart upgrades update them)
#   - User-defined ServiceMonitors elsewhere (loki, velero, backup-host/pihole exporters)
#     — they continue to work via `release: prometheus` selector.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "69.3.1"  # pin EXACT — match running release rev 24 (appVersion v0.80.0)
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    alertmanager:
      alertmanagerSpec:
        secrets:
        - pushover-creds
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
              storageClassName: longhorn-ssd
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
        - equal:
          - namespace
          - alertname
          source_matchers:
          - severity = critical
          target_matchers:
          - severity =~ "warning|info"
        - equal:
          - namespace
          - alertname
          source_matchers:
          - severity = warning
          target_matchers:
          - severity = info
        - equal:
          - namespace
          source_matchers:
          - alertname = InfoInhibitor
          target_matchers:
          - severity = info
        - target_matchers:
          - alertname = InfoInhibitor
        receivers:
        - name: "null"
        - name: pushover-critical
          pushover_configs:
          - html: true
            message: |-
              {{ range .Alerts }}<b>severity:</b> {{ .Labels.severity }}
              {{ if .Labels.namespace }}<b>namespace:</b> {{ .Labels.namespace }}
              {{ end }}{{ if .Labels.instance }}<b>instance:</b> {{ .Labels.instance }}
              {{ end }}{{ if .Labels.pod }}<b>pod:</b> {{ .Labels.pod }}
              {{ end }}
              <b>{{ .Annotations.summary }}</b>
              {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}
              <a href="{{ .Annotations.runbook_url }}">[runbook]</a>{{ end }}
              {{ end }}
            priority: "1"
            send_resolved: true
            title: '[CRITICAL] {{ .CommonLabels.alertname }} ({{ .Status }})'
            token_file: /etc/alertmanager/secrets/pushover-creds/token
            url: '{{ with (index .Alerts 0).Annotations.dashboard_url }}{{ . }}{{ else
              }}https://grafana.${BASE_DOMAIN}/d/homelab-front-page{{ end }}'
            url_title: Open dashboard
            user_key_file: /etc/alertmanager/secrets/pushover-creds/user_key
        - name: pushover-warning
          pushover_configs:
          - html: true
            message: |-
              {{ range .Alerts }}<b>severity:</b> {{ .Labels.severity }}
              {{ if .Labels.namespace }}<b>namespace:</b> {{ .Labels.namespace }}
              {{ end }}{{ if .Labels.instance }}<b>instance:</b> {{ .Labels.instance }}
              {{ end }}{{ if .Labels.pod }}<b>pod:</b> {{ .Labels.pod }}
              {{ end }}
              <b>{{ .Annotations.summary }}</b>
              {{ if .Annotations.runbook_url }}
              <a href="{{ .Annotations.runbook_url }}">[runbook]</a>{{ end }}
              {{ end }}
            priority: "0"
            send_resolved: true
            title: '[WARNING] {{ .CommonLabels.alertname }} ({{ .Status }})'
            token_file: /etc/alertmanager/secrets/pushover-creds/token
            url: '{{ with (index .Alerts 0).Annotations.dashboard_url }}{{ . }}{{ else
              }}https://grafana.${BASE_DOMAIN}/d/homelab-front-page{{ end }}'
            url_title: Open dashboard
            user_key_file: /etc/alertmanager/secrets/pushover-creds/user_key
        route:
          group_by:
          - namespace
          - alertname
          group_interval: 5m
          group_wait: 30s
          receiver: pushover-warning
          repeat_interval: 4h
          routes:
          - matchers:
            - alertname = "Watchdog"
            receiver: "null"
          - matchers:
            - alertname = "InfoInhibitor"
            receiver: "null"
          - continue: false
            group_wait: 10s
            matchers:
            - severity = "critical"
            receiver: pushover-critical
            repeat_interval: 1h
          - matchers:
            - severity = "warning"
            receiver: pushover-warning
            repeat_interval: 4h
          - matchers:
            - severity = "info"
            receiver: "null"
        templates:
        - /etc/alertmanager/config/*.tmpl
      enabled: true
      fullnameOverride: alertmanager
    coreDns:
      enabled: true
    defaultRules:
      create: true
      rules:
        alertmanager: true
        configReloaders: true
        etcd: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverBurnrate: true
        kubeApiserverHistogram: true
        kubeApiserverSlos: true
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubeProxy: true
        kubeScheduler: true
        kubeStateMetrics: true
        kubelet: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: true
        prometheusOperator: true
    fullnameOverride: prometheus
    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        passwordKey: admin-password
        userKey: admin-user
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: utc
      enabled: true
      forceDeployDashboards: false
      forceDeployDatasources: false
      fullnameOverride: grafana
      # Anonymous read-only + iframe embedding, added 2026-07-14 so the Dashy
      # homepage can embed live panels (d-solo). Internal-only (grafana.__BASE-DOMAIN__,
      # LAN-scoped); org_role Viewer = read-only, no edit/admin. SECURITY NOTE: once
      # Authentik forward-auth wraps the grafana ingress, keep anon on for embedding
      # but gate the human-facing route at the proxy.
      grafana.ini:
        server:
          root_url: https://grafana.${BASE_DOMAIN}
        auth.anonymous:
          enabled: true
          org_role: Viewer
        security:
          allow_embedding: true
      # OpenSearch datasource plugin — lets Grafana query the Wazuh indexer directly
      # so SIEM alerts live alongside the rest of the homelab dashboards. Added 2026-08-26.
      plugins:
      - grafana-opensearch-datasource
      # Indexer credential injected from a Secret, never inlined here. Create with:
      #   kubectl create secret generic wazuh-indexer-grafana -n monitoring \
      #     --from-literal=username=grafana-ro --from-literal=password=<pw>
      envValueFrom:
        WAZUH_INDEXER_USER:
          secretKeyRef:
            name: wazuh-indexer-grafana
            key: username
        WAZUH_INDEXER_PASSWORD:
          secretKeyRef:
            name: wazuh-indexer-grafana
            key: password
      additionalDataSources:
      - name: Wazuh Indexer
        uid: wazuh-indexer
        type: grafana-opensearch-datasource
        access: proxy
        url: https://__LAN-IP__:9200
        basicAuth: true
        basicAuthUser: $WAZUH_INDEXER_USER
        jsonData:
          database: wazuh-alerts-*
          flavor: opensearch
          version: 2.11.0
          timeField: timestamp
          maxConcurrentShardRequests: 5
          # self-signed indexer cert; LAN-scoped, so skip verification rather than
          # bolting the Wazuh CA into Grafana's trust store for one datasource
          tlsSkipVerify: true
        secureJsonData:
          basicAuthPassword: $WAZUH_INDEXER_PASSWORD
      image:
        tag: 12.4.3
      persistence:
        accessModes:
        - ReadWriteOnce
        enabled: true
        finalizers:
        - kubernetes.io/pvc-protection
        size: 10Gi
        storageClassName: longhorn-ssd
        type: sts
      serviceMonitor:
        enabled: true
    kube-state-metrics:
      customResourceState:
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
            - groupVersionKind:
                group: velero.io
                kind: PodVolumeBackup
                version: v1
              labelsFromPath:
                backup_name:
                - metadata
                - labels
                - velero.io/backup-name
                name:
                - metadata
                - name
                namespace:
                - spec
                - pod
                - namespace
                node:
                - spec
                - node
                pod:
                - spec
                - pod
                - name
                uploader:
                - spec
                - uploaderType
                volume:
                - spec
                - volume
              metricNamePrefix: velero_podvolumebackup
              metrics:
              - each:
                  info:
                    labelsFromPath:
                      phase:
                      - status
                      - phase
                      snapshot_id:
                      - status
                      - snapshotID
                      storage_location:
                      - spec
                      - backupStorageLocation
                  type: Info
                help: PodVolumeBackup metadata and current phase
                name: info
              - each:
                  gauge:
                    nilIsZero: true
                    path:
                    - status
                    - progress
                    - bytesDone
                  type: Gauge
                help: Bytes transferred so far for this PodVolumeBackup
                name: bytes_done
              - each:
                  gauge:
                    nilIsZero: true
                    path:
                    - status
                    - progress
                    - totalBytes
                  type: Gauge
                help: Total bytes to transfer for this PodVolumeBackup
                name: bytes_total
              - each:
                  gauge:
                    nilIsZero: true
                    path:
                    - status
                    - incrementalBytes
                  type: Gauge
                help: Incremental bytes written by the uploader (Kopia/Restic)
                name: incremental_bytes
            - groupVersionKind:
                group: velero.io
                kind: Backup
                version: v1
              labelsFromPath:
                name:
                - metadata
                - name
                schedule:
                - metadata
                - labels
                - velero.io/schedule-name
                storage_location:
                - spec
                - storageLocation
              metricNamePrefix: velero_backup_cr
              metrics:
              - each:
                  info:
                    labelsFromPath:
                      phase:
                      - status
                      - phase
                  type: Info
                help: Backup metadata and current phase
                name: info
              - each:
                  gauge:
                    nilIsZero: true
                    path:
                    - status
                    - progress
                    - itemsBackedUp
                  type: Gauge
                help: Items successfully backed up in this Backup
                name: items_backed_up
              - each:
                  gauge:
                    nilIsZero: true
                    path:
                    - status
                    - progress
                    - totalItems
                  type: Gauge
                help: Total items targeted by this Backup
                name: items_total
        enabled: true
      fullnameOverride: kube-state-metrics
      prometheus:
        monitor:
          enabled: true
          relabelings:
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels:
            - __meta_kubernetes_pod_node_name
            targetLabel: kubernetes_node
      rbac:
        extraRules:
        - apiGroups:
          - velero.io
          resources:
          - backups
          - podvolumebackups
          - restores
          - schedules
          verbs:
          - list
          - watch
      selfMonitor:
        enabled: true
    kubeApiServer:
      enabled: true
    kubeControllerManager:
      enabled: false
    kubeDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeStateMetrics:
      enabled: true
    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
        - action: replace
          sourceLabels:
          - node
          targetLabel: instance
    nodeExporter:
      enabled: true
      serviceMonitor:
        relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
          - __meta_kubernetes_pod_node_name
          targetLabel: kubernetes_node
    prometheus:
      enabled: true
      prometheusSpec:
        # retention: prune by age (10d) OR size (34GB ~80% of the 40Gi PVC),
        # whichever hits first. retentionSize is the hard guardrail added after
        # the 2026-08-06 incident where 10d-only retention filled the 20Gi PVC,
        # wedged WAL writes, and froze alert rules into a false-positive storm.
        retention: 10d
        retentionSize: "34GB"
        additionalScrapeConfigs:
        - job_name: proxmox
          metrics_path: /pve
          static_configs:
          - targets:
            - __PVE1-IP__:9221
        - job_name: bastion
          scrape_interval: 30s
          metrics_path: /metrics/
          static_configs:
          - targets:
            - __LAN-IP__:8080
            labels:
              instance: bastion
        # Static node_exporter targets on the Docker hosts. node_exporter ships
        # general host metrics and reads kopia-backup textfiles
        # (/var/lib/node_exporter/textfile_collector/kopia.prom written by
        # kopia-backup-run.sh after every snapshot run). See
        # terraform/dock_nodes/cloud-init/kopia-backup.sh for the host setup
        # and monitoring/grafana-dashboard-kopia.yaml for the dashboard.
        - job_name: dock-hosts
          scrape_interval: 30s
          static_configs:
          - targets: [__LAN-IP__:9100]
            labels:
              instance: docker-1
          - targets: [__LAN-IP__:9100]
            labels:
              instance: docker-2
          - targets: [__LAN-IP__:9100]
            labels:
              instance: docker-3
          # app-vm (__LAN-IP__) parked — VM stopped long-term; re-add target when revived.
          # Rewrite job=dock-hosts -> job=node-exporter so the default
          # kube-prometheus-stack `Node Exporter / *` Grafana dashboards
          # pick these hosts up alongside the k3s DaemonSet targets.
          # Original job kept in source_job for filtering.
          relabel_configs:
          - source_labels: [job]
            target_label: source_job
          - target_label: job
            replacement: node-exporter
        # macOS workstations running brew-managed node_exporter bound to
        # 0.0.0.0:9100. Initial target: TB-M-2 laptop. DNS via Pi-hole
        # (tb-m-2.__BASE-DOMAIN__ -> __LAN-IP__).
        # __PVE-NODE-1__ node_exporter — added 2026-07-11 for the USB-enclosure
        # drive-temperature textfile collector (/usr/local/bin/usb-drive-temps.sh,
        # cron */5). Exposes usb_enclosure_drive_temp_celsius for the PBS
        # enclosure drives (local) and nas2 (pulled via restricted SSH key).
        - job_name: pve-hosts
          scrape_interval: 60s
          static_configs:
          - targets: [__LAN-IP__:9100]
            labels:
              instance: __PVE-NODE-1__
          relabel_configs:
          - source_labels: [job]
            target_label: source_job
          - target_label: job
            replacement: node-exporter
        - job_name: macos-hosts
          scrape_interval: 30s
          static_configs:
          - targets: [tb-m-2.__BASE-DOMAIN__:9100]
            labels:
              instance: tb-m-2
          # Rewrite job=macos-hosts -> job=node-exporter (same reason as
          # dock-hosts above). source_job=macos-hosts preserved so macOS
          # vs Linux can still be distinguished by query.
          relabel_configs:
          - source_labels: [job]
            target_label: source_job
          - target_label: job
            replacement: node-exporter
        # SNMP polling via the in-cluster snmp-exporter (snmp-exporter:9116).
        # Job names are load-bearing: homelab-alerts.yaml matches them
        # literally (snmp-synology, snmp-paloalto.*, snmp-paloalto-if), so
        # no job -> node-exporter rewrite here.
        - job_name: snmp-synology
          metrics_path: /snmp
          params:
            module: [synology]
            auth: [synology_v3]
          static_configs:
          - targets:
            - __NAS-IP__
          relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: snmp-exporter:9116
        - job_name: snmp-paloalto
          metrics_path: /snmp
          params:
            module: [paloalto_fw]
            auth: [paloalto_v3]
          static_configs:
          - targets:
            - __LAN-IP__
          relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: snmp-exporter:9116
        - job_name: snmp-paloalto-if
          metrics_path: /snmp
          params:
            module: [if_mib]
            auth: [paloalto_v3]
          static_configs:
          - targets:
            - __LAN-IP__
          relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: snmp-exporter:9116
        # Blackbox probes via the in-cluster blackbox-exporter (:9115).
        # Alert rules match probe_success{target_kind="wan"|"public_dns"}.
        - job_name: blackbox-wan
          metrics_path: /probe
          params:
            module: [tcp_connect]
          static_configs:
          - targets:
            - 1.1.1.1:53
            - 8.8.8.8:53
            labels:
              target_kind: wan
          relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
        - job_name: blackbox-public-dns
          metrics_path: /probe
          params:
            module: [dns_query]
          static_configs:
          - targets:
            - 1.1.1.1
            - 8.8.8.8
            labels:
              target_kind: public_dns
          relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
        # blackbox-lan: the static instance: nas2 label must win, so the
        # usual __param_target -> instance relabel step is intentionally
        # omitted for this job.
        - job_name: blackbox-lan
          metrics_path: /probe
          params:
            module: [tcp_connect]
          static_configs:
          - targets:
            - __LAN-IP__:443
            labels:
              target_kind: lan
              instance: nas2
          relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - target_label: __address__
            replacement: blackbox-exporter:9115
        replicas: 1
        storageSpec:
          volumeClaimTemplate:
            metadata:
              name: prometheus-pvc
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 40Gi
              storageClassName: longhorn-ssd
    prometheus-node-exporter:
      extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
      fullnameOverride: node-exporter
      podLabels:
        jobLabel: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels:
            - __meta_kubernetes_pod_node_name
            targetLabel: kubernetes_node
      resources:
        limits:
          memory: 2048Mi
        requests:
          cpu: 250m
          memory: 512Mi
      service:
        portName: http-metrics
    prometheusOperator:
      enabled: true
      prometheusConfigReloader:
        resources:
          limits:
            memory: 100Mi
          requests:
            cpu: 200m
            memory: 50Mi
    thanosRuler:
      enabled: false
