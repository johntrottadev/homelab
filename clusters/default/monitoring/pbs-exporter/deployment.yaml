apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-host-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: backup-host-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-host-exporter
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-host-exporter
    spec:
      containers:
      - env:
        - name: PBS_ENDPOINT
          value: https://__LAN-IP__:8007
        - name: PBS_INSECURE
          value: 'true'
        - name: PBS_LISTEN_ADDRESS
          value: :9101
        - name: PBS_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: backup-host-exporter-credentials
        - name: PBS_API_TOKEN_NAME
          valueFrom:
            secretKeyRef:
              key: token-name
              name: backup-host-exporter-credentials
        - name: PBS_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: token-secret
              name: backup-host-exporter-credentials
        image: ghcr.io/natrontech/backup-host-exporter:v0.9.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /metrics
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: backup-host-exporter
        ports:
        - containerPort: 9101
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /metrics
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
      securityContext: {}

