---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter-pihole1
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pihole-exporter
    app.kubernetes.io/instance: pihole1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole-exporter
      app.kubernetes.io/instance: pihole1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole-exporter
        app.kubernetes.io/instance: pihole1
    spec:
      containers:
      - name: exporter
        image: amonacoos/pihole6_exporter:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PIHOLE_HOST
          value: ${PIHOLE1_IP}
        - name: PIHOLE_PORT
          value: "80"
        - name: PIHOLE_SCHEME
          value: http
        - name: PIHOLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: pihole-exporter-credentials
              key: pihole1
        ports:
        - containerPort: 9666
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
