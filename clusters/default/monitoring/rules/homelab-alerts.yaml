# Captured from live cluster 2026-05-13 (Phase 10 wave 10-03).
# Was kubectl-applied via `monitoring/homelab-alerts.yaml`.
#
# `release: prometheus` is the kube-prometheus-stack ruleSelector match —
# load-bearing; do not strip on capture. `runbook_url` annotations point to
# `monitoring/RUNBOOKS.md` on the public mirror; that file is preserved in
# Plan 10-05 deletion sweep for link continuity (GOC-03).
# `dashboard_url: https://grafana.__BASE-DOMAIN__/...` is left as a concrete
# literal per D-01 (byte-faithful); sanitize.yml expressions.txt substitutes
# the domain on the public mirror.
# Pre-capture verified: NOT chart-managed (meta.helm.sh/release-name absent).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  annotations:
    prometheus-operator-validated: "true"
  labels:
    app: kube-prometheus-stack
    release: prometheus
  name: homelab-alerts
  namespace: monitoring
spec:
  groups:
  - interval: 1m
    name: homelab.backup-coverage.rules
    rules:
    # Kopia protects the Docker hosts, which hold data no other layer covers
    # (/var/lib/docker/volumes, /opt/stacks, wazuh, checkmk, maltrail, netdata).
    # Metric verified present 2026-09-05: kopia_backup_run_timestamp_seconds,
    # labelled by instance, scraped via node-exporter source_job=dock-hosts.
    - alert: KopiaBackupStale
      annotations:
        description: Kopia backup on {{ $labels.instance }} last succeeded {{ $value
          | humanizeDuration }} ago (threshold 30h).
        summary: Kopia backup stale on {{ $labels.instance }}
      expr: |
        time() - kopia_backup_run_timestamp_seconds > 30 * 3600
      for: 30m
      labels:
        component: kopia
        severity: warning
    # A host that STOPS reporting is invisible to the staleness alert above,
    # because the series simply disappears rather than growing old. Only docker-1,
    # docker-2 and docker-3 currently report; the 2026-09-02 coverage audit also lists
    # app-vm, so either its timer is not running or it is not being scraped.
    - alert: KopiaHostNotReporting
      annotations:
        description: No kopia_backup_run_timestamp_seconds series for {{ $labels.instance
          }}. The host is not reporting backups at all - a missing series is not
          a passing check.
        summary: Kopia host not reporting
      expr: |
        absent(kopia_backup_run_timestamp_seconds{instance="docker-1"})
        or absent(kopia_backup_run_timestamp_seconds{instance="docker-2"})
        or absent(kopia_backup_run_timestamp_seconds{instance="docker-3"})
      for: 1h
      labels:
        component: kopia
        severity: warning
    # THE DETACHED-VOLUME GAP.
    #
    # allow-recurring-job-while-volume-detached=false means a volume whose
    # workload is scaled to zero receives NO snapshots, and the RecurringJob
    # still reports success. Job success is therefore not evidence of coverage.
    # This alerts on the outcome instead: a Longhorn volume with zero snapshots.
    #
    # Measured 2026-09-05: 32 of 33 volumes had snapshots, so this fires on a
    # real, existing gap rather than being theoretical.
    - alert: LonghornVolumeNeverSnapshotted
      annotations:
        description: Longhorn volume {{ $labels.volume }} has no snapshots. It is
          likely detached (workload scaled to zero), which the recurring job skips
          silently while still reporting success.
        summary: Longhorn volume has no snapshots
      expr: |
        count by (volume) (longhorn_volume_capacity_bytes)
        unless count by (volume) (longhorn_snapshot_actual_size_bytes)
      for: 2h
      labels:
        component: longhorn
        severity: warning
  - interval: 1m
    name: homelab.velero.rules
    rules:
    - alert: VeleroDailyBackupStale
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Last successful daily-apps backup was {{ $value | humanizeDuration
          }} ago (threshold 30h). Check Velero CRs and PodVolumeBackup status.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#velerodailybackupstale
        summary: Velero daily-apps backup is stale
      expr: |
        time() - velero_backup_last_successful_timestamp{schedule="daily-apps"} > 30 * 3600
      for: 15m
      labels:
        component: velero
        severity: critical
    # VeleroWeeklyBackupStale REMOVED 2026-09-05.
    #
    # weekly-apps was deliberately paused: with daily retention raised to 89d,
    # every point a 28-day weekly could restore to is already covered by a daily.
    # A paused schedule never updates velero_backup_last_successful_timestamp, so
    # this alert would have fired permanently and trained the whole velero group
    # to be ignored. An alert for a control you switched off on purpose is noise,
    # not coverage.
    #
    # If weekly-apps is ever unpaused, restore this alert with it.
    - alert: VeleroBackupRecentFailure
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Inspect the most recent Backup CR for schedule={{ $labels.schedule
          }} — check item errors and pod-volume backup status.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#velerobackuprecentfailure
        summary: Velero schedule {{ $labels.schedule }} had a failed or partially-failed
          backup in the last 24h
      expr: |
        increase(velero_backup_failure_total[24h])
          + increase(velero_backup_partial_failure_total[24h]) > 0
      for: 5m
      labels:
        component: velero
        severity: warning
    - alert: VeleroBackupStorageDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: BSL {{ $labels.name }} has been Unavailable for 15m+ — Wasabi
          auth/network issue most likely. New backups cannot upload.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#velerobackupstoragedown
        summary: Velero BackupStorageLocation {{ $labels.name }} is unavailable
      expr: velero_backup_location_status_gauge == 0
      for: 15m
      labels:
        component: velero
        severity: critical
  - interval: 1m
    name: homelab.pve.rules
    rules:
    - alert: PVENodeDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-pve
        description: Proxmox node {{ $labels.id }} reports down for 5+ minutes per
          pve-exporter on __PVE-NODE-1__.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pvenodedown
        summary: PVE node {{ $labels.id }} is down
      expr: pve_up{id=~"node/.*"} == 0
      for: 5m
      labels:
        component: pve
        severity: critical
    - alert: PVEGuestUnexpectedlyDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-pve
        description: Guest {{ $labels.id }} has onboot=1 but is not running for 10m+.
          Either it crashed or boot failed.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pveguestunexpectedlydown
        summary: PVE guest {{ $labels.id }} is down (onboot=enabled)
      expr: pve_up{id=~"qemu/.*|lxc/.*"} == 0 and pve_onboot_status{id=~"qemu/.*|lxc/.*"}
        == 1
      for: 10m
      labels:
        component: pve
        severity: warning
    - alert: PVEStorageHigh
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Storage {{ $labels.id }} at {{ $value | printf "%.1f" }}% utilization.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pvestoragehigh
        summary: PVE storage {{ $labels.id }} >85% full
      expr: |
        100 * pve_disk_usage_bytes{id=~"storage/.*"}
          / pve_disk_size_bytes{id=~"storage/.*"} > 85
      for: 30m
      labels:
        component: pve
        severity: warning
    - alert: PVEStorageCritical
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Storage {{ $labels.id }} at {{ $value | printf "%.1f" }}%. Free
          space immediately or backups will fail.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pvestoragecritical
        summary: PVE storage {{ $labels.id }} >92% full
      expr: |
        100 * pve_disk_usage_bytes{id=~"storage/.*"}
          / pve_disk_size_bytes{id=~"storage/.*"} > 92
      for: 10m
      labels:
        component: pve
        severity: critical
  - interval: 1m
    name: homelab.backup-host.rules
    rules:
    - alert: PBSExporterDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Prometheus cannot scrape backup-host-exporter — backup observability
          is blind.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsexporterdown
        summary: backup-host-exporter scrape failing
      expr: up{job="backup-host-exporter"} == 0
      for: 10m
      labels:
        component: backup-host
        severity: warning
    - alert: PBSDatastoreHigh
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Datastore {{ $labels.datastore }} at {{ $value | printf "%.1f"
          }}%. Backup rotation or prune may need attention.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsdatastorehigh
        summary: PBS datastore {{ $labels.datastore }} >85% full
      expr: |
        100 * (pbs_size - pbs_available) / pbs_size > 85
      for: 30m
      labels:
        component: backup-host
        severity: warning
    - alert: PBSDatastoreCritical
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Datastore {{ $labels.datastore }} at {{ $value | printf "%.1f"
          }}%. New backups will fail soon.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsdatastorecritical
        summary: PBS datastore {{ $labels.datastore }} >92% full
      expr: |
        100 * (pbs_size - pbs_available) / pbs_size > 92
      for: 10m
      labels:
        component: backup-host
        severity: critical
    - alert: PBSVMBackupStale
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Last backup {{ $value | humanizeDuration }} ago on datastore
          {{ $labels.datastore }}. Threshold 36h.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsvmbackupstale
        summary: 'PBS backup stale: VM {{ $labels.vm_id }} ({{ $labels.vm_name }})'
      expr: |
        # datastore!="2tb": the 2tb ARCHIVE replica's disk failed 2026-08-19
        # (Seagate ST2000DM001, 1216 reallocated / 496 pending sectors) and is
        # unmounted pending replacement — see decisions/2026-08-24-backup-host-archive-
        # disk-failure-and-alert-noise.md. It fired 18 permanently-stale alerts
        # that masked real signal. 1tb is the PRIMARY and stays in scope, so a
        # genuine backup outage still alerts. REMOVE THIS EXCLUSION once the
        # disk is replaced and s-1tb-to-2tb sync is healthy again.
        (time() - pbs_snapshot_vm_last_timestamp{datastore!="2tb"} > 36*3600)
          and on(vm_id) (
            label_replace(pve_up{id=~"qemu/.*|lxc/.*"} == 1, "vm_id", "$2", "id", "(qemu|lxc)/(.+)")
          )
      for: 30m
      labels:
        component: backup-host
        severity: warning
    # -----------------------------------------------------------------------
    # VERIFY STALENESS - replaced PBSBackupVerifyFailed + PBSArchiveVerifyFailed
    # on 2026-09-06.
    #
    # THE BUG IN THE OLD RULES: both alerted on
    #   pbs_snapshot_vm_last_verify == 0
    # which cannot distinguish "verify FAILED" from "not verified YET". Backups
    # land every 2h; the verify job runs once a day at 05:00. So the newest
    # snapshot is unverified for most of every day, and the alert fired against
    # completely healthy data - measured at 45-48% of wall-clock across ~20 VMs,
    # 13 of them firing simultaneously every morning. It was the single largest
    # source of alert noise in the estate.
    #
    # WHY A RECORDING RULE INSTEAD OF max_over_time(...[30d]):
    # Prometheus holds ~2 DAYS of history here, not 30. spec.retention is 10d
    # but retentionSize=34GB binds first - 442k head series at 14.8k samples/s,
    # dominated by apiserver and etcd histogram buckets. A [30d] range would
    # silently evaluate over whatever ~2 days exist and look like it worked.
    # The carry-forward idiom below only ever reads its OWN previous sample, so
    # it is independent of retention entirely.
    #
    # Three clauses, first match wins:
    #   1. verify is OK right now      -> stamp the current time
    #   2. otherwise                   -> carry the previous stamp forward,
    #                                     BUT only while the source series still
    #                                     exists (`and on`), so a removed VM or
    #                                     datastore does not leave an orphan that
    #                                     alerts forever and can never clear
    #   3. never seen before           -> seed with now, so a brand-new VM gets a
    #                                     full 30 days before it can alert
    - record: backup-host:last_verify_ok:timestamp
      expr: |
        (
          max by (datastore, vm_id, vm_name) (
            timestamp(pbs_snapshot_vm_last_verify == 1)
          )
        )
        or
        (
          max by (datastore, vm_id, vm_name) (backup-host:last_verify_ok:timestamp)
            and on (datastore, vm_id, vm_name)
          max by (datastore, vm_id, vm_name) (pbs_snapshot_vm_last_verify)
        )
        or
        (
          max by (datastore, vm_id, vm_name) (
            pbs_snapshot_vm_last_verify * 0 + time()
          )
        )
    - alert: PBSVerifyStale
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: No snapshot of VM {{ $labels.vm_id }} ({{ $labels.vm_name }})
          has passed verification on datastore {{ $labels.datastore }} for {{ $value
          | humanizeDuration }}. Threshold 30d. A backup that has never been verified
          is a backup you have not proven you can restore.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsverifystale
        summary: 'PBS verify stale: VM {{ $labels.vm_id }} ({{ $labels.vm_name }})
          unverified for 30d+'
      expr: |
        # datastore!="2tb": same exclusion and same reason as PBSVMBackupStale
        # above - the 2tb archive replica's disk failed and is being wiped and
        # re-evaluated. REMOVE BOTH EXCLUSIONS TOGETHER once the archive is
        # rebuilt and the s-1tb-to-2tb sync is healthy again.
        (time() - backup-host:last_verify_ok:timestamp{datastore!="2tb"}) > 30 * 24 * 3600
      for: 1h
      labels:
        component: backup-host
        severity: warning
  - interval: 1m
    name: homelab.synology.rules
    rules:
    - alert: SynologySNMPDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: snmp-exporter cannot reach __NAS-IP__ — NAS observability is
          blind.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#synologysnmpdown
        summary: Synology NAS SNMP scrape failing
      expr: up{job="snmp-synology"} == 0
      for: 10m
      labels:
        component: synology
        severity: warning
    - alert: SynologyDiskUnhealthy
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: diskHealthStatus={{ $value }} on {{ $labels.diskID }} — investigate
          via DSM Storage Manager.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#synologydiskunhealthy
        summary: Synology disk reports non-normal health
      # Exclusion removed 2026-08-18 — the NAS now runs with NO cache at all.
      #
      # History: 'Cache device 1-1' was excluded 2026-07-16 as a known-failing NVMe,
      # accepted and left installed-but-unused pending a planned swap. On 2026-08-18 a
      # per-disk sweep found 'Cache device 1-2' ALSO reading health=3 — the second
      # drive had failed behind the exclusion, silently, because the rule only ever
      # named the first. Both 1TB NVMes were pulled the same day and the read cache
      # was retired rather than replaced. Post-removal the exporter reports exactly
      # four series (Disk 1-4, all health=1) and this alert went inactive.
      #
      # There is no known-bad disk and no cache device, so there is no exclusion. That
      # is deliberate: an exclusion scoped to one diskID cannot see the second failure
      # of the same class, which is exactly how this one hid for a month. If a disk
      # must be excluded again, exclude it by ID *and* set a removal date.
      #
      # Data disks (Disk 1-4) read health=1 throughout; no data was ever at risk.
      expr: diskHealthStatus{job="snmp-synology"} > 1
      for: 15m
      labels:
        component: synology
        severity: warning
    # Added 2026-08-18 with the cache retirement. SynologyDiskUnhealthy only fires on
    # a disk it can SEE. If the OID walk stops returning diskHealthStatus — SNMP perms
    # changed, MIB moved, exporter misconfigured — the rule matches nothing and looks
    # identical to a healthy NAS. `up` stays 1 the whole time because the scrape still
    # succeeds; SynologySNMPDown will not catch this.
    #
    # That blind spot is the same class of failure as the exclusion above: not a disk
    # going bad, but us quietly ceasing to look at it. Four data disks now carry every
    # PVC on the cluster with no cache layer in front of them, so losing sight of them
    # is worth paging over.
    - alert: SynologyDiskMetricsAbsent
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: snmp-synology is scraping (up=1) but returned no diskHealthStatus
          series for 15m. Disk health is unobserved — this looks like "no unhealthy
          disks" and is not. Check SNMP community/perms on the NAS and the exporter's
          module config.
        summary: Synology disk health metrics have disappeared
      expr: |
        absent(diskHealthStatus{job="snmp-synology"}) == 1
        and on() (up{job="snmp-synology"} == 1)
      for: 15m
      labels:
        component: synology
        severity: warning
    - alert: SynologyDiskRemainLifeLow
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: SSD wear-leveling indicator at {{ $value }}%. Plan replacement
          before <10%.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#synologydiskremainlifelow
        summary: 'Synology SSD wear: {{ $labels.diskID }} at {{ $value }}% lifetime'
      # 'Cache device 1-1' excluded 2026-07-16 — same accepted/parked drive as
      # SynologyDiskUnhealthy above. Re-include when physically removed.
      expr: |
        diskRemainLife{job="snmp-synology", diskID!="Cache device 1-1"} >= 0
          and diskRemainLife{job="snmp-synology", diskID!="Cache device 1-1"} < 20
      for: 1h
      labels:
        component: synology
        severity: warning
  - interval: 1m
    name: homelab.paloalto.rules
    rules:
    - alert: PaloAltoSNMPDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: snmp-exporter cannot reach __LAN-IP__ via {{ $labels.job }} —
          firewall observability is blind. Was previously responsive.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltosnmpdown
        summary: Palo Alto SNMP scrape failing ({{ $labels.job }})
      expr: |
        up{job=~"snmp-paloalto.*"} == 0
          and max_over_time(up{job=~"snmp-paloalto.*"}[24h]) == 1
      for: 10m
      labels:
        component: paloalto
        severity: warning
    - alert: PaloAltoSessionUtilizationHigh
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: Active sessions {{ with query "panSessionActive" }}{{ . | first
          | value }}{{ end }} of {{ with query "panSessionMax" }}{{ . | first | value
          }}{{ end }}. Investigate scan/attack or runaway client.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltosessionutilizationhigh
        summary: PA session table >50% full ({{ $value | printf "%.1f" }}%)
      expr: 100 * panSessionActive / panSessionMax > 50
      for: 15m
      labels:
        component: paloalto
        severity: warning
    - alert: PaloAltoSessionUtilizationCritical
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: Session table near exhaustion. New connections may be dropped
          imminently.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltosessionutilizationcritical
        summary: PA session table >80% full ({{ $value | printf "%.1f" }}%)
      expr: 100 * panSessionActive / panSessionMax > 80
      for: 5m
      labels:
        component: paloalto
        severity: critical
    - alert: PaloAltoSessionDiscardsSpike
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: Sessions are being discarded at {{ $value | printf "%.1f" }}/s
          for 15m+. Could indicate scan/attack, policy denial spike, or session-table
          pressure.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltosessiondiscardsspike
        summary: PA session-discard rate elevated ({{ $value | printf "%.1f" }}/s)
      expr: rate(panSessionDiscard[5m]) > 5
      for: 15m
      labels:
        component: paloalto
        severity: warning
    - alert: PaloAltoInterfaceSaturationHigh
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: Interface {{ $labels.ifName }} sustained >80% link-speed utilization
          for 10m+ (peak direction).
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltointerfacesaturationhigh
        summary: PA interface {{ $labels.ifName }} >80% saturated
      expr: |
        (
          max by(ifName, ifIndex, instance) (
            8 * rate(ifHCInOctets{job="snmp-paloalto-if"}[5m])
              or 8 * rate(ifHCOutOctets{job="snmp-paloalto-if"}[5m])
          )
          / on(ifIndex) group_left() (ifHighSpeed{job="snmp-paloalto-if"} * 1e6)
        ) * 100 > 80
        and on(ifIndex) ifAdminStatus{job="snmp-paloalto-if"} == 1
        and on(ifIndex) ifHighSpeed{job="snmp-paloalto-if"} > 0
      for: 10m
      labels:
        component: paloalto
        severity: warning
    - alert: PaloAltoInterfaceSaturationCritical
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: Interface {{ $labels.ifName }} pinned to link speed for 5m+.
          Drops likely.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltointerfacesaturationcritical
        summary: PA interface {{ $labels.ifName }} >95% saturated
      expr: |
        (
          max by(ifName, ifIndex, instance) (
            8 * rate(ifHCInOctets{job="snmp-paloalto-if"}[5m])
              or 8 * rate(ifHCOutOctets{job="snmp-paloalto-if"}[5m])
          )
          / on(ifIndex) group_left() (ifHighSpeed{job="snmp-paloalto-if"} * 1e6)
        ) * 100 > 95
        and on(ifIndex) ifAdminStatus{job="snmp-paloalto-if"} == 1
        and on(ifIndex) ifHighSpeed{job="snmp-paloalto-if"} > 0
      for: 5m
      labels:
        component: paloalto
        severity: critical
    - alert: PaloAltoInterfaceErrorsSpike
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: Input error rate {{ $value | printf "%.2f" }}/s for 15m+ — usually
          a layer-1/cable/duplex issue.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltointerfaceerrorsspike
        summary: PA interface {{ $labels.ifName }} input errors >1/s
      expr: |
        rate(ifInErrors{job="snmp-paloalto-if"}[5m]) > 1
        and on(ifIndex) ifAdminStatus{job="snmp-paloalto-if"} == 1
      for: 15m
      labels:
        component: paloalto
        severity: warning
  - interval: 1m
    name: homelab.pihole.rules
    rules:
    - alert: PiholeExporterDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-pihole
        description: Cannot reach pihole-exporter — DNS observability is blind. Either
          the exporter pod is unhealthy or both Pi-holes are unreachable.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#piholeexporterdown
        summary: pihole-exporter scrape failing
      expr: up{job="pihole-exporter"} == 0
      for: 10m
      labels:
        component: pihole
        severity: warning
    - alert: PiholeDisabled
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-pihole
        description: Ad-blocking is OFF on {{ $labels.hostname }}. Re-enable in the
          admin UI or check why it was disabled.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#piholedisabled
        summary: Pi-hole blocking disabled on {{ $labels.hostname }}
      expr: pihole_status == 0
      for: 15m
      labels:
        component: pihole
        severity: warning
    - alert: PiholeUpstreamSlow
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-pihole
        description: On {{ $labels.hostname }}, average response time from {{ $labels.destination_name
          }} is {{ $value | printf "%.2f" }}s for 15m+. Upstream DNS provider issue.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#piholeupstreamslow
        summary: Pi-hole upstream {{ $labels.destination_name }} slow ({{ $value |
          printf "%.2f" }}s)
      expr: |
        pihole_forward_destinations_responsetime{destination_name!~"cache|blocklist"} > 0.5
      for: 15m
      labels:
        component: pihole
        severity: warning
  - interval: 30s
    name: homelab.network.rules
    rules:
    - alert: WANDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: Both 1.1.1.1:53 and 8.8.8.8:53 unreachable for 2m+. Check Palo
          Alto WAN interface and ISP.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#wandown
        summary: WAN connectivity lost — all public TCP/53 probes failing
      expr: |
        min by () (probe_success{target_kind="wan"}) == 0
      for: 2m
      labels:
        component: network
        severity: critical
    - alert: PublicDNSResolutionFailing
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/paloalto-firewall
        description: DNS query against {{ $labels.instance }} has been failing for
          5m+.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#publicdnsresolutionfailing
        summary: Public DNS resolver {{ $labels.instance }} not answering
      expr: probe_success{target_kind="public_dns"} == 0
      for: 5m
      labels:
        component: network
        severity: warning
  - interval: 1m
    name: homelab.k8s.rules
    rules:
    - alert: HomelabPVCHigh
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: PVC at {{ $value | printf "%.1f" }}% on node {{ $labels.kubernetes_node
          }}.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#homelabpvchigh
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} >85%
          full
      expr: |
        100 * kubelet_volume_stats_used_bytes
          / kubelet_volume_stats_capacity_bytes > 85
      for: 30m
      labels:
        component: storage
        severity: warning
    - alert: HomelabPVCCritical
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: PVC at {{ $value | printf "%.1f" }}% on node {{ $labels.kubernetes_node
          }}. Resize or free space.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#homelabpvccritical
        summary: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} >92%
          full
      expr: |
        100 * kubelet_volume_stats_used_bytes
          / kubelet_volume_stats_capacity_bytes > 92
      for: 10m
      labels:
        component: storage
        severity: critical
    - alert: CoreDNSDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-overview
        description: No CoreDNS pod is answering for 2m+. Cluster-internal name resolution
          is down — pods cannot reach Services by name (caused the 2026-07-03 outage).
          Check `kubectl -n kube-system get pods -l k8s-app=kube-dns`.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#corednsdown
        summary: In-cluster DNS is down — no CoreDNS replica is up
      expr: absent(up{job="coredns"} == 1)
      for: 2m
      labels:
        component: dns
        severity: critical
    - alert: CoreDNSNoRedundancy
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-overview
        description: Fewer than 2 CoreDNS replicas are up ({{ $value }}) for 15m+. DNS
          still works but a single node failure could take it down. Expected 2 replicas
          with hostname anti-affinity.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#corednsnoredundancy
        summary: CoreDNS lost HA redundancy ({{ $value }} replica up)
      expr: count(up{job="coredns"} == 1) < 2
      for: 15m
      labels:
        component: dns
        severity: warning
    - alert: K3sNodeNotReady
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-overview
        description: k3s node {{ $labels.node }} has been NotReady for 5m+. Check the
          node's k3s/kubelet service and the PVE guest.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#k3snodenotready
        summary: k3s node {{ $labels.node }} is NotReady
      expr: |
        kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 5m
      labels:
        component: k8s
        severity: critical
    - alert: K3sNodeMemoryHigh
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-overview
        description: Node {{ $labels.instance }} memory at {{ $value | printf "%.1f" }}%
          for 10m+. Risk of OOM (the install-storm OOM on 2026-07-02 prompted a RAM bump).
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#k3snodememoryhigh
        summary: k3s node {{ $labels.instance }} memory >88%
      expr: |
        100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"}
          / node_memory_MemTotal_bytes{job="node-exporter"}) > 88
      for: 10m
      labels:
        component: k8s
        severity: warning
    - alert: K3sNodeMemoryCritical
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-overview
        description: Node {{ $labels.instance }} memory at {{ $value | printf "%.1f" }}%
          for 5m+. OOM imminent — kubelet may evict or the kernel OOM-killer may fire.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#k3snodememorycritical
        summary: k3s node {{ $labels.instance }} memory >94%
      expr: |
        100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"}
          / node_memory_MemTotal_bytes{job="node-exporter"}) > 94
      for: 5m
      labels:
        component: k8s
        severity: critical
    # Added 2026-08-18 alongside the paperless memory bounding. Rationale: a
    # container hitting its cgroup limit does NOT reliably produce a visible
    # CrashLoop. In multi-process containers (paperless runs gunicorn + celery
    # workers + ocrmypdf/tesseract subprocesses) the kernel kills the largest
    # process, not PID 1 — you get a failed OCR task or a stuck document and no
    # pod-level signal at all. Bounding memory without this alert converts loud
    # node pressure into silent ingestion failure, which is strictly worse.
    - alert: ContainerOOMKilled
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-overview
        description: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod
          }} was OOMKilled. Check whether the limit is too tight or the workload
          leaked. For multi-process containers a killed worker may not restart the
          pod — check the app's own task/error state, not just pod status.
        summary: Container {{ $labels.namespace }}/{{ $labels.container }} hit its memory limit
      expr: |
        kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
      for: 1m
      labels:
        component: k8s
        severity: warning
  - interval: 1m
    name: homelab.longhorn.rules
    rules:
    - alert: LonghornVolumeFaulted
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Longhorn volume {{ $labels.volume }} (PVC {{ $labels.pvc }}) is
          FAULTED — all replicas down, data unavailable. Immediate action required.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#longhornvolumefaulted
        summary: Longhorn volume {{ $labels.volume }} faulted (data unavailable)
      expr: |
        max by (volume, pvc) (longhorn_volume_robustness) == 3
      for: 2m
      labels:
        component: storage
        severity: critical
    - alert: LonghornVolumeDegraded
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Longhorn volume {{ $labels.volume }} (PVC {{ $labels.pvc }}) degraded
          for 15m+ (a replica is down/rebuilding). Brief during node reboots; persistent
          means a replica can't rebuild — check Longhorn disk space and node scheduling.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#longhornvolumedegraded
        summary: Longhorn volume {{ $labels.volume }} degraded (replica down)
      expr: |
        max by (volume, pvc) (longhorn_volume_robustness) == 2
      for: 15m
      labels:
        component: storage
        severity: warning
    - alert: LonghornNodeNotReady
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Longhorn node {{ $labels.node }} has been not-ready for 10m+ — it
          cannot host volume replicas. Check longhorn-manager on that node.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#longhornnodenotready
        summary: Longhorn node {{ $labels.node }} not ready
      expr: |
        longhorn_node_status{condition="ready"} == 0
      for: 10m
      labels:
        component: storage
        severity: warning
    - alert: LonghornDiskSpaceHigh
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Longhorn disk on node {{ $labels.node }} is {{ $value | printf "%.1f"
          }}% full for 30m+. When full, replicas can't schedule and volumes degrade.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#longhorndiskspacehigh
        summary: Longhorn disk on {{ $labels.node }} >80% full
      expr: |
        100 * longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 80
      for: 30m
      labels:
        component: storage
        severity: warning
  - interval: 1m
    name: homelab.bastion.rules
    rules:
    - alert: OpsmanDown
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-overview
        description: Prometheus has been unable to scrape bastion at __LAN-IP__:8080 for
          5+ minutes. bastion is the homelab Day-2 ops loop — while it is down, nightly
          drift / cve / patches / backup-freshness / cert-expiry sweeps are NOT running.
          From the bastion LXC (CT 121 on __PVE-NODE-3__) check `systemctl status bastion.service`.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#opsmandown
        summary: bastion is down on {{ $labels.instance }}
      expr: up{job="bastion"} == 0
      for: 5m
      labels:
        component: bastion
        severity: critical
    - alert: OpsmanMissedNightlySweep
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-overview
        description: bastion's journal at /opt/bastion/data/journal.db has not received
          a row in {{ $value | printf "%.0f" }} minutes (>25h). bastion runs its 8
          scheduled jobs (drift, cve, exposed-ports, backup-freshness, cert-expiry,
          health, patches, test-restore) overnight between 03:11–05:13 UTC; each emits
          thousands of events. A 25h+ gap means yesterday's overnight sweep did NOT
          execute — the "nothing rots silently" core value is itself rotting. From the
          bastion LXC check `sqlite3 /opt/bastion/data/scheduler.db 'SELECT id,
          datetime(next_run_time, "unixepoch") FROM apscheduler_jobs;'` to see whether
          the scheduler is alive but stalled, or `systemctl status bastion.service` to
          confirm the process is up. Fast-lane (Kuma /health 503) catches journal-DB-
          unreadable in ~3 min; if Kuma stayed silent and only this fired, the SELECT
          path works — the scheduler is the failure mode.
        runbook_url: https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#opsmanmissednightlysweep
        summary: bastion has not written a journal event in {{ $value | printf "%.0f" }}
          minutes — likely missed nightly sweep
      expr: opsman_journal_lag_minutes > 1500
      for: 30m
      labels:
        component: bastion
        severity: warning
  - interval: 1m
    name: homelab.enclosure-temp.rules
    rules:
    - alert: USBEnclosureDriveTempHigh
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Drive {{ $labels.device }} ({{ $labels.model }}) on {{ $labels.host
          }} at {{ $value }}C for 15m+. Improve enclosure airflow before it throttles
          or drops the bus.
        summary: 'USB enclosure drive hot: {{ $labels.host }}/{{ $labels.device }} at
          {{ $value }}C'
      expr: usb_enclosure_drive_temp_celsius > 55
      for: 15m
      labels:
        component: storage
        severity: warning
    - alert: USBEnclosureDriveTempCritical
      annotations:
        dashboard_url: https://grafana.__BASE-DOMAIN__/d/homelab-storage
        description: Drive {{ $labels.device }} ({{ $labels.model }}) on {{ $labels.host
          }} at {{ $value }}C — above rated operating ceiling. The 2026-07-11 PBS enclosure
          bus-drop was thermal; act now.
        summary: 'USB enclosure drive OVER SPEC: {{ $labels.host }}/{{ $labels.device
          }} at {{ $value }}C'
      expr: usb_enclosure_drive_temp_celsius > 60
      for: 5m
      labels:
        component: storage
        severity: critical
    - alert: USBEnclosureTempCollectorStale
      annotations:
        description: usb_drive_temps.prom on __PVE-NODE-1__ has not updated in 30m+ — the temp
          collector cron or the nas2 SSH path is broken. Enclosure temps are blind.
        summary: USB enclosure temperature collector is stale
      expr: |
        time() - node_textfile_mtime_seconds{file="usb_drive_temps.prom"} > 1800
      for: 5m
      labels:
        component: storage
        severity: warning
    - alert: USBEnclosureTempSeriesMissing
      annotations:
        description: No temperature series from {{ $labels.host }} enclosure drives for
          20m+ while the collector file stays fresh — host-side SMART reads are failing
          (VM IO contention or enclosure trouble).
        summary: Enclosure temp series missing for a host
      expr: |
        count by (host) (usb_enclosure_drive_temp_celsius offset 1d)
          unless on (host) count by (host) (usb_enclosure_drive_temp_celsius)
      for: 20m
      labels:
        component: storage
        severity: warning
