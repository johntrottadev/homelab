# Captured from live cluster 2026-05-13 (Phase 10 wave 10-01).
# Was kubectl-applied via `monitoring/prometheus-pv.yaml`.
#
# kustomize.toolkit.fluxcd.io/ssa: Merge   --> preserves spec.claimRef.uid set by the
# in-cluster PV controller after binding. Without this, Flux would strip claimRef.uid
# on subsequent reconciles and the PVC would go Lost (fluxcd/flux2#2250).
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/bound-by-controller: "yes"
    kustomize.toolkit.fluxcd.io/ssa: Merge
  name: prometheus-pv
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 50Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: prometheus-pvc-prometheus-prometheus-prometheus-0
    namespace: monitoring
    uid: d0bc0683-de90-4cff-9b7f-07f9f9c54ecf
  mountOptions:
    - nolock
    - noatime
    - nfsvers=4.1
  nfs:
    path: /volume1/kub/homelab/monitoring/prometheus
    server: __NAS-IP__
  persistentVolumeReclaimPolicy: Retain
  storageClassName: monitoring
