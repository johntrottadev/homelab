apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  mountOptions:
    - hard
    - nfsvers=4.1
  claimRef:
    namespace: n8n
    name: n8n-pvc
  nfs:
    # Mirrors the existing PV's server hostname. PV nfs.server is immutable
    # once Bound; switching to the IP would force-fail the SSA update. The
    # latent DNS landmine (__NAS-HOST__ -> traefik VIP) is accepted here
    # as it is for all currently-running flux PVs that use the hostname.
    server: ${NAS_HOST}
    path: /volume1/kub/homelab/n8n
    readOnly: false
