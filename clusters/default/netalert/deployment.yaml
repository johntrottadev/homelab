# Image pinned to digest captured 2026-04-29 from Docker Hub.
# Tag jokobsk/netalertx:26.4.6 == :26.4 == :26 == :latest at capture time.
# Re-pin via `crane digest jokobsk/netalertx:latest` for security/feature updates.
# Project policy: never `:latest` in production manifests.
#
# hostNetwork: true is REQUIRED for ARP/mDNS LAN discovery.
# nodeName: k3s-1 pins the pod to the control-plane node (__K3S-API-IP__) —
# the manual EndpointSlice in endpoints.yaml routes the Service to
# that host IP, so the IngressRoute keeps a clean ClusterIP shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netalert
  namespace: netalert
  labels:
    app: netalert
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC, single-replica, hostNetwork pinned
  selector:
    matchLabels:
      app: netalert
  template:
    metadata:
      labels:
        app: netalert
    spec:
      nodeName: k3s-1                  # pin to control-plane (__K3S-API-IP__)
      hostNetwork: true               # required for ARP/mDNS
      dnsPolicy: ClusterFirstWithHostNet  # let pod still resolve cluster DNS
      containers:
        - name: netalert
          image: jokobsk/netalertx@sha256:27cbad41464d54bdc2a6ba59b4c1f961ace847918b234b6afe66baebe9262a75
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: PUID
              value: "20211"
            - name: PGID
              value: "20211"
            - name: LISTEN_ADDR
              value: "0.0.0.0"
            - name: PORT
              value: "20211"
            - name: GRAPHQL_PORT
              value: "20212"
          ports:
            - name: http
              containerPort: 20211
              hostPort: 20211        # explicit on hostNetwork — documents the binding
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /
              port: 20211
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 20211
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netalert-data
