# Image pinned to digest captured 2026-07-03 from Docker Hub.
# Tag jokobsk/netalertx:26.7.1 (upgraded from 26.4.6 in the upgrade campaign).
# Re-pin via `crane digest jokobsk/netalertx:<tag>` for security/feature updates.
# Project policy: never `:latest` in production manifests.
#
# hostNetwork: true is REQUIRED for ARP/mDNS LAN discovery.
# nodeName: k3s-1 pins the pod to the control-plane node (__K3S-API-IP__) —
# the manual EndpointSlice in endpoints.yaml routes the Service to
# that host IP, so the IngressRoute keeps a clean ClusterIP shape.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netalert
  namespace: netalert
  labels:
    app: netalert
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC, single-replica, hostNetwork pinned
  selector:
    matchLabels:
      app: netalert
  template:
    metadata:
      labels:
        app: netalert
    spec:
      nodeName: k3s-wkr-1            # pin to new-cluster worker (__LAN-IP__)
      hostNetwork: true               # required for ARP/mDNS
      dnsPolicy: ClusterFirstWithHostNet  # let pod still resolve cluster DNS
      containers:
        - name: netalert
          image: jokobsk/netalertx@sha256:ffab3346b7a924b47bf6b992f369241801b736e54087011047e227937969532f
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Toronto
            - name: PUID
              value: "20211"
            - name: PGID
              value: "20211"
            - name: LISTEN_ADDR
              value: "0.0.0.0"
            - name: PORT
              value: "20211"
            - name: GRAPHQL_PORT
              value: "20212"
          # PALOARP plugin reads PALO_HOST / PALO_API_KEY / PALO_VERIFY_TLS /
          # PALO_IFACE_INCLUDE / PALO_IFACE_EXCLUDE from this Secret.
          # Apply secret out-of-band from secret-paloarp.yaml.template (gitignored).
          envFrom:
            - secretRef:
                name: paloarp-credentials
                optional: true
          ports:
            - name: http
              containerPort: 20211
              hostPort: 20211        # explicit on hostNetwork — documents the binding
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # nmap scan bursts spike CPU well past the 500m old cap, triggering
              # CPUThrottlingHigh (~53% of CFS periods throttled). Bump to 2000m;
              # idle baseline is ~100m so headroom for bursts, not sustained load.
              cpu: "2000m"
              # nginx + php-fpm + python server + 114k-entry OUI DB exceeded the
              # old 512Mi cap → OOMKilled (exit 137) ~1154 times, firing
              # KubePodCrashLooping. Bump to 1Gi; steady-state is ~400-500Mi.
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            # Custom Palo Alto ARP/DHCP discovery plugin. ConfigMap is generated
            # by configMapGenerator in clusters/default/kustomization.yaml from
            # plugin-PALOARP/. /app/front is marked readonly via READ_ONLY_FOLDERS
            # but volumeMounts override that.
            - name: paloarp-plugin
              mountPath: /app/front/plugins/PALOARP
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 20211
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 20211
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netalert-data-pvc
        - name: paloarp-plugin
          configMap:
            name: paloarp-plugin
            defaultMode: 0755
