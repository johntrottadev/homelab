# Manual EndpointSlice routes the headless Service to the k3s-1 host IP
# (__K3S-API-IP__:20211) where the hostNetwork pod is pinned.
# Pattern parallels Phase 14 external-IP-backend bundles (__PVE-NODE-1__.yaml etc.)
# — only twist is the target is a node IP, not an external IP.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: netalert-host
  namespace: netalert
  labels:
    kubernetes.io/service-name: netalert
addressType: IPv4
ports:
  - name: http
    port: 20211
    protocol: TCP
endpoints:
  - addresses:
      - "${K3S_API_IP}"
    conditions:
      ready: true
