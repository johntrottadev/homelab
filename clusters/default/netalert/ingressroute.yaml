apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netalert
  namespace: netalert
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`netalert.${BASE_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: crowdsec-bouncer
          namespace: kube-system
      services:
        - name: netalert
          port: 20211
