# Static NFS PV — mirrors uptime-kuma/pv.yaml shape.
# NAS path /volume1/kub/homelab/netalert pre-created by operator
# (chown 20211:20211, mode 0755) — Task 2 checkpoint of this plan.
# NOTE: PUID/PGID 20211 is NetAlertX's upstream default, NOT the
# 1000:1000 used by uptime-kuma/retired-fing.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: netalert-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  nfs:
    server: __NAS-HOST__
    path: /volume1/kub/homelab/netalert
    readOnly: false
