# Dynamic PVC against storage-apps SC (Wave 2, 260511-utf).
# Path: __NAS-IP__:/volume1/kub/homelab/netalert/netalert-data/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netalert-data-pvc
  namespace: netalert
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: storage-apps
