# Ingress segmentation for the `ciso-assistant` namespace.
# Standard: AI-Backbone/standards/security/network-segmentation-standard.md
#
# Ingress-only by design. Egress is deliberately NOT restricted in this pass:
# egress default-deny breaks DNS on first apply and every later symptom reads
# as an application bug. Add egress per-namespace once ingress is proven.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ciso-assistant
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-sources
  namespace: ciso-assistant
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # 1. Pods within this namespace (app <-> its own database, cache, workers).
        - podSelector: {}
        # 2. Traefik - the only intended external entry point.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # 3. The WHOLE monitoring namespace, not just prometheus. Scoping this to
        #    app.kubernetes.io/name=prometheus on 2026-09-03 silently blocked
        #    blackbox-exporter, which probes every app - producing false "app down"
        #    alerts for jellyfin and others while the apps were healthy. monitoring
        #    also holds kube-state-metrics, snmp/speedtest/backup-host/pihole exporters.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # 4. Uptime-kuma health probes - a monitoring function, same class as (3).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
        # 5. hostNetwork collectors (node-exporter, netdata, netalert) arrive as
        #    NODE IPs, not pod IPs, so no selector can ever match them. Nodes are
        #    __LAN-IP__-145; the /29 covers .140-.147.
        - ipBlock:
            cidr: __LAN-IP__/29
