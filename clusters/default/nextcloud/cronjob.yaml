# Nextcloud's background job runner. The official guidance is to run
# php cron.php every 5 minutes (the alternatives — AJAX and Webcron —
# are unreliable for share/notification tasks).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 240
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          # Never, not OnFailure. With OnFailure the Job controller DELETES the
          # pod once the backoff limit is reached, so a failed run leaves no pod
          # and no logs - only a "Job has reached the specified backoff limit"
          # event. This job has been failing intermittently since at least
          # 2026-09-03 (roughly 3 of every 4 runs) and was undiagnosable for
          # exactly that reason: the container starts, exits non-zero in ~2s,
          # and the evidence is collected before it can be read. Manual runs and
          # `kubectl create job --from` both succeed, so the failure is specific
          # to the scheduled path.
          #
          # With Never, failed pods are retained under failedJobsHistoryLimit (3)
          # and their logs survive for inspection. A job that fails should leave
          # evidence; that is worth more than the in-place retry OnFailure buys.
          restartPolicy: Never
          securityContext:
            fsGroup: 33
          containers:
            - name: cron
              image: nextcloud:34.0.3-apache@sha256:0b8261f6335af6b95264ce893b4d645857638e0fa151b5ba620f25f377318ae1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Wait for the pod's network path to be programmed before
                  # touching the database.
                  #
                  # Without this the job fails roughly 3 runs in 4 with
                  #   SQLSTATE[08006] connection to server at "nextcloud-postgres"
                  #   ... failed: Connection refused
                  # about two seconds after the container starts. Postgres is
                  # healthy throughout and never logs the attempt, because the
                  # connection is rejected before it arrives: a pod that dials
                  # out immediately on start can beat its own network setup, and
                  # k3s's kube-router REJECTs rather than DROPs, so the failure
                  # is an instant refusal rather than a timeout.
                  #
                  # Reproduced 2026-09-04: six pods dialing postgres:5432 as
                  # their first action were refused 6/6, while a pod that slept
                  # first connected 6/6. Same namespace, same service, same
                  # moment.
                  for _ in $(seq 1 30); do
                    php -r 'exit(@fsockopen("nextcloud-postgres", 5432) ? 0 : 1);' && break
                    sleep 2
                  done
                  exec runuser -u www-data -- php -f /var/www/html/cron.php
              volumeMounts:
                - name: html
                  mountPath: /var/www/html
                - name: data
                  mountPath: /var/www/html/data
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: html
              persistentVolumeClaim:
                claimName: nextcloud-pvc
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data-pvc
