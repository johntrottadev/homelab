# Static NFS PV for Nextcloud's /var/www/html/data — the user-files
# tree (filesystem-primary mode). Each upload is one POSIX file at
# data/<user>/files/<path>; the rclone CronJob (rclone-cronjob.yaml)
# mirrors that tree to Wasabi at object level so each user file becomes
# one S3 object with its real path as the key (browsable, restorable
# without Postgres).
#
# Replaces the prior MinIO-backed S3-primary path (decommissioned with
# this change). The 500Gi capacity matches the freed MinIO PV; actual
# headroom is whatever the NAS volume has.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  mountOptions:
    - hard
    - nfsvers=4.1
  claimRef:
    namespace: nextcloud
    name: nextcloud-data-pvc
  nfs:
    server: ${NAS_HOST}
    path: /volume1/kub/homelab/nextcloud/data
    readOnly: false
