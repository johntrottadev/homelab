apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    # RWX NFS volume tolerates rolling, but PHP opcache + on-disk session
    # state across two pods can race during install/upgrade. Recreate is
    # safer for a single-instance personal Nextcloud.
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      # Apache image runs as root (port 80 binding inside the container);
      # www-data (UID 33) owns /var/www/html. fsGroup applies to PV mount.
      securityContext:
        fsGroup: 33
      initContainers:
        # Ensure the NFS-mounted /var/www/html is writable by www-data
        # before the main container's entrypoint copies the upstream
        # web root in. Mirrors the n8n init-chmod pattern.
        - name: init-chown
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 33:33 /var/www/html && chmod 750 /var/www/html
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      containers:
        - name: nextcloud
          image: nextcloud:30-apache
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            # --- Database (Postgres) ---
            - name: POSTGRES_HOST
              value: nextcloud-postgres
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            # --- Redis (file locking + memcache) ---
            - name: REDIS_HOST
              value: nextcloud-redis
            - name: REDIS_HOST_PORT
              value: "6379"
            # --- Initial admin (only honored at first install) ---
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_PASSWORD
            # --- Trust the Traefik IngressRoute ---
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.__BASE-DOMAIN__
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITEHOST
              value: nextcloud.__BASE-DOMAIN__
            - name: OVERWRITECLIURL
              value: https://nextcloud.__BASE-DOMAIN__
            # Pod CIDR + service CIDR — adjust if these change. Lets
            # Nextcloud trust X-Forwarded-* from Traefik.
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16 10.43.0.0/16"
            # --- MinIO (in-cluster) as PRIMARY object storage ---
            # Migrated from Wasabi 2026-04-30: see clusters/default/minio/.
            # Wasabi nextcloud-jt-lab bucket retained until the next
            # confirmed Hyper Backup run, then it can be deleted.
            # The docker-entrypoint regenerates objectstore.config.php
            # from these env vars on every start, so changes apply on pod
            # restart (no manual occ commands needed).
            - name: OBJECTSTORE_S3_BUCKET
              value: nextcloud
            - name: OBJECTSTORE_S3_REGION
              value: us-east-1
            - name: OBJECTSTORE_S3_HOST
              value: minio.minio.svc.cluster.local
            - name: OBJECTSTORE_S3_PORT
              value: "9000"
            - name: OBJECTSTORE_S3_SSL
              value: "false"
            - name: OBJECTSTORE_S3_USEPATH_STYLE
              value: "true"
            - name: OBJECTSTORE_S3_AUTOCREATE
              value: "false"
            - name: OBJECTSTORE_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: OBJECTSTORE_S3_KEY
            - name: OBJECTSTORE_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: OBJECTSTORE_S3_SECRET
            # --- PHP runtime tuning ---
            - name: PHP_MEMORY_LIMIT
              value: 1024M
            - name: PHP_UPLOAD_LIMIT
              value: 16G
          volumeMounts:
            - name: html
              mountPath: /var/www/html
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.__BASE-DOMAIN__
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.__BASE-DOMAIN__
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.__BASE-DOMAIN__
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: nextcloud-pvc
