apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    # RWX NFS volume tolerates rolling, but PHP opcache + on-disk session
    # state across two pods can race during install/upgrade. Recreate is
    # safer for a single-instance personal Nextcloud.
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      # Apache image runs as root (port 80 binding inside the container);
      # www-data (UID 33) owns /var/www/html. fsGroup applies to PV mount.
      securityContext:
        fsGroup: 33
      initContainers:
        # Ensure both NFS mounts are writable by www-data before the
        # main container's entrypoint copies the upstream web root in.
        # Mirrors the n8n init-chmod pattern.
        - name: init-chown
          image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -c
            - |
              set -e
              chown -R 33:33 /var/www/html && chmod 750 /var/www/html
              chown -R 33:33 /var/www/html/data && chmod 770 /var/www/html/data
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/data
      containers:
        - name: nextcloud
          image: nextcloud:34.0.3-apache@sha256:8e5f49801db0cf4659b3089ce1917728023bb8cba7f93731f2abbdfe3a18df0a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            # --- Database (Postgres) ---
            - name: POSTGRES_HOST
              value: nextcloud-postgres
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            # --- Redis (file locking + memcache) ---
            - name: REDIS_HOST
              value: nextcloud-redis
            - name: REDIS_HOST_PORT
              value: "6379"
            # --- Initial admin (only honored at first install) ---
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_PASSWORD
            # --- Trust the Traefik IngressRoute ---
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: nextcloud.${BASE_DOMAIN}
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITEHOST
              value: nextcloud.${BASE_DOMAIN}
            - name: OVERWRITECLIURL
              value: https://nextcloud.${BASE_DOMAIN}
            # Pod CIDR + service CIDR — adjust if these change. Lets
            # Nextcloud trust X-Forwarded-* from Traefik.
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16 10.43.0.0/16"
            # --- Filesystem-primary storage ---
            # User uploads land at /var/www/html/data/<user>/files/<path>
            # on the nextcloud-data PVC (NFS, 500Gi). Per-user files are
            # mirrored to Wasabi at object level by the
            # nextcloud-rclone-wasabi CronJob — each file becomes one
            # S3 object with its real path as the key, so Wasabi is
            # standalone-restorable without Postgres.
            #
            # Migration history:
            #   2026-04-30  cutover Wasabi-primary → MinIO-primary (commit b824964)
            #   2026-05-04  cutover MinIO-primary → filesystem-primary (this commit);
            #               MinIO decommissioned, replicate-cronjob removed.
            - name: NEXTCLOUD_DATA_DIR
              value: /var/www/html/data
            # --- PHP runtime tuning ---
            - name: PHP_MEMORY_LIMIT
              value: 1024M
            - name: PHP_UPLOAD_LIMIT
              value: 16G
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: data
              mountPath: /var/www/html/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.${BASE_DOMAIN}
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.${BASE_DOMAIN}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: nextcloud.${BASE_DOMAIN}
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: nextcloud-pvc
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data-pvc
