# Daily logical backup of the nextcloud postgres database to NFS.
# Local-path data is fast but node-pinned; this CronJob is the safety net
# (covered by Velero, which sweeps the NFS share into Wasabi).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-postgres-backup
  namespace: nextcloud
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          annotations:
            velero.io/exclude-from-backup: "true"
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: nextcloud-postgres
                - name: PGUSER
                  value: nextcloud
                - name: PGDATABASE
                  value: nextcloud
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-secrets
                      key: POSTGRES_PASSWORD
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backup/nextcloud-$${ts}.sql.gz"
                  echo "[backup] dumping to $${out}"
                  pg_dump --format=plain --no-owner --no-privileges \
                    | gzip -9 > "$${out}"
                  echo "[backup] pruning dumps older than 7 days"
                  find /backup -name 'nextcloud-*.sql.gz' -type f -mtime +7 -delete
                  echo "[backup] done; current dumps:"
                  ls -lh /backup/nextcloud-*.sql.gz | tail -10
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: nextcloud-postgres-backup-pvc
