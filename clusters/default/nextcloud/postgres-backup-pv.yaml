# Static NFS PV for postgres logical backups (pg_dump output).
# Mirrors the n8n PV pattern: server hostname is /etc/hosts-overridden on
# every cluster node, so the immutable pv.spec.nfs.server can stay as the
# hostname without breaking on DNS. Velero will sweep the contents of this
# share into Wasabi as part of its scheduled snapshots.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-postgres-backup-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  mountOptions:
    - hard
    - nfsvers=4.1
  claimRef:
    namespace: nextcloud
    name: nextcloud-postgres-backup
  nfs:
    server: ${NAS_HOST}
    path: /volume1/kub/homelab/nextcloud/postgres-backup
    readOnly: false
