# Dynamic PVC against storage-apps SC (Wave 1, 260511-utf).
# Path: __NAS-IP__:/volume1/kub/homelab/nextcloud/nextcloud-postgres-backup/
# Used by the nextcloud-postgres-backup CronJob.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-postgres-backup-pvc
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: storage-apps
