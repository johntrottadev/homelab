# Postgres data on longhorn-ssd (replica-3, resilient) — moved off node-local
# local-path 2026-07-03 (blue/green migration): Longhorn handles node-death
# recovery natively via replicas, so no single-node pinning. The pg_dump CronJob
# (postgres-backup-cronjob.yaml) still writes daily dumps to NFS for Velero.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-postgres
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd
  resources:
    requests:
      storage: 20Gi
