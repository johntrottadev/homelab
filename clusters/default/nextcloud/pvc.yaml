# Dynamic PVC against storage-apps SC (Wave 1, 260511-utf).
# Path: __NAS-IP__:/volume1/kub/homelab/nextcloud/nextcloud-pvc/
# (config volume — the 500Gi data volume nextcloud-data-pvc stays static for Wave 4)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-pvc
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: storage-apps
