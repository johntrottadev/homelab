# OpenDBL -> Palo Alto User-ID DAG sync (license-free EDL alternative).
# The PA-820 has no Threat Prevention license, so EDLs can't be used. Instead this
# script fetches the OpenDBL IP lists and registers them as tagged registered-IPs via
# the PAN-OS User-ID API (a base feature, no license). Dynamic Address Groups filtered
# on the tag then enforce them in policy. Entries carry a TTL; the hourly CronJob
# refreshes current IPs and lets removed ones age out. Stdlib-only (no pip).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opendbl-sync-script
  namespace: netalert
data:
  sync.py: |
    #!/usr/bin/env python3
    """OpenDBL -> Palo Alto User-ID DAG sync. Reads PALO_HOST / PALO_API_KEY /
    PALO_VERIFY_TLS from env (netalert paloarp-credentials secret)."""
    import os, sys, ssl, ipaddress, urllib.request, urllib.parse
    import xml.etree.ElementTree as ET

    PALO_HOST = os.environ["PALO_HOST"]
    PALO_API_KEY = os.environ["PALO_API_KEY"]
    VERIFY_TLS = os.environ.get("PALO_VERIFY_TLS", "false").lower() in ("1", "true", "yes")
    VSYS = os.environ.get("VSYS", "vsys1")
    TTL = int(os.environ.get("OPENDBL_TTL", "7200"))
    DRY_RUN = os.environ.get("OPENDBL_DRY_RUN", "false").lower() in ("1", "true", "yes")
    CHUNK = int(os.environ.get("OPENDBL_CHUNK", "500"))
    BASE = "https://opendbl.net/lists/"

    CAP = int(os.environ.get("OPENDBL_MAX", "700"))  # registered-IP budget; reserve ~300 for wazuh

    # (file, tag) in DESCENDING signal priority. CONFIRMED 2026-06-30: this PA-820's
    # registered-IP table hard-caps at 1,000 total (empty-table probe registered exactly
    # 1,000 then rejected), and that budget is SHARED with wazuh-auto-block. So we keep
    # only the high-signal small feeds (~660 unique IPs) and drop the volume feeds
    # (blocklistde ~36k, ipsum ~16k) plus tor-exit (~1.2k — too big to fit) entirely.
    # All map to the 'opendbl-block' bidirectional DAG.
    LISTS = [
        ("sslblock.list",   "opendbl-block"),  # abuse.ch SSL/C2 — highest signal
        ("dshield.list",    "opendbl-block"),  # DShield top attackers
        ("etknown.list",    "opendbl-block"),  # ET known compromised hosts
        ("bruteforce.list", "opendbl-block"),  # BruteforceBlocker
    ]

    def log(*a): print(*a, file=sys.stderr, flush=True)

    def fetch(name):
        req = urllib.request.Request(BASE + name, headers={"User-Agent": "opendbl-sync/1.0"})
        with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as r:
            return r.read().decode("utf-8", "replace").splitlines()

    def parse(lines):
        out = []
        for ln in lines:
            ln = ln.strip()
            if not ln or ln[0] in "#;/":
                continue
            tok = ln.split()[0]
            try:
                if "-" in tok:            # range a.b.c.d-e.f.g.h -> CIDRs
                    lo, hi = tok.split("-", 1)
                    for net in ipaddress.summarize_address_range(
                            ipaddress.IPv4Address(lo.strip()), ipaddress.IPv4Address(hi.strip())):
                        out.append(str(net))
                elif "/" in tok:          # CIDR
                    out.append(str(ipaddress.ip_network(tok, strict=False)))
                else:                     # single IP
                    out.append(str(ipaddress.ip_address(tok)))
            except ValueError:
                continue
        return out

    def build_msg(entries, tag):
        reg = "".join(
            '<entry ip="%s"><tag><member timeout="%d">%s</member></tag></entry>' % (ip, TTL, tag)
            for ip in entries)
        return ("<uid-message><version>1.0</version><type>update</type>"
                "<payload><register>%s</register></payload></uid-message>" % reg)

    def api_userid(cmd):
        data = urllib.parse.urlencode({"type": "user-id", "action": "set",
                                       "vsys": VSYS, "key": PALO_API_KEY, "cmd": cmd}).encode()
        ctx = ssl.create_default_context()
        if not VERIFY_TLS:
            ctx.check_hostname = False
            ctx.verify_mode = ssl.CERT_NONE
        req = urllib.request.Request("https://%s/api/" % PALO_HOST, data=data)
        with urllib.request.urlopen(req, timeout=45, context=ctx) as r:
            body = r.read().decode("utf-8", "replace")
        if ET.fromstring(body).get("status") != "success":
            raise RuntimeError("User-ID API error: %s" % body[:300])

    def main():
        # Fill the budget in priority order; dedup globally (first list wins the tag).
        seen, by_tag, budget = set(), {}, CAP
        for f, tag in LISTS:
            if budget <= 0:
                log("  %-20s SKIPPED (budget exhausted)" % f)
                continue
            try:
                got = parse(fetch(f))
            except Exception as e:
                log("  %-20s FETCH FAILED: %s" % (f, e))
                continue
            added = 0
            for ip in got:
                if budget <= 0:
                    break
                if ip in seen:
                    continue
                seen.add(ip)
                by_tag.setdefault(tag, []).append(ip)
                budget -= 1
                added += 1
            log("  %-20s %d fetched -> %d new (budget left %d)" % (f, len(got), added, budget))
        planned = sum(len(v) for v in by_tag.values())
        log("[plan] %d IPs across %d tags (cap=%d)" % (planned, len(by_tag), CAP))
        if DRY_RUN:
            log("DONE dry_run planned=%d" % planned)
            return
        # Register; stop cleanly at the PA registered-IP ceiling instead of spamming.
        registered, capped = 0, False
        for tag, ips in by_tag.items():
            if capped:
                break
            done = 0
            for i in range(0, len(ips), CHUNK):
                batch = ips[i:i + CHUNK]
                try:
                    api_userid(build_msg(batch, tag))
                    registered += len(batch)
                    done += len(batch)
                except Exception as e:      # first rejection = registered-IP ceiling; stop
                    log("  [%s] chunk %d rejected (registered-IP ceiling?): %s"
                        % (tag, i // CHUNK, str(e)[:120]))
                    capped = True
                    break
            log("  [%s] registered %d/%d (ttl=%ds)" % (tag, done, len(ips), TTL))
        log("DONE registered=%d planned=%d capped=%s" % (registered, planned, capped))
        # registered==0 => systemic failure (auth/network) => alert; capacity boundary => ok.
        sys.exit(0 if registered > 0 else 1)

    if __name__ == "__main__":
        main()
