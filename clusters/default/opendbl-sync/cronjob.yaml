# Hourly OpenDBL -> Palo Alto User-ID sync. Reuses the netalert paloarp-credentials
# secret (PALO_HOST / PALO_API_KEY) via envFrom — no key handling here.
# PA mgmt TLS is pinned to the public cert in the `pa-mgmt-cert` ConfigMap
# (configMapGenerator in clusters/default/kustomization.yaml); the script refuses
# to send the key if the presented cert does not match. PALO_VERIFY_TLS is ignored.
# Needs egress to opendbl.net:443 and the PA mgmt __LAN-IP__:443.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opendbl-userid-sync
  namespace: netalert
spec:
  suspend: false                  # right-sized to registered-IP capacity; re-enabled
  schedule: "17 * * * *"          # hourly at :17 (OpenDBL min poll = 15m; TTL 2h covers gaps)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: opendbl-userid-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: python:3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6
              imagePullPolicy: IfNotPresent
              command: ["python3", "/scripts/sync.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: OPENDBL_TTL
                  value: "7200"
                - name: OPENDBL_MAX
                  value: "700"       # registered-IP budget (PA-820 ceiling=1000 confirmed; reserve ~300 for wazuh)
                - name: OPENDBL_DRY_RUN
                  value: "false"     # set "true" for a fetch-only capacity check
                - name: PA_CA_FILE
                  value: /etc/pa-tls/pa-mgmt.pem   # pinned PA mgmt cert (public)
              envFrom:
                - secretRef:
                    name: paloarp-credentials   # PALO_HOST / PALO_API_KEY
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: pa-mgmt-cert
                  mountPath: /etc/pa-tls
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 192Mi
          volumes:
            - name: script
              configMap:
                name: opendbl-sync-script
                defaultMode: 0555
            - name: pa-mgmt-cert
              configMap:
                name: pa-mgmt-cert
                defaultMode: 0444
