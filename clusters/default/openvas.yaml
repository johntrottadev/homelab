# IngressRoute bundle for OpenVAS / Greenbone CE on docker-1:9443.
# Greenbone's nginx in the upstream compose serves the actual GSA app on
# its internal :443 (TLS, self-signed). Its :9392 is just a redirector to
# https://$host:443 — proxying through it creates an infinite redirect
# loop. docker-1/openvas/compose.yaml maps the internal 443 to docker-1:9443
# externally so this bundle can hit the real app directly.
apiVersion: v1
kind: Service
metadata:
  name: ext-openvas
  namespace: kube-system
spec:
  ports:
    - name: https
      protocol: TCP
      port: 9443
      targetPort: 9443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-openvas-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-openvas
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 9443
endpoints:
  - addresses:
      - __LAN-IP__
    conditions:
      ready: true
      serving: true
      terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openvas-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openvas.__BASE-DOMAIN__`)
      kind: Rule
      services:
        - name: ext-openvas
          port: 9443
          scheme: https
          serversTransport: lan-self-signed
