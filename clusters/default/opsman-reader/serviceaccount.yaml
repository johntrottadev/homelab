# bastion-reader ServiceAccount -- read-only K8s identity for the bastion LXC.
# Created as part of quick task 260501-ln4 (first deployment to dedicated LXC on __PVE-NODE-3__).
# Token is minted out-of-band via `kubectl -n kube-system create token bastion-reader --duration=8760h`
# and written to /etc/bastion/kube/bastion-reader.yaml on the LXC; renewed annually.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bastion-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: bastion-reader
    app.kubernetes.io/managed-by: flux
