# IngressRoute bundle for OSTE-Meta-Scan webtop on docker-1:3000.
# Browser → https://legacy-vm.__BASE-DOMAIN__ → Traefik → http://__LAN-IP__:3000
# → noVNC desktop → Application Menu → OSTE Meta Scan.
apiVersion: v1
kind: Service
metadata:
  name: ext-legacy-vm
  namespace: kube-system
spec:
  ports:
    - name: https
      protocol: TCP
      port: 6901
      targetPort: 6901
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-legacy-vm-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-legacy-vm
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 6901
endpoints:
  # docker-1 — original singleton (still primary)
  - addresses:
      - __LAN-IP__
    conditions:
      ready: true
      serving: true
      terminating: false
  # docker-2 — active/active mirror (added 2026-05-02). Traefik round-robins.
  # OSTE Stack must be deployed on BOTH hosts via Komodo "server list" — if
  # the docker-2 container isn't actually serving, traffic still hits its IP and
  # gets ECONNREFUSED. Validate with `for i in {1..10}; do curl -ksSL ... ; done`.
  - addresses:
      - __LAN-IP__
    conditions:
      ready: true
      serving: true
      terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: legacy-vm-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`legacy-vm.__BASE-DOMAIN__`)
      kind: Rule
      services:
        - name: ext-legacy-vm
          port: 6901
          # KasmVNC self-signed HTTPS upstream; reuse the cluster-wide
          # ServersTransport that already skips verify for LAN endpoints.
          scheme: https
          serversTransport: lan-self-signed
