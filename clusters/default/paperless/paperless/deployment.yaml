apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless
  labels:
    app: paperless-ngx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx
  # Recreate: single RWO longhorn-ssd data PVC — a rolling update would Multi-Attach
  # deadlock (2nd pod can't attach the volume while the old one holds it). (2026-07-03)
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: data-volume,media-volume
      labels:
        app: paperless-ngx
    spec:
      containers:
      - env:
        - name: PAPERLESS_URL
          value: https://paperless.${BASE_DOMAIN}
        - name: PAPERLESS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: admin-user
              name: paperless-secret
        - name: PAPERLESS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: paperless-secret
        - name: PAPERLESS_REDIS
          value: redis://redis:6379
        - name: PAPERLESS_DBHOST
          value: postgres
        - name: PAPERLESS_DBNAME
          value: paperless
        - name: PAPERLESS_DBUSER
          value: paperless
        - name: PAPERLESS_DBPASS
          valueFrom:
            secretKeyRef:
              key: db-password
              name: paperless-secret
        # OCR tuning (2026-07-19): imports are digital PDFs that already carry a
        # text layer. Rotation/deskew detection forces per-page rasterization +
        # re-OCR (~20min/book) even on text pages, so disable both. Parallelize
        # to 2 workers x 2 threads to use the 4-core box (was serial, ~0.5 core).
        # Re-enable ROTATE/DESKEW if importing crooked phone-photo scans.
        - name: PAPERLESS_OCR_ROTATE_PAGES
          value: "false"
        - name: PAPERLESS_OCR_DESKEW
          value: "false"
        - name: PAPERLESS_TASK_WORKERS
          value: "2"
        - name: PAPERLESS_THREADS_PER_WORKER
          value: "2"
        # Persistent consume folder (storage-apps NFS) — poll every 30s since
        # inotify is unreliable over NFS. RETRY_COUNT waits for slow/large
        # files to finish copying before consuming. Files here survive pod
        # restarts, unlike the ephemeral /tmp web-upload staging path.
        - name: PAPERLESS_CONSUMER_POLLING
          value: "30"
        - name: PAPERLESS_CONSUMER_POLLING_RETRY_COUNT
          value: "5"
        - name: PAPERLESS_CONSUMER_RECURSIVE
          value: "true"
        image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
        imagePullPolicy: Always
        name: paperless-ngx
        ports:
        - containerPort: 8000
          protocol: TCP
        volumeMounts:
        - mountPath: /usr/src/paperless/media
          name: media-volume
        - mountPath: /usr/src/paperless/data
          name: data-volume
        - mountPath: /usr/src/paperless/consume
          name: consume-volume
      securityContext: {}
      volumes:
      - name: media-volume
        persistentVolumeClaim:
          claimName: paperless-media-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: paperless-data-pvc
      - name: consume-volume
        persistentVolumeClaim:
          claimName: paperless-consume-pvc

