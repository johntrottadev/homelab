apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless
  labels:
    app: paperless-ngx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx
  # Recreate: single RWO longhorn-ssd data PVC — a rolling update would Multi-Attach
  # deadlock (2nd pod can't attach the volume while the old one holds it). (2026-07-03)
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # consume-volume added 2026-09-05: it is on storage-apps, and the NAS
        # backs itself up to Wasabi directly, so Velero was paying twice
        # for the same bytes.
        backup.velero.io/backup-volumes-excludes: data-volume,media-volume,consume-volume
      labels:
        app: paperless-ngx
    spec:
      containers:
      - env:
        - name: PAPERLESS_URL
          value: https://paperless.${BASE_DOMAIN}
        - name: PAPERLESS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: admin-user
              name: paperless-secret
        - name: PAPERLESS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: paperless-secret
        - name: PAPERLESS_REDIS
          value: redis://redis:6379
        - name: PAPERLESS_DBHOST
          value: postgres
        - name: PAPERLESS_DBNAME
          value: paperless
        - name: PAPERLESS_DBUSER
          value: paperless
        - name: PAPERLESS_DBPASS
          valueFrom:
            secretKeyRef:
              key: db-password
              name: paperless-secret
        # REQUIRED from 3.x onward: paperless refuses to start if this is unset
        # or left at the default "change-me". 2.x tolerated the default, so the
        # 2.20.15 -> 3.1.2 upgrade hard-failed on it (ImproperlyConfigured).
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: secret-key
              name: paperless-secret
        # OCR tuning (2026-07-19/20): imports are digital PDFs that already carry
        # a text layer. Biggest cost was SKIP_ARCHIVE_FILE=never forcing a full
        # ocrmypdf PDF/A-archive pass (rasterize + re-OCR + unpaper) on every doc
        # even when it already has text. SKIP_ARCHIVE=with_text skips that pass
        # for text docs -> seconds/book instead of minutes. CLEAN=none drops the
        # unpaper rasterization; ROTATE/DESKEW off drops rotation detection.
        # Scanned image-only pages still OCR normally (MODE=skip only skips text
        # pages). Re-enable CLEAN/ROTATE/DESKEW if importing crooked photo scans.
        # Parallelize to 2 workers x 2 threads across the 4-core box.
        # 3.x REMOVED the "skip" value (valid now: auto|redo|force|off).
        # "auto" is the direct replacement: detect embedded text via pdftotext
        # and skip OCR when sufficient text is present -- what "skip" did.
        - name: PAPERLESS_OCR_MODE
          value: "auto"
        # 3.x decoupled archive control from OCR control (upstream PR #12448).
        # PAPERLESS_OCR_SKIP_ARCHIVE_FILE=with_text -> ARCHIVE_FILE_GENERATION=auto:
        # produce archives for scanned/image-based docs, skip born-digital PDFs
        # that already carry embedded text. Same behaviour, renamed variable.
        - name: PAPERLESS_ARCHIVE_FILE_GENERATION
          value: "auto"
        - name: PAPERLESS_OCR_CLEAN
          value: "none"
        - name: PAPERLESS_OCR_ROTATE_PAGES
          value: "false"
        - name: PAPERLESS_OCR_DESKEW
          value: "false"
        - name: PAPERLESS_TASK_WORKERS
          value: "2"
        - name: PAPERLESS_THREADS_PER_WORKER
          value: "2"
        # Persistent consume folder (storage-apps NFS) — poll every 30s since
        # inotify is unreliable over NFS. RETRY_COUNT waits for slow/large
        # files to finish copying before consuming. Files here survive pod
        # restarts, unlike the ephemeral /tmp web-upload staging path.
        - name: PAPERLESS_CONSUMER_POLLING
          value: "30"
        - name: PAPERLESS_CONSUMER_POLLING_RETRY_COUNT
          value: "5"
        - name: PAPERLESS_CONSUMER_RECURSIVE
          value: "true"
        image: ghcr.io/paperless-ngx/paperless-ngx:3.1.2@sha256:5ab4f4f9bb099a36bec3e092906ea3e611323c5f18dc5cc38c76a1d540bdca9c
        imagePullPolicy: Always
        name: paperless-ngx
        ports:
        - containerPort: 8000
          protocol: TCP
        # Bounded 2026-08-18. Ran 47 days unrestarted with resources:{} and reached
        # 10805Mi at 8m CPU — retained working set, not demonstrated need — which held
        # k3s-wkr-2 at 90% memory alongside Prometheus and the Longhorn instance-managers.
        # The 2Gi request is what actually rebalances this: it lets the scheduler place
        # the pod honestly instead of treating it as free. The 6Gi limit is ~3x a healthy
        # paperless and bounds the blast radius; if it proves tight the CrashLoop is loud
        # and reversible, unlike the silent node pressure it replaces.
        # CPU limit is generous because OCR is bursty (2 workers x 2 threads).
        resources:
          requests:
            memory: 2Gi
            cpu: 250m
          limits:
            memory: 6Gi
            cpu: 2000m
        volumeMounts:
        - mountPath: /usr/src/paperless/media
          name: media-volume
        - mountPath: /usr/src/paperless/data
          name: data-volume
        - mountPath: /usr/src/paperless/consume
          name: consume-volume
      securityContext: {}
      volumes:
      - name: media-volume
        persistentVolumeClaim:
          claimName: paperless-media-pvc
      - name: data-volume
        persistentVolumeClaim:
          claimName: paperless-data-pvc
      - name: consume-volume
        persistentVolumeClaim:
          claimName: paperless-consume-pvc

