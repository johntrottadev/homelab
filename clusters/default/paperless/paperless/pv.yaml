apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  claimRef:
    namespace: paperless
    name: paperless-data-pvc
  nfs:
    server: ${NAS_HOST}
    path: /volume1/kub/homelab/paperless/data
    readOnly: false
