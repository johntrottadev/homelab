# Repointed 2026-07-01 (Longhorn migration):
#   data → longhorn-ssd (app/index state, RWO single-replica)
#   media (documents) → STATIC NFS PV, untouched on Synology at
#     __NAS-IP__:/volume1/kub/homelab/paperless/paperless-media-pvc
#   (documents deliberately not migrated — same pattern as jellyfin movies)
# Grown 10Gi -> 30Gi (2026-07-20): the auto-classification model balloons on
# book-length docs (5.4GB), and a retrain transiently needs old+new (~2x) which
# overran the 10Gi volume -> [Errno 28], wedging imports + logging. 30Gi gives
# room for the model swap + index growth. longhorn-ssd allowVolumeExpansion=true.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-pvc
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: longhorn-ssd
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-media-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  # Pre-bind to defeat the wrong-PVC-capture pitfall (same as jellyfin-movies-pv).
  claimRef:
    namespace: paperless
    name: paperless-media-pvc
  nfs:
    server: __NAS-IP__
    path: /volume1/kub/homelab/paperless/paperless-media-pvc
    readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media-pvc
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: paperless-media-pv
  resources:
    requests:
      storage: 100Gi
---
# Consume/watch folder — dynamic storage-apps (NFS) so it SURVIVES pod restarts
# (unlike the ephemeral /tmp web-upload path that ate the 2026-07-19 queue).
# Provisions to __NAS-IP__:/volume1/kub/homelab/paperless/paperless-consume-pvc
# — reachable over the NAS share to drop/rsync PDFs; paperless polls + imports.
# RWX + polling because inotify is unreliable over NFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume-pvc
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: storage-apps
  resources:
    requests:
      storage: 20Gi
