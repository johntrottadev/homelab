# Dynamic PVCs against storage-apps SC (Wave 1, 260511-utf).
# Paths:
#   __NAS-IP__:/volume1/kub/homelab/paperless/paperless-data-pvc/  (config/db state)
#   __NAS-IP__:/volume1/kub/homelab/paperless/paperless-media-pvc/ (document store)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-pvc
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: storage-apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media-pvc
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: storage-apps
