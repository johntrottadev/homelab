apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    # RWO PVC + single replica: Recreate avoids the Multi-Attach deadlock.
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: paperless
        - name: POSTGRES_USER
          value: paperless
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: db-password
              name: paperless-secret
        # Subdir PGDATA: pg15->18 logical migration 2026-07-03 inits pg18 in a
        # fresh subdir; old pg15 cluster stays at the volume root for rollback.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        imagePullPolicy: IfNotPresent
        name: postgres
        ports:
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage
      securityContext:
        fsGroup: 999
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: pgsql-pvc

