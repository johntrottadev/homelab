# Dynamic PVC against storage-dbs SC (Wave 1, 260511-utf — DB tier).
# Path: __NAS-IP__:/volume1/kubdbs/paperless/pgsql-pvc/
# Was previously at /kubdbs/homelab/paperless/. AccessMode fixed RWX -> RWO
# (postgres is single-writer; legacy static PV had wrong mode).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgsql-pvc
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: storage-dbs
