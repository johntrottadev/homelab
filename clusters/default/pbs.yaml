apiVersion: v1
kind: Service
metadata:
  name: ext-backup-host
  namespace: kube-system
spec:
  ports:
  - name: https
    protocol: TCP
    port: 8007
    targetPort: 8007
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-backup-host-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-backup-host
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
- name: https
  protocol: TCP
  port: 8007
endpoints:
- addresses:
  - __LAN-IP__
  conditions:
    ready: true
    serving: true
    terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backup-host-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`backup-host.${BASE_DOMAIN}`)
    kind: Rule
    middlewares:
      - name: crowdsec-bouncer
        namespace: kube-system
    services:
    - name: ext-backup-host
      port: 8007
      scheme: https
      serversTransport: lan-self-signed
