# Pod Security Admission labels for the namespaces NOT otherwise defined in git
# (2026-09-25). Completes b7b7849, which labelled the 21 namespaces that have a
# namespace.yaml. These 9 are created by k3s, Flux bootstrap, or HelmRelease
# createNamespace, so until now they had no PSA floor at all.
#
# Flux applies these with server-side apply, so only the labels below are
# owned; everything else on the namespace is untouched. prune: disabled is
# load-bearing: without it, removing an entry here would make Flux DELETE the
# namespace (kube-system included) instead of just dropping the labels.
#
# Verified before commit with `kubectl label --dry-run=server`:
#   baseline -> zero violations in the 5 namespaces marked baseline below.
#   the 4 privileged namespaces each fail baseline for the reason stated inline.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Exempt WITH A REASON: csi-nfs node/controller are privileged with
    # hostPath + host namespaces; kube-vip needs NET_ADMIN + hostNetwork.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Exempt WITH A REASON: the storage engine, CSI plugin and instance
    # managers are privileged and hostPath-mounted by design.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Exempt WITH A REASON: node-exporter needs hostNetwork, hostPID,
    # hostPath and hostPort to read node metrics.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Exempt WITH A REASON: node-agent mounts the kubelet pod directory via
    # hostPath to back up volume contents with kopia.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
