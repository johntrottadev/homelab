apiVersion: v1
kind: Service
metadata:
  name: ext-__PVE-MGMT-1__
  namespace: kube-system
spec:
  ports:
  - name: https
    protocol: TCP
    port: 443
    targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-__PVE-MGMT-1__-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-__PVE-MGMT-1__
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
- name: https
  protocol: TCP
  port: 443
endpoints:
- addresses:
  - __LAN-IP__
  conditions:
    ready: true
    serving: true
    terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: __PVE-MGMT-1__-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`__PVE-MGMT-1__.${BASE_DOMAIN}`)
    kind: Rule
    middlewares:
      - name: crowdsec-bouncer
        namespace: kube-system
      - name: authentik-forwardauth
        namespace: kube-system
    services:
    - name: ext-__PVE-MGMT-1__
      port: 443
      scheme: https
      serversTransport: lan-self-signed
