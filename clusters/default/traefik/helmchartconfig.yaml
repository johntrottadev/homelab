# Traefik k3s HelmChartConfig — patches the built-in `kube-system/traefik` HelmChart.
#
# Single canonical resource (k3s helm-controller looks up HelmChartConfig by name+namespace
# matching the HelmChart, so one HelmChartConfig per chart — must not split into multiple files).
#
# History of valuesContent fields:
#   - service.annotations.kube-vip.io/loadbalancerIPs (Phase 13 — kube-vip LB VIP)
#   - deployment.replicas: 3 (Phase 13)
#   - topologySpreadConstraints (Phase 13 — replica spread across nodes)
#   - ports.web.redirectTo (Phase 14 Wave 4 D-04 — global HTTP→HTTPS 301 redirect)
#
# Brought under Flux GitOps management as part of Phase 14 Plan 07 Task 1
# (was previously `kubectl apply`-managed by Phase 13).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |-
    service:
      annotations:
        kube-vip.io/loadbalancerIPs: "${K3S_VIP}"
    deployment:
      replicas: 3
      additionalVolumes:
        - name: crowdsec-bouncer-key
          secret:
            secretName: crowdsec-bouncer-key
    # Spread replicas across nodes — single-node loss takes at most 1 replica.
    # ScheduleAnyway (vs DoNotSchedule) keeps things scheduling on a 4-node
    # post-failure cluster instead of going Pending.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-kube-system
    # Phase 14 D-04 — global HTTP→HTTPS 301 redirect on web entrypoint.
    # Chart 34+ deprecated `ports.web.redirectTo` in favor of
    # `ports.web.http.redirections.entryPoint` (per upstream Traefik syntax).
    # Current chart is 39.x — only the `http.redirections.entryPoint` form is
    # honored by the chart's _podtemplate.tpl. The chart resolves `to: websecure`
    # to `:443` (exposedPort of the websecure entrypoint).
    # Replaces per-route redirect Middlewares — every HTTP request on `web`
    # entrypoint now redirects to `websecure` regardless of IngressRoute matches.
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
              # priority OMITTED — Traefik defaults to MaxInt-1 so redirect
              # always wins over IngressRoute routes (npm-fallback-http has
              # priority: 1; explicit values like 10 would unintentionally
              # demote the redirect below normal route priorities).

    # Access logging in JSON — REQUIRED for CrowdSec to see HTTP traffic.
    # Without this Traefik emits only startup/error output, so the
    # crowdsecurity/traefik-logs parser matched 0 of 7.79k lines (100%
    # unparsed) and no HTTP scenario could ever fire. The collections were
    # installed and correct the whole time; there was nothing to parse.
    #
    # headers.defaultmode: drop is deliberate — access logs ship to Loki, and
    # keeping headers by default would write Cookie and Authorization values
    # into the log store. User-Agent is kept because CrowdSec scenarios use it.
    logs:
      general:
        format: json
        level: INFO
      access:
        enabled: true
        format: json
        fields:
          general:
            defaultmode: keep
          headers:
            defaultmode: drop
            names:
              User-Agent: keep

    # CrowdSec bouncer plugin — the ENFORCEMENT half of CrowdSec.
    # Before this, CrowdSec held ~3,900 ban decisions and had zero registered
    # bouncers, so every decision was written to a database and read by nobody.
    # The engine decides; the bouncer blocks. One without the other does nothing.
    experimental:
      plugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.7.1

    # LAPI key is mounted from a Secret rather than inlined in the Middleware.
    # Secret kube-system/crowdsec-bouncer-key is created out-of-band (it holds a
    # generated credential and is deliberately NOT in Git); it carries no Flux
    # labels, so prune leaves it alone. Regenerate with:
    #   cscli bouncers delete traefik-bouncer && cscli bouncers add traefik-bouncer
    additionalVolumeMounts:
      - name: crowdsec-bouncer-key
        mountPath: /etc/crowdsec-bouncer
        readOnly: true

    # Cross-namespace middleware references. Required so a single
    # kube-system/crowdsec-bouncer Middleware can be attached from IngressRoutes
    # in any namespace. Without it Traefik refuses the reference with
    #   "middleware kube-system/crowdsec-bouncer is not in the IngressRoute
    #    namespace <ns>"
    # and — importantly — DROPS THE WHOLE ROUTE, returning 404 rather than
    # proxying without the middleware. A broken middleware ref takes the service
    # down; it does not fail open.
    #
    # The alternative is duplicating the Middleware into all ~20 app namespaces.
    # Acceptable here because this is a single-tenant cluster; in a multi-tenant
    # one this flag lets any namespace reference any other namespace's middleware.
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
