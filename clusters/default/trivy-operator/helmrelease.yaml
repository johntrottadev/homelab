# trivy-operator — continuous in-cluster image/CVE, config-audit, and exposed-secret
# scanning. Complements OpenVAS (host/network) by covering CONTAINER IMAGES, which
# nothing else in the lab scans. Findings surface as VulnerabilityReport CRDs and are
# exported to Prometheus via the built-in metrics endpoint (ServiceMonitor below picks
# them up — release: prometheus). No ingress: this is a controller, viewed via Grafana
# or `kubectl get vulnerabilityreports -A`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 1h
  chart:
    spec:
      chart: trivy-operator
      version: "0.34.0"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # NOTE: targetWorkloads is a TOP-LEVEL chart value, NOT under operator:.
    # Nesting it under operator: is silently accepted by Helm (unknown keys are
    # not rejected) and does nothing — the release reports "upgrade succeeded"
    # while OPERATOR_TARGET_WORKLOADS keeps its default. Verify by reading the
    # env var off the live deployment, never by trusting Ready=True.
    #
    # Excludes bare Jobs: velero creates one backup Job per run and each got its
    # own VulnerabilityReport for the SAME velero/velero image — 63 duplicates,
    # ~19% of the estate's reported CRITICAL+HIGH. CronJob stays in the list, so
    # scheduled workloads keep coverage. Default list minus "job".
    targetWorkloads: "pod,replicaset,replicationcontroller,statefulset,daemonset,cronjob"
    trivy:
      # Pull the DB once and cache it in-cluster; avoids per-scan rate-limit pain.
      ignoreUnfixed: true
      # Everything except UNKNOWN. Measured 2026-08-30 on a fresh full rescan:
      #   CRITICAL 106 | HIGH 1667 | MEDIUM 2636 | LOW 603 | UNKNOWN 10679
      # UNKNOWN is 68% of the payload and carries no CVSS score, and it was the
      # bulk that pushed reports past etcd's ~1.5MB object cap — writes failed
      # with "etcdserver: request is too large", the stale report survived, and
      # scan data silently aged 3-7 days while looking healthy.
      #
      # Dropping it removes no actionable finding; it makes the scanner able to
      # write at all, which is the precondition for trusting any of these counts.
      severity: "CRITICAL,HIGH,MEDIUM,LOW"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    operator:
      # 24h, not 168h. A retired ReplicaSet keeps its VulnerabilityReport for the
      # full TTL, so for a week after every upgrade the dashboard shows the OLD
      # image's counts stacked on top of the new one's. stirling-pdf scanned 0
      # CRITICAL at 2.14.3 while its dead 1.6.0 revision still reported 32.
      # Shorter TTL means the number tracks what is actually running.
      scannerReportTTL: "24h"
      # Scan on a cadence rather than on every change — kinder to the single worker fleet.
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        # 512Mi OOMKilled the operator 63 times in ~41d (ContainerOOMKilled fired
        # 2026-08-24). Doubled 2026-08-24; watch container_memory_working_set_bytes
        # for trivy-operator before trimming this back.
        memory: 1Gi
