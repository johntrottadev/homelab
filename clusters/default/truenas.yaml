# Route for nas2.__BASE-DOMAIN__ → TrueNAS SCALE UI at ${TRUENAS_IP}:443 (see README host table).
apiVersion: v1
kind: Service
metadata:
  name: ext-truenas
  namespace: kube-system
spec:
  ports:
  - name: https
    protocol: TCP
    port: 443
    targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-truenas-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-truenas
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
- name: https
  protocol: TCP
  port: 443
endpoints:
- addresses:
  - ${TRUENAS_IP}
  conditions:
    ready: true
    serving: true
    terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`nas2.${BASE_DOMAIN}`)
    kind: Rule
    services:
    - name: ext-truenas
      port: 443
      scheme: https
      serversTransport: lan-self-signed
