apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    app: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # Note: louislam/uptime-kuma:1 runs as root by design — its entrypoint
      # does its own chown on /app/data, then drops privileges internally.
      # Setting pod-level runAsUser/runAsGroup breaks the container's startup
      # ("chown: changing ownership of '/app/data': Operation not permitted").
      # Keep fsGroup for the NFS mount + rely on init-chmod for one-time NAS prep.
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-chmod
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 1000:1000 /app/data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
