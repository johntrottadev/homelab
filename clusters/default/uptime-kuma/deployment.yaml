apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    app: uptime-kuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # Note: louislam/uptime-kuma:1.23.17 runs as root by design — its entrypoint
      # does its own chown on /app/data, then drops privileges internally.
      # Setting pod-level runAsUser/runAsGroup breaks the container's startup
      # ("chown: changing ownership of '/app/data': Operation not permitted").
      # Keep fsGroup for the NFS mount + rely on init-chmod for one-time NAS prep.
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-chmod
          image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -c
            - chown -R 1000:1000 /app/data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.5.3@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # startupProbe MUST exist here. Uptime-Kuma 2.x runs a one-time aggregate
          # migration over the full heartbeat history on first boot — 5.9M rows / 71
          # monitors / ~910MB SQLite here. With no startupProbe, livenessProbe governs
          # from the start and kills the container at ~120s (initialDelay 30 + 3x30),
          # mid-migration. The interrupted run leaves setting
          # migrateAggregateTableState='migrating', and every later boot then refuses
          # with "Aggregate table migration is already in progress" — a crashloop that
          # does NOT self-heal and needs the key deleted by hand.
          # 180 x 10s = 30 minutes. liveness/readiness stay parked until this passes.
          startupProbe:
            httpGet:
              path: /
              port: 3001
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
