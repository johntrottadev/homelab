apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-pvc
  namespace: uptime-kuma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: storage
  # Static binding: guarantees this PVC binds to OUR PV, not some other
  # 2Gi storage-class PV that happens to be Available.
  volumeName: uptime-kuma-pv
