# Dynamic PVC against storage-apps SC (Wave 2, 260511-utf).
# Path: __NAS-IP__:/volume1/kub/homelab/uptime-kuma/uptime-kuma-pvc/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-pvc
  namespace: uptime-kuma
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: storage-apps
