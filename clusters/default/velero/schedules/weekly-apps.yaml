# Captured from live cluster 2026-05-13 (Phase 10 wave 10-04).
# Was kubectl-applied via `velero/schedules/weekly.yaml`.
#
# Two post-capture injections required:
#   1. `kustomize.toolkit.fluxcd.io/ssa: Merge` annotation — retained. Flux and the
#      velero controller both write this object; Merge keeps them from looping.
#
# REMOVED 2026-08-18: `spec.skipImmediately: true`.
# It was added as a one-shot mitigation for velero's startup spurious-trigger bug
# (issues #2433/#2612/#6517/#6685), but a one-shot mitigation cannot live in desired
# state. Velero consumes the flag, skips whichever backup is next, and resets it to
# false; Flux then re-applies `true` on its next 10m reconcile. That made every cron
# tick a race against a flag re-armed six times an hour. All three schedules were
# observed skipped at 2026-08-18T11:27:19Z — a Tuesday morning matching no cron — and
# the race ate the 2026-08-16 weekly outright (weekly-apps went 2026-08-09 -> 2026-08-18
# with nothing in between, confirmed against TTL: 3 weeklies retained where 4 were due).
# If the startup spurious-trigger ever recurs, set the field imperatively once on the
# live object; never commit it.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  labels:
    tier: weekly
  name: weekly-apps
  namespace: velero
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  paused: false
  schedule: 30 5 * * 0   # Sun 01:30 EDT — after daily; Kopia dedups so upload is near-free
  template:
    defaultVolumesToFsBackup: true
    excludedResources:
      - events.events.k8s.io
      - events
    includedNamespaces:
      - authentik
      - dashy
      - drawio
      - firefly
      - fitjat
      - hoarder
      - it-tools-namespace
      - jellyfin
      - loki
      - monitoring
      - n8n
      - netalert
      - nextcloud
      - paperless
      - stirling-pdf
      - uptime-kuma
      - vaultwarden
      - vscode
    snapshotVolumes: false
    storageLocation: wasabi
    ttl: 672h
