apiVersion: v1
kind: Service
metadata:
  name: ext-wazuh
  namespace: kube-system
spec:
  ports:
  - name: https
    protocol: TCP
    port: 5601
    targetPort: 5601
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ext-wazuh-1
  namespace: kube-system
  labels:
    kubernetes.io/service-name: ext-wazuh
    endpointslice.kubernetes.io/managed-by: bastion-static
addressType: IPv4
ports:
- name: https
  protocol: TCP
  port: 5601
endpoints:
- addresses:
  - __LAN-IP__
  conditions:
    ready: true
    serving: true
    terminating: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wazuh-jt-lab-net
  namespace: kube-system
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`wazuh.__BASE-DOMAIN__`)
    kind: Rule
    services:
    - name: ext-wazuh
      port: 5601
      scheme: https
      serversTransport: wazuh-trusted
