# CryptPad single-container stack on docker-1.
# Komodo polls this file (see /Volumes/code/homelab/docker-1/README.md);
# stack name in Komodo: `cryptpad` with project_name: `cryptpad`.
#
# Why docker-1 vs k3s: the entrypoint's auto-config check
# (`[ ! -e $CRYPTPAD_CONFIG/config.js ]`) failed on every k8s mount shape
# I tried — ConfigMap-subPath, ConfigMap-full-dir, init-container-to-PVC.
# Plain Docker bind-mounts the file straight from disk and the entrypoint
# is happy. Same reasoning as Wazuh and CheckMk.
#
# Two-origin model:
#   https://cryptpad.__BASE-DOMAIN__          — main / "unsafe" origin
#   https://cryptpad-sandbox.__BASE-DOMAIN__  — sandboxed iframe origin
# Both Host() matches in clusters/default/cryptpad.yaml route to the same
# backend Service which points at this docker-1:3000 endpoint.

services:
  cryptpad:
    image: cryptpad/cryptpad:version-2026.2.2@sha256:918b216f015f55ba758b1eb8dec81be5d6fa0e0501fa683e87e33e11754d8213
    container_name: cryptpad
    hostname: cryptpad
    restart: unless-stopped
    # CIFS mount on docker-1 forceuid/forcegid to 1000:1000 with mode 0755 —
    # the image's default user (uid 4001) can't write to the data tree.
    # Run as 1000:1000 to match the bind-mount's effective ownership.
    user: "1000:1000"
    ports:
      - "3000:3000"
    environment:
      # CPAD_CONF is REQUIRED — the docker-entrypoint.sh `[ ! -f "$CPAD_CONF" ]`
      # check uses this var, and an empty value makes the test always-true,
      # entering the broken `cp ... "$CPAD_CONF"` branch. Setting it to the
      # bind-mounted path makes the test fail-fast (file exists) and skip
      # the auto-generation entirely. CPAD_MAIN_DOMAIN/SANDBOX_DOMAIN are
      # only consulted in that disabled branch but kept for clarity.
      - CPAD_CONF=/cryptpad/config/config.js
      - CPAD_MAIN_DOMAIN=https://cryptpad.${BASE_DOMAIN}
      - CPAD_SANDBOX_DOMAIN=https://cryptpad-sandbox.${BASE_DOMAIN}
      - TZ=America/New_York
    volumes:
      # Hand-written config.js seeded by the operator (see
      # /mnt/kub/homelab/cryptpad/config/config.js on the NAS).
      - /mnt/kub/homelab/cryptpad/config/config.js:/cryptpad/config/config.js:ro
      # Persistent state on NAS (small writes, ok for NFS/CIFS).
      - /mnt/kub/homelab/cryptpad/data:/cryptpad/data
      - /mnt/kub/homelab/cryptpad/blob:/cryptpad/blob
      - /mnt/kub/homelab/cryptpad/block:/cryptpad/block
      - /mnt/kub/homelab/cryptpad/customize:/cryptpad/customize
