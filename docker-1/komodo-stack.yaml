# Komodo Core + FerretDB (Postgres-backed Mongo-wire) + Periphery bootstrap.
# Run once on docker-1 (__LAN-IP__). Phase 999.2 Wave 5 — docker-1 sub-deliverable.
#
# Source: adapted from upstream
#   https://github.com/moghtech/komodo/blob/main/compose/ferretdb.compose.yaml
# Pinned by image digest (T-999.2-07: no `:latest`, no semver tag drift).
#
# DEVIATION FROM PLAN 999.2-05 sketch:
#   The plan called for Core+Periphery only with a `127.0.0.1:8120` host
#   port and a manual `PERIPHERY_PASSKEYS` symmetric secret. Real upstream
#   install pattern uses:
#     1. A durable backing store (Komodo has no built-in DB)
#     2. Auto-generated keypair in a shared `keys` volume (asymmetric auth,
#        no shared secret to rotate)
#     3. NO host port for Periphery — only reachable on the docker bridge
#        from Core. Strictly stronger than localhost-bind.
#
# WHY FERRETDB INSTEAD OF MONGODB:
#   docker-1 is a ProxMox VM running with the default qemu64 CPU model
#   (`/proc/cpuinfo` shows "QEMU Virtual CPU version 2.5+", no AVX flag).
#   MongoDB 5.0+ requires AVX and crashes with "Illegal instruction (core
#   dumped)" immediately on every start. FerretDB is the no-AVX-required
#   path documented by Komodo upstream — Postgres backend with the
#   DocumentDB extension and a Mongo-wire-protocol shim. Komodo Core sees
#   it as `mongo:27017`-equivalent at `ferretdb:27017`.
#
# Files committed to git: this one (no secrets).
# Files NOT committed (operator authors at install time):
#   /opt/komodo/.env  — see "Operator setup" in docker-1/README.md
#
# DO NOT install Periphery on the k3s nodes (Pitfall 8 — cluster
# destabilization risk; Periphery mounts /var/run/docker.sock + /proc).
# Periphery on docker-1 manages docker-1's docker daemon; that's the design.

services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb@sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7
    # ^ resolves to ghcr.io/ferretdb/postgres-documentdb:latest captured 2026-04-30 on docker-1
    labels:
      komodo.skip: ""
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME:?set in /opt/komodo/.env}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?set in /opt/komodo/.env}
      POSTGRES_DB: postgres

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb@sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985
    # ^ resolves to ghcr.io/ferretdb/ferretdb:latest captured 2026-04-30 on docker-1
    labels:
      komodo.skip: ""
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres

  core:
    image: ghcr.io/moghtech/komodo-core@sha256:a1cceb4f971443b1e9f2a767788f663d0afb6244ee2135f7fe3fd1036af37ade
    # ^ resolves to ghcr.io/moghtech/komodo-core:latest captured 2026-04-30 on docker-1 (v1.19.5)
    labels:
      komodo.skip: ""
    init: true
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      # LAN/tailnet only — DO NOT expose publicly. No DNS entry, no PA NAT.
      - "9120:9120"
    env_file: /opt/komodo/.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
    volumes:
      # Keys volume is shared between Core and Periphery. Core auto-generates
      # `periphery.pub` here on first start; Periphery auto-generates its
      # private key here. Asymmetric auth, no shared symmetric secret.
      - keys:/config/keys
      # Dated DB backups on the host. https://komo.do/docs/setup/backup
      - /var/lib/komodo/backups:/backups
      # SSH key + known_hosts for Komodo's git ops. Komodo Core's git clone
      # falls back to system SSH (~/.ssh) — there is no SSH-key field in
      # Komodo's [[git_provider]] TOML schema (only username+token). We
      # bind a host-managed dir read-only so the key isn't bundled with
      # Komodo's auto-generated comm keys in the `keys` volume.
      #
      # Operator setup (one time on docker-1):
      #   sudo mkdir -p /etc/komodo/ssh
      #   sudo ssh-keygen -t ed25519 -f /etc/komodo/ssh/id_ed25519 -N "" \
      #     -C "komodo-docker-1-readonly@docker-1"
      #   sudo ssh-keyscan -t rsa,ecdsa,ed25519 github.com \
      #     > /etc/komodo/ssh/known_hosts
      #   sudo chmod 0700 /etc/komodo/ssh
      #   sudo chmod 0600 /etc/komodo/ssh/id_ed25519
      #   sudo chmod 0644 /etc/komodo/ssh/id_ed25519.pub /etc/komodo/ssh/known_hosts
      # Then: register id_ed25519.pub as a read-only deploy key on the
      # GitHub repo Komodo will clone (NOT a PAT — scope-isolated per-tool).
      - /etc/komodo/ssh:/root/.ssh:ro

  periphery:
    image: ghcr.io/moghtech/komodo-periphery@sha256:bd79cf960ed054fe8e02384322303e462448679b1149dde48bbef151417255b1
    # ^ resolves to ghcr.io/moghtech/komodo-periphery:latest captured 2026-04-30 on docker-1
    labels:
      komodo.skip: ""
    init: true
    restart: unless-stopped
    depends_on:
      - core
    # NO `ports:` mapping — Periphery is only reachable on the docker bridge
    # from Core (via service name `periphery:8120`). T-999.2-05 mitigated by
    # absence-of-port rather than localhost-bind.
    env_file: /opt/komodo/.env
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Periphery's root directory MUST match inside and outside the
      # container so docker compose stack file paths resolve identically
      # for the daemon (which runs on the host).
      # https://github.com/moghtech/komodo/discussions/180
      - /etc/komodo:/etc/komodo
      # NAS mount made visible to Periphery — required for compose
      # `env_file:` and absolute-path bind mounts to /mnt/kub/homelab/<svc>/...
      # to resolve. Without this, `docker compose up -d` from inside Periphery
      # silently defaults env-file vars to empty strings and recreated
      # containers come up with broken auth (lessons learned 2026-04-30
      # during Wave 5 first-deploy of Wazuh: dashboard + manager containers
      # got recreated with INDEXER_PASSWORD/API_PASSWORD = "" until this
      # mount was added).
      - /mnt/kub:/mnt/kub:ro

volumes:
  postgres-data:
  ferretdb-state:
  keys:
