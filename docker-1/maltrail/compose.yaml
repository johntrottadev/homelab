# Maltrail — malicious traffic detection. Two-container split:
#   - sensor: needs raw libpcap on docker-1's interface, host networking,
#             NET_ADMIN/NET_RAW caps. Sees only traffic that flows past
#             docker-1's NIC (acceptable for first deploy per
#             docker-1/MIRROR-PLAN.md scope; switch SPAN port for cluster-
#             wide visibility is a follow-up).
#   - server: web UI on :8338, reads sensor logs from shared bind mount.
#
# Default login: admin / changeme!  -> rotate via /var/log/maltrail/users
# (see Maltrail docs). The credential lives in the maltrail.conf below.
#
# Komodo poll path: docker-1/maltrail/compose.yaml (project_name: maltrail).

services:
  maltrail-sensor:
    image: stamparm/maltrail:latest
    container_name: maltrail-sensor
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: python3 sensor.py
    volumes:
      # Shared log dir written by sensor, read by server.
      - /var/lib/maltrail:/var/log/maltrail
      # Custom config (admin password, logging dir).
      - /mnt/kub/homelab/maltrail/maltrail.conf:/opt/maltrail/maltrail.conf:ro

  maltrail-server:
    image: stamparm/maltrail:latest
    container_name: maltrail-server
    restart: unless-stopped
    depends_on:
      - maltrail-sensor
    ports:
      - "8338:8338"
    command: python3 server.py
    volumes:
      - /var/lib/maltrail:/var/log/maltrail
      - /mnt/kub/homelab/maltrail/maltrail.conf:/opt/maltrail/maltrail.conf:ro
