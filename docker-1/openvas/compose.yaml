# OpenVAS / Greenbone Community Edition — vendored from
# greenbone/docs:src/22.4/container/compose.yaml on 2026-05-01.
# Komodo poll path: docker-1/openvas/compose.yaml (project_name: greenbone-community-edition).
#
# Default GSA web port: 9392 (HTTPS via mTLS upstream — Traefik bundle in
# clusters/default/openvas.yaml proxies http→9392, GSA's own TLS off in CE).
#
# Default admin: user `admin` / password from `openvas-bootstrap` —
# Greenbone CE prints it in the gvmd container log on first start.
#   docker logs gvmd 2>&1 | grep -A1 "User created"
#
# Storage: stays on Docker named volumes (docker-1's SSD at /var/lib/docker/
# volumes/) — feed sync ~50GB, all regenerable. Hot/cold split would
# require carving each named volume into bind mounts; out of scope for
# the first deploy.
#
# First-run feed sync takes ~1-2 hours. Until it completes, the GSA web
# UI may show empty NVT lists.

name: greenbone-community-edition

services:
  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests:latest@sha256:4f368f9ae4043ea36e10fd79913e6060c7af6fe4ff044ae22118f31c3ae24ec8
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - vt_data_vol:/mnt

  notus-data:
    image: registry.community.greenbone.net/community/notus-data:latest@sha256:87ab837d275ae0ceadd3a4bc3b9d331a547bb32a575afe4f55e4bde4cfbe34bf
    environment:
      KEEP_ALIVE: 1
    volumes:
      - notus_data_vol:/mnt

  scap-data:
    image: registry.community.greenbone.net/community/scap-data:latest@sha256:eeb99b83e456ae8fc60c8c825d19a10348d264b2f3741d3a0c53d8bea88ce293
    environment:
      KEEP_ALIVE: 1
    volumes:
      - scap_data_vol:/mnt

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data:latest@sha256:4b5c0f75ccd48bf1594229429af1d21e53e9cfc460c31be2077f58ed81b040ca
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data:latest@sha256:401cb3c6c1911c175e98ec77a7fc1a219adc8e35d8cb09c0f194dd61a6d662cd
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      cert-bund-data:
        condition: service_healthy

  data-objects:
    image: registry.community.greenbone.net/community/data-objects:latest@sha256:499c0bb4b82218e7a0c4f32ecfa5ca00ea7c178713d161ca30e6d27c8daf92f7
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt

  report-formats:
    image: registry.community.greenbone.net/community/report-formats:latest@sha256:412e70e2a3514d619b57c1b824f5a6e3ef6b9ed0229cf6919e323b76c2a11120
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      data-objects:
        condition: service_healthy

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data:latest@sha256:44d991ab377309d530e9d8e8b23d9d6ca1a1136f044a962658fe0b6f831969c6
    volumes:
      - gpg_data_vol:/mnt

  redis-server:
    image: registry.community.greenbone.net/community/redis-server:latest@sha256:b4c26eaf547ff91dc417e5d75690b2017890bf7ac8c6090c352739efb00260ff
    deploy:
      restart_policy:
        condition: any
    volumes:
      - redis_socket_vol:/run/redis/

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:stable@sha256:b07b2c458734c285f8b4ad65ff852335a53d4cdb61c8a4f41ff4da136d75762a
    deploy:
      restart_policy:
        condition: any
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully

  pg-gvm-migrator:
    image: registry.community.greenbone.net/community/pg-gvm-migrator:stable@sha256:7e81ae8defb8017c8731c84f941100d5054c7c24deb6bd66ebdc0f839bfb5c9b
    deploy:
      restart_policy:
        condition: none
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql

  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable@sha256:0bc7ae3d4a3d0eb15b3e0823188e37980f016582dbfe468f8c91e4ff6d4a1244
    deploy:
      restart_policy:
        condition: any
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy

  gsa:
    image: registry.community.greenbone.net/community/gsa:stable-slim@sha256:d61a0be90c74761972bdd77c9039a14c1365f925cc13d44fcc9ec54793477517
    environment:
      MOUNT_PATH: "/mnt/web"
      KEEP_ALIVE: 1
    healthcheck:
      test: [ "CMD-SHELL", "test -e /run/gsa/copying.done" ]
      start_period: 5s
    volumes:
      - gsa_data_vol:/mnt/web

  gsad:
    image: registry.community.greenbone.net/community/gsad:stable@sha256:24c36e536de059b1609cedfc2280826d4793a2151ba43a2dbfc9af4d6975b614
    deploy:
      restart_policy:
        condition: any
    environment:
      GSAD_HTTP_ONLY: "true"
      GSAD_API_ONLY: "true"
      GSAD_FOREGROUND: "true"
    volumes:
      - gvmd_socket_vol:/run/gvmd
    depends_on:
      gvmd:
        condition: service_started

  gvm-config:
    image: registry.community.greenbone.net/community/gvm-config:latest@sha256:db42b420bef118e55ab5cc65d673698402c5d1f658059cc3c3a60b40e717a908
    environment:
      ENABLE_NGINX_CONFIG: true
      ENABLE_TLS_GENERATION: true
    volumes:
      - nginx_config_vol:/mnt/nginx/configs
      - nginx_certificates_vol:/mnt/nginx/certs

  nginx:
    image: registry.community.greenbone.net/community/nginx:latest@sha256:49e99f6212c9dd167b66fd0c002280127bed6f5e5f3383053256986042ee1183
    ports:
      # jt-lab customization: upstream binds 443+9392 to localhost only.
      # 9392 is just a 301-redirector that returns Location: https://$host:443/,
      # so proxying through it from Traefik creates an infinite redirect.
      # Real app lives on 443 (TLS, self-signed). Expose that as :9443 on
      # docker-1's LAN interface; the Traefik bundle (clusters/default/
      # openvas.yaml) proxies it as scheme: https + lan-self-signed.
      # 9392 stays localhost-only.
      - 127.0.0.1:9392:9392
      - "9443:443"
    volumes:
      - nginx_config_vol:/etc/nginx/conf.d:ro
      - nginx_certificates_vol:/etc/nginx/certs:ro
      - gsa_data_vol:/usr/share/nginx/html:ro
    deploy:
      restart_policy:
        condition: any
    depends_on:
      gvm-config:
        condition: service_completed_successfully
      gsa:
        condition: service_healthy
      gsad:
        condition: service_started

  # Sets log level of openvas to the set LOG_LEVEL within the env
  # and changes log output to /var/log/openvas instead /var/log/gvm
  # to reduce likelihood of unwanted log interferences
  configure-openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable@sha256:be163e54638b3bb48a352fa3ab84dfea5b375c01d5792fd8c72c58b9e18c4103
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log

  # shows logs of openvas
  openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable@sha256:be163e54638b3bb48a352fa3ab84dfea5b375c01d5792fd8c72c58b9e18c4103
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully

  openvasd:
    image: registry.community.greenbone.net/community/openvas-scanner:stable@sha256:be163e54638b3bb48a352fa3ab84dfea5b375c01d5792fd8c72c58b9e18c4103
    deploy:
      restart_policy:
        condition: any
    environment:
      # `service_notus` is set to disable everything but notus,
      # if you want to utilize openvasd directly, remove `OPENVASD_MODE`
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    # enable port forwarding when you want to use the http api from your host machine
    # ports:
    #   - 127.0.0.1:3000:80
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - openvasd

  ospd-openvas:
    image: registry.community.greenbone.net/community/ospd-openvas:stable@sha256:9928adeaec0fccb109bf5747711552be449bf214103d4e559bc4d10490f78e05
    deploy:
      restart_policy:
        condition: any
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN # for capturing packages in promiscuous mode
      - NET_RAW # for raw sockets e.g. used for the boreas alive detection
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      redis-server:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy

  gvm-tools:
    image: registry.community.greenbone.net/community/gvm-tools:latest@sha256:49e1fb5efaf9af8489d0021cd4ebdea6477603e69b95652b32851f8fc0b49cef
    volumes:
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
    depends_on:
      - gvmd
      - ospd-openvas

volumes:
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
  gsa_data_vol:
  nginx_config_vol:
  nginx_certificates_vol:
