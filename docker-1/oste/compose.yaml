# OSTE-Meta-Scan via kasmweb/kali-rolling-desktop. See Dockerfile for the
# OSTE story. Komodo poll path: docker-1/legacy-vm/compose.yaml (project_name: legacy-vm).
#
# Default access: VNC_PW=changeme (rotate). KasmVNC serves HTTPS on 6901
# with a self-signed cert; Traefik bundle uses lan-self-signed to skip
# verify. Browser → https://legacy-vm.__BASE-DOMAIN__ → KasmVNC login → password
# from VNC_PW.

services:
  legacy-vm:
    build: .
    image: jt-lab/legacy-vm-kasm:1.0
    container_name: legacy-vm
    hostname: legacy-vm
    restart: unless-stopped
    ports:
      # cryptpad has docker-1:3000; map kasm 6901 to docker-1:6901 (no conflict).
      - "6901:6901"
    environment:
      - VNC_PW=${VNC_PW}
      - TZ=America/New_York
    volumes:
      # NB: don't mount on /home/kasm-user — the kasmweb entrypoint tries to
      # symlink Desktop/Uploads -> Uploads, and CIFS rejects symlink creation
      # without `mfsymlinks` (which our /mnt/kub mount intentionally lacks).
      # Mount only the persistence-worthy subdir; the rest of /home/kasm-user
      # stays on the container's overlay (rebuilt on every restart, fine for
      # KasmVNC's profile state). OSTE scan outputs land in Uploads/ so
      # this preserves what we actually care about.
      - /mnt/kub/homelab/legacy-vm/uploads:/home/kasm-user/Uploads
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
