# Phase 999.2 Wave 5 (docker-1 sub-deliverable).
# Komodo manages this compose via git polling — see flux-source/docker-1/README.md.
#
# Secrets via /mnt/kub/homelab/wazuh/single-node/.env (NAS-mounted, NEVER in git).
#
# DEVIATION FROM VERBATIM VENDOR (one-line semantic transform per bind):
#   `./config/...` -> `/mnt/kub/homelab/wazuh/single-node/config/...`
#
# Why: Komodo Stack runs `docker compose up -d` from its workspace clone
# (e.g. /etc/komodo/stacks/<stack>/), not from the data directory on the
# NAS. Relative path-bind volumes would resolve against the clone and fail
# (no config/ subtree there). Absolute paths point at the canonical NAS
# tree regardless of CWD. The /var/lib/wazuh-data/... binds were already
