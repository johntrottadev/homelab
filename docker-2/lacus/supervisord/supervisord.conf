# Vendored from app-vm-project/lacus@main 2026-05-04.
# website  → HTTP API on 0.0.0.0:7100 (this is what AIL talks to)
# capture_manager → background worker that drives Playwright captures
[supervisord]
nodaemon=true

[program:website]
command=poetry run start_website
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:capture_manager]
command=poetry run capture_manager
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
