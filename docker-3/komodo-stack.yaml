# Komodo Core + FerretDB (Postgres-backed Mongo-wire). Core-only — NO embedded Periphery.
# Run once on docker-3 (__LAN-IP__). Phase 11 11-01a — docker-3 v2 Core fresh-state deliverable
# (replaces SUPERSEDED 11-01).
#
# Source: adapted from upstream
#   https://github.com/moghtech/komodo/blob/main/compose/ferretdb.compose.yaml
# Pinned by image digest (no `:latest`, no semver tag drift).
#
# DEVIATION FROM PLAN 11-01 (SUPERSEDED):
#   11-01 attempted an in-place v1.19.5 -> v2.2.0 bump on docker-1. That
#   empirically broke FerretDB schema on 2026-05-13 (D-21, 11-01-ROLLBACK.md):
#   Core v2's `init_first_server` codepath mutated v1-shaped ServerInfo BSON
#   records in a way neither v2 (post-bump) nor v1 (post-rollback) could
#   subsequently deserialize. Recovery required Kopia volume restore from
#   s3://__WASABI-BUCKET__/dock/docker-1/.
#
#   This plan (D-17) sidesteps the schema-migration entirely by standing up v2
#   on a fresh host (docker-3) with empty FerretDB volumes. docker-1 v1 Core remains
#   on v1.19.5; decommission is gated on parity per D-20 (Plan 11-01c).
#
# WHY FERRETDB INSTEAD OF MONGODB:
#   docker-3 is a ProxMox VM running with the default qemu64 CPU model
#   (`/proc/cpuinfo` shows "QEMU Virtual CPU version 2.5+", no AVX flag).
#   MongoDB 5.0+ requires AVX and crashes with "Illegal instruction (core
#   dumped)" immediately on every start. FerretDB is the no-AVX-required
#   path documented by Komodo upstream — Postgres backend with the
#   DocumentDB extension and a Mongo-wire-protocol shim. Komodo Core sees
#   it as `mongo:27017`-equivalent at `ferretdb:27017`.
#
# Files committed to git: this one (no secrets).
# Files NOT committed (operator authors at install time):
#   /opt/komodo/.env  — see "Operator setup" in docker-3/README.md
#
# DO NOT install Periphery on the k3s nodes (cluster destabilization risk;
# Periphery mounts /var/run/docker.sock + /proc).
#
# DO NOT install embedded Periphery on docker-3 — Core only. Periphery on
# docker-1/docker-2/app-vm runs as systemd binary outbound to docker-3:9120
# (D-01, D-17, D-18).

services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17@sha256:8c7e8288d069990bc1939bfe40c132075ad90e38d68da9264c018b4139b4fd5d
    # ^ resolves to ghcr.io/ferretdb/postgres-documentdb:latest captured 2026-05-14 on docker-3 (cloned from docker-1)
    labels:
      komodo.skip: ""
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME:?set in /opt/komodo/.env}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?set in /opt/komodo/.env}
      POSTGRES_DB: postgres

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7@sha256:5d8966f7ec1267d35fc61acc56fd9f3f62f22b4baf65ecb6c331b63b86a52aac
    # ^ resolves to ghcr.io/ferretdb/ferretdb:latest captured 2026-05-14 on docker-3 (cloned from docker-1)
    labels:
      komodo.skip: ""
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.3@sha256:79622eea51702d1a26ceda75545594c01688ad567f36c98cbe38aa5c06cb542f
    # ^ resolves to ghcr.io/moghtech/komodo-core:2.2.0 captured 2026-05-14 on docker-3 (v2.2.0)
    labels:
      komodo.skip: ""
    init: true
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      # LAN/tailnet only — DO NOT expose publicly. No DNS entry, no PA NAT.
      - "9120:9120"
    env_file: /opt/komodo/.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
    volumes:
      # Keys volume: Core auto-generates asymmetric comm keys here on first start.
      # Kept in case an embedded Periphery is ever added; harmless if unused.
      - keys:/config/keys
      # Dated DB backups on the host. https://komo.do/docs/setup/backup
      - /var/lib/komodo/backups:/backups
      # SSH key + known_hosts for Komodo's git ops. Komodo Core's git clone
      # falls back to system SSH (~/.ssh) — there is no SSH-key field in
      # Komodo's [[git_provider]] TOML schema (only username+token). We
      # bind a host-managed dir read-only so the key isn't bundled with
      # Komodo's auto-generated comm keys in the `keys` volume.
      #
      # Operator setup (one time on docker-3):
      #   sudo mkdir -p /etc/komodo/ssh
      #   sudo ssh-keygen -t ed25519 -f /etc/komodo/ssh/id_ed25519 -N "" \
      #     -C "komodo-docker-3-readonly@docker-3"
      #   sudo ssh-keyscan -t rsa,ecdsa,ed25519 github.com \
      #     > /etc/komodo/ssh/known_hosts
      #   sudo chmod 0700 /etc/komodo/ssh
      #   sudo chmod 0600 /etc/komodo/ssh/id_ed25519
      #   sudo chmod 0644 /etc/komodo/ssh/id_ed25519.pub /etc/komodo/ssh/known_hosts
      # Then: register id_ed25519.pub as a read-only deploy key on the
      # GitHub repo Komodo will clone (NOT a PAT — scope-isolated per-tool).
      - /etc/komodo/ssh:/root/.ssh:ro

volumes:
  postgres-data:
  ferretdb-state:
  keys:
