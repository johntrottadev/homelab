# Source: https://fluxcd.io/flux/components/kustomize/kustomizations/#post-build-variable-substitution
# Existing in-cluster spec captured 2026-05-06 in
#   .planning/phases/03-parameterize-site-values/baselines/baseline-wrapper.yaml
# (path/prune/sourceRef/interval mirror that captured object verbatim).
#
# Cutover sequence (Plan 12.1 — replaces Plan 03-02 cluster-vars ConfigMap step):
#   1. Bootstrap encrypted cluster-vars Secret (one-time per cluster lifecycle):
#        sops --decrypt clusters/default/flux-system/secret-cluster-vars.enc.yaml \
#          | kubectl apply -f -
#   2. kubectl apply -f this file (still suspended).
#   3. flux resume kustomization flux-system -n flux-system  <-- live point.
#   4. flux get kustomization flux-system --watch  <-- confirm Ready: True.
#
# Rollback: kubectl apply -f baselines/baseline-wrapper.yaml restores the
# pre-cutover spec (no postBuild); flux suspend keeps reconcile paused.
#
# This repo was bootstrapped manually (no `flux bootstrap` flow); the
# flux-system/ directory contains ONLY this Kustomization and the
# cluster-vars.example.yaml ConfigMap template. Do NOT add gotk-components.yaml
# or gotk-sync.yaml siblings (RESEARCH Pitfall 10).
#
# SOPS decryption (Phase 12 plan 12-02, Mode A — operator decision 2026-05-15):
# spec.decryption.{provider,secretRef} below points at the in-cluster `sops-age`
# Secret in flux-system ns (bootstrapped out-of-band by `kubectl create secret
# generic sops-age --from-file=age.agekey=...`). Mode A (per-Kustomization
# decryption) chosen instead of Mode B (kustomize-controller --sops-age-secret
# global flag) because this manually-bootstrapped repo does NOT own the
# kustomize-controller Deployment manifest in git, so a Kustomize `patches:`
# block in clusters/default/flux-system/ would have no target in the build
# output (verified empirically via `kustomize build clusters/default/flux-system/`
# producing 0 lines; commit 5812eb5 was reverted in 24c5921 — see Phase 12
# Plan 12-02 SUMMARY for the full rationale).
#
# This file is applied via `kubectl apply -f flux-system/kustomization.yaml`
# (manual-bootstrap convention; documented in steps 1-4 above), NOT via Flux —
# the parent Kustomization cannot manage itself.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/default
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  suspend: false
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
        # optional: false (default) — reconcile fails if ConfigMap absent.
        # Desired: cluster-vars is load-bearing (RESEARCH Pitfall 9).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
