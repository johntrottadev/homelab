## blackbox-exporter — used by Prometheus Probe CRs to actively probe
## external/internal targets (TCP, HTTP, DNS). Lets us alert on WAN
## connectivity and LAN gateway reachability without needing privileged
## ICMP from k3s pods.
##
## Apply: kubectl apply -f monitoring/blackbox-exporter.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      tcp_connect:
        prober: tcp
        timeout: 5s
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
          valid_status_codes: [200, 204, 301, 302]
      dns_query:
        prober: dns
        timeout: 5s
        dns:
          query_name: cloudflare.com
          query_type: A
          preferred_ip_protocol: ip4
          validate_answer_rrs:
            fail_if_not_matches_regexp:
              - 'cloudflare\.com\.\s+\d+\s+IN\s+A\s+\d+\.\d+\.\d+\.\d+'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.27.0
          args:
            - --config.file=/etc/blackbox/blackbox.yml
            - --web.listen-address=:9115
          ports:
            - name: http
              containerPort: 9115
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
          readinessProbe:
            httpGet: { path: /-/healthy, port: http }
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { memory: 96Mi }
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
## TCP probe: WAN (Cloudflare + Google public DNS on TCP/53)
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-wan-tcp
  namespace: monitoring
  labels:
    release: prometheus
spec:
  jobName: blackbox-wan-tcp
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - 1.1.1.1:53
        - 8.8.8.8:53
      labels:
        target_kind: wan
---
## (LAN gateway probe deferred — Palo Alto exposes no service on LAN-side
##  TCP that we can reliably probe. To re-enable: configure an Interface
##  Management Profile on the LAN zone allowing Ping or a Response-Page
##  service on a known port, then re-add a Probe CR targeting that.)
---
## DNS probe: validate that public DNS resolves for cloudflare.com
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-public-dns
  namespace: monitoring
  labels:
    release: prometheus
spec:
  jobName: blackbox-public-dns
  module: dns_query
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - 1.1.1.1
        - 8.8.8.8
      labels:
        target_kind: public_dns
