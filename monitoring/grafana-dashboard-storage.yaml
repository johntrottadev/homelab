apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-storage-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  storage.json: |
    {
      "title": "Homelab — Storage Health",
      "uid": "homelab-storage",
      "schemaVersion": 39,
      "editable": true,
      "timezone": "",
      "tags": ["storage", "homelab", "backup-host", "synology", "k8s"],
      "time": {"from": "now-24h", "to": "now"},
      "refresh": "1m",
      "templating": {"list": []},
      "panels": [
        {
          "type": "stat", "title": "PBS Used / Total",
          "id": 1, "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(pbs_used)"}, {"refId": "B", "expr": "sum(pbs_size)"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value", "colorMode": "none", "graphMode": "area", "justifyMode": "center"}
        },
        {
          "type": "stat", "title": "PBS Free",
          "id": 2, "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(pbs_available)"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 100000000000}, {"color": "green", "value": 500000000000}]}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value", "colorMode": "value", "graphMode": "none", "justifyMode": "center"}
        },
        {
          "type": "stat", "title": "Synology Disks Healthy",
          "id": 3, "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "count(diskHealthStatus{job=\"snmp-synology\"} == 1) / count(diskHealthStatus{job=\"snmp-synology\"}) * 100"}],
          "fieldConfig": {"defaults": {"unit": "percent", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 75}, {"color": "green", "value": 100}]}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value", "colorMode": "value", "graphMode": "none", "justifyMode": "center"}
        },
        {
          "type": "stat", "title": "Max Disk Temp (°C)",
          "id": 4, "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "max(diskTemperature{job=\"snmp-synology\"})"}],
          "fieldConfig": {"defaults": {"unit": "celsius", "decimals": 0, "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 50}, {"color": "orange", "value": 55}, {"color": "red", "value": 60}]}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value", "colorMode": "value", "graphMode": "none", "justifyMode": "center"}
        },
        {
          "type": "stat", "title": "k8s PVCs Total Used",
          "id": 5, "gridPos": {"h": 4, "w": 4, "x": 16, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(kubelet_volume_stats_used_bytes)"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "fixed", "fixedColor": "blue"}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value", "colorMode": "value", "graphMode": "area", "justifyMode": "center"}
        },
        {
          "type": "stat", "title": "PBS Snapshots Total",
          "id": 6, "gridPos": {"h": 4, "w": 4, "x": 20, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(pbs_snapshot_count)"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "fixed", "fixedColor": "blue"}}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "value", "colorMode": "value", "graphMode": "area", "justifyMode": "center"}
        },
        {
          "type": "gauge", "title": "PBS Datastore Utilization",
          "id": 7, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 * pbs_used / pbs_size", "legendFormat": "{{datastore}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 60}, {"color": "orange", "value": 80}, {"color": "red", "value": 92}]}}},
          "options": {"showThresholdLabels": false, "showThresholdMarkers": true, "orientation": "auto"}
        },
        {
          "type": "table", "title": "PBS — Last Backup Age per VM (sorted oldest first)",
          "id": 8, "gridPos": {"h": 8, "w": 16, "x": 8, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "(time() - pbs_snapshot_vm_last_timestamp) / 3600", "format": "table", "instant": true, "legendFormat": "__auto"}],
          "transformations": [
            {"id": "organize", "options": {"excludeByName": {"Time": true, "__name__": true, "instance": true, "job": true, "namespace": true, "endpoint": true, "service": true, "container": true, "pod": true, "prometheus": true}, "renameByName": {"vm_id": "VM ID", "vm_name": "VM Name", "datastore": "Datastore", "namespace": "PBS Namespace", "Value": "Last Backup (h)"}}}
          ],
          "fieldConfig": {
            "defaults": {"custom": {"align": "left"}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Last Backup (h)"}, "properties": [
                {"id": "unit", "value": "h"},
                {"id": "decimals", "value": 1},
                {"id": "custom.cellOptions", "value": {"type": "color-background", "mode": "gradient"}},
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 26}, {"color": "orange", "value": 36}, {"color": "red", "value": 72}]}}
              ]}
            ]
          },
          "options": {"showHeader": true, "sortBy": [{"displayName": "Last Backup (h)", "desc": true}]}
        },
        {
          "type": "table", "title": "Synology Disk Health",
          "id": 9, "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "diskHealthStatus{job=\"snmp-synology\"}", "format": "table", "instant": true, "legendFormat": "__auto"},
            {"refId": "B", "expr": "diskTemperature{job=\"snmp-synology\"}", "format": "table", "instant": true, "legendFormat": "__auto"},
            {"refId": "C", "expr": "diskRemainLife{job=\"snmp-synology\"}", "format": "table", "instant": true, "legendFormat": "__auto"},
            {"refId": "D", "expr": "diskBadSector{job=\"snmp-synology\"}", "format": "table", "instant": true, "legendFormat": "__auto"},
            {"refId": "E", "expr": "diskRetry{job=\"snmp-synology\"}", "format": "table", "instant": true, "legendFormat": "__auto"}
          ],
          "transformations": [
            {"id": "joinByField", "options": {"byField": "diskID", "mode": "outer"}},
            {"id": "organize", "options": {"excludeByName": {"Time 1": true, "Time 2": true, "Time 3": true, "Time 4": true, "Time 5": true, "__name__ 1": true, "__name__ 2": true, "__name__ 3": true, "__name__ 4": true, "__name__ 5": true, "instance 1": true, "instance 2": true, "instance 3": true, "instance 4": true, "instance 5": true, "job 1": true, "job 2": true, "job 3": true, "job 4": true, "job 5": true, "namespace 1": true, "namespace 2": true, "namespace 3": true, "namespace 4": true, "namespace 5": true, "endpoint 1": true, "endpoint 2": true, "endpoint 3": true, "endpoint 4": true, "endpoint 5": true, "service 1": true, "service 2": true, "service 3": true, "service 4": true, "service 5": true, "container 1": true, "container 2": true, "container 3": true, "container 4": true, "container 5": true, "pod 1": true, "pod 2": true, "pod 3": true, "pod 4": true, "pod 5": true, "prometheus 1": true, "prometheus 2": true, "prometheus 3": true, "prometheus 4": true, "prometheus 5": true, "diskName 2": true, "diskName 3": true, "diskName 4": true, "diskName 5": true, "diskIndex 2": true, "diskIndex 3": true, "diskIndex 4": true, "diskIndex 5": true, "target_kind 1": true, "target_kind 2": true, "target_kind 3": true, "target_kind 4": true, "target_kind 5": true}, "renameByName": {"diskID": "Disk", "diskName 1": "Name", "diskIndex 1": "Index", "Value #A": "Status", "Value #B": "Temp (°C)", "Value #C": "Life Remaining (%)", "Value #D": "Bad Sectors", "Value #E": "Retries"}}}
          ],
          "fieldConfig": {
            "defaults": {"custom": {"align": "left"}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Status"}, "properties": [
                {"id": "mappings", "value": [{"type": "value", "options": {"1": {"text": "Normal", "color": "green"}, "2": {"text": "Initialized", "color": "yellow"}, "3": {"text": "NotInitialized", "color": "orange"}, "4": {"text": "SysPartFailed", "color": "red"}, "5": {"text": "Crashed", "color": "red"}}}]},
                {"id": "custom.cellOptions", "value": {"type": "color-text"}}
              ]},
              {"matcher": {"id": "byName", "options": "Temp (°C)"}, "properties": [
                {"id": "unit", "value": "celsius"},
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 50}, {"color": "orange", "value": 55}, {"color": "red", "value": 60}]}},
                {"id": "custom.cellOptions", "value": {"type": "color-background", "mode": "gradient"}}
              ]},
              {"matcher": {"id": "byName", "options": "Life Remaining (%)"}, "properties": [
                {"id": "unit", "value": "percent"},
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 20}, {"color": "yellow", "value": 50}, {"color": "green", "value": 80}]}},
                {"id": "custom.cellOptions", "value": {"type": "color-background", "mode": "gradient"}}
              ]},
              {"matcher": {"id": "byName", "options": "Bad Sectors"}, "properties": [
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}},
                {"id": "custom.cellOptions", "value": {"type": "color-text"}}
              ]}
            ]
          },
          "options": {"showHeader": true, "sortBy": [{"displayName": "Disk", "desc": false}]}
        },
        {
          "type": "bargauge", "title": "k8s PVCs — Top 15 by Utilization",
          "id": 10, "gridPos": {"h": 10, "w": 24, "x": 0, "y": 20},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "topk(15, 100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)", "legendFormat": "{{namespace}} / {{persistentvolumeclaim}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "orange", "value": 85}, {"color": "red", "value": 92}]}}},
          "options": {"orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true, "valueMode": "color"}
        },
        {
          "type": "table", "title": "PVE Cluster Storage",
          "id": 11, "gridPos": {"h": 7, "w": 24, "x": 0, "y": 30},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "pve_disk_size_bytes{id=~\"storage/.*\"}", "format": "table", "instant": true, "legendFormat": "__auto"},
            {"refId": "B", "expr": "pve_disk_usage_bytes{id=~\"storage/.*\"}", "format": "table", "instant": true, "legendFormat": "__auto"},
            {"refId": "C", "expr": "100 * pve_disk_usage_bytes{id=~\"storage/.*\"} / pve_disk_size_bytes{id=~\"storage/.*\"}", "format": "table", "instant": true, "legendFormat": "__auto"}
          ],
          "transformations": [
            {"id": "joinByField", "options": {"byField": "id", "mode": "outer"}},
            {"id": "organize", "options": {"excludeByName": {"Time 1": true, "Time 2": true, "Time 3": true, "__name__ 1": true, "__name__ 2": true, "__name__ 3": true, "instance 1": true, "instance 2": true, "instance 3": true, "job 1": true, "job 2": true, "job 3": true}, "renameByName": {"id": "Storage", "Value #A": "Total", "Value #B": "Used", "Value #C": "% Full"}}}
          ],
          "fieldConfig": {
            "defaults": {"custom": {"align": "left"}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Total"}, "properties": [{"id": "unit", "value": "bytes"}]},
              {"matcher": {"id": "byName", "options": "Used"}, "properties": [{"id": "unit", "value": "bytes"}]},
              {"matcher": {"id": "byName", "options": "% Full"}, "properties": [
                {"id": "unit", "value": "percent"},
                {"id": "decimals", "value": 1},
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "orange", "value": 85}, {"color": "red", "value": 92}]}},
                {"id": "custom.cellOptions", "value": {"type": "color-background", "mode": "gradient"}}
              ]}
            ]
          },
          "options": {"showHeader": true, "sortBy": [{"displayName": "% Full", "desc": true}]}
        }
      ]
    }
