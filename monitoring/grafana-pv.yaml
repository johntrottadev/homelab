apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-pv
  namespace: monitoring
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "monitoring"
  nfs:
    path: /volume1/kub/homelab/monitoring/grafana
    server: __NAS-HOST__
  mountOptions:
    - nolock
    - noatime
    - nfsvers=4.1