## Homelab-specific alert rules — complements the kube-prometheus-stack defaults.
## Severity routing (configured in monitoring/values.yaml):
##   critical → Pushover priority 1, 1h repeat
##   warning  → Pushover priority 0, 4h repeat
##
## Apply: kubectl apply -f monitoring/homelab-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus
spec:
  groups:
    - name: homelab.velero.rules
      interval: 1m
      rules:
        - alert: VeleroDailyBackupStale
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule="daily-apps"} > 30 * 3600
          for: 15m
          labels:
            severity: critical
            component: velero
          annotations:
            summary: 'Velero daily-apps backup is stale'
            description: 'Last successful daily-apps backup was {{ $value | humanizeDuration }} ago (threshold 30h). Check Velero CRs and PodVolumeBackup status.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#velerodailybackupstale'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: VeleroWeeklyBackupStale
          expr: |
            time() - velero_backup_last_successful_timestamp{schedule="weekly-apps"} > 8 * 86400
          for: 1h
          labels:
            severity: warning
            component: velero
          annotations:
            summary: 'Velero weekly-apps backup is stale'
            description: 'Last successful weekly-apps backup was {{ $value | humanizeDuration }} ago (threshold 8d).'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#veleroweeklybackupstale'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: VeleroBackupRecentFailure
          expr: |
            increase(velero_backup_failure_total[24h])
              + increase(velero_backup_partial_failure_total[24h]) > 0
          for: 5m
          labels:
            severity: warning
            component: velero
          annotations:
            summary: 'Velero schedule {{ $labels.schedule }} had a failed or partially-failed backup in the last 24h'
            description: 'Inspect the most recent Backup CR for schedule={{ $labels.schedule }} — check item errors and pod-volume backup status.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#velerobackuprecentfailure'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: VeleroBackupStorageDown
          expr: velero_backup_location_status_gauge == 0
          for: 15m
          labels:
            severity: critical
            component: velero
          annotations:
            summary: 'Velero BackupStorageLocation {{ $labels.name }} is unavailable'
            description: 'BSL {{ $labels.name }} has been Unavailable for 15m+ — Wasabi auth/network issue most likely. New backups cannot upload.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#velerobackupstoragedown'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

    - name: homelab.pve.rules
      interval: 1m
      rules:
        - alert: PVENodeDown
          expr: pve_up{id=~"node/.*"} == 0
          for: 5m
          labels:
            severity: critical
            component: pve
          annotations:
            summary: 'PVE node {{ $labels.id }} is down'
            description: 'Proxmox node {{ $labels.id }} reports down for 5+ minutes per pve-exporter on __PVE-NODE-1__.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pvenodedown'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-pve'

        - alert: PVEGuestUnexpectedlyDown
          expr: pve_up{id=~"qemu/.*|lxc/.*"} == 0 and pve_onboot_status{id=~"qemu/.*|lxc/.*"} == 1
          for: 10m
          labels:
            severity: warning
            component: pve
          annotations:
            summary: 'PVE guest {{ $labels.id }} is down (onboot=enabled)'
            description: 'Guest {{ $labels.id }} has onboot=1 but is not running for 10m+. Either it crashed or boot failed.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pveguestunexpectedlydown'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-pve'

        - alert: PVEStorageHigh
          expr: |
            100 * pve_disk_usage_bytes{id=~"storage/.*"}
              / pve_disk_size_bytes{id=~"storage/.*"} > 85
          for: 30m
          labels:
            severity: warning
            component: pve
          annotations:
            summary: 'PVE storage {{ $labels.id }} >85% full'
            description: 'Storage {{ $labels.id }} at {{ $value | printf "%.1f" }}% utilization.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pvestoragehigh'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: PVEStorageCritical
          expr: |
            100 * pve_disk_usage_bytes{id=~"storage/.*"}
              / pve_disk_size_bytes{id=~"storage/.*"} > 92
          for: 10m
          labels:
            severity: critical
            component: pve
          annotations:
            summary: 'PVE storage {{ $labels.id }} >92% full'
            description: 'Storage {{ $labels.id }} at {{ $value | printf "%.1f" }}%. Free space immediately or backups will fail.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pvestoragecritical'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

    - name: homelab.backup-host.rules
      interval: 1m
      rules:
        - alert: PBSExporterDown
          expr: up{job="backup-host-exporter"} == 0
          for: 10m
          labels:
            severity: warning
            component: backup-host
          annotations:
            summary: 'backup-host-exporter scrape failing'
            description: 'Prometheus cannot scrape backup-host-exporter — backup observability is blind.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsexporterdown'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: PBSDatastoreHigh
          expr: |
            100 * (pbs_size - pbs_available) / pbs_size > 85
          for: 30m
          labels:
            severity: warning
            component: backup-host
          annotations:
            summary: 'PBS datastore {{ $labels.datastore }} >85% full'
            description: 'Datastore {{ $labels.datastore }} at {{ $value | printf "%.1f" }}%. Backup rotation or prune may need attention.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsdatastorehigh'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: PBSDatastoreCritical
          expr: |
            100 * (pbs_size - pbs_available) / pbs_size > 92
          for: 10m
          labels:
            severity: critical
            component: backup-host
          annotations:
            summary: 'PBS datastore {{ $labels.datastore }} >92% full'
            description: 'Datastore {{ $labels.datastore }} at {{ $value | printf "%.1f" }}%. New backups will fail soon.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsdatastorecritical'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: PBSVMBackupStale
          ## Fires for any VM whose last backup is >36h old, but only if it
          ## has a backup within the last 14 days (filters out long-decommissioned VMs).
          expr: |
            (time() - pbs_snapshot_vm_last_timestamp > 36*3600)
              and (pbs_snapshot_vm_last_timestamp > time() - 14*86400)
          for: 30m
          labels:
            severity: warning
            component: backup-host
          annotations:
            summary: 'PBS backup stale: VM {{ $labels.vm_id }} ({{ $labels.vm_name }})'
            description: 'Last backup {{ $value | humanizeDuration }} ago on datastore {{ $labels.datastore }}. Threshold 36h.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsvmbackupstale'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: PBSBackupVerifyFailed
          expr: pbs_snapshot_vm_last_verify == 0
          for: 30m
          labels:
            severity: warning
            component: backup-host
          annotations:
            summary: 'PBS verify failed on last backup of VM {{ $labels.vm_id }} ({{ $labels.vm_name }})'
            description: 'Most recent backup did not pass verify on datastore {{ $labels.datastore }}.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#pbsbackupverifyfailed'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

    - name: homelab.synology.rules
      interval: 1m
      rules:
        - alert: SynologySNMPDown
          expr: up{job="snmp-synology"} == 0
          for: 10m
          labels:
            severity: warning
            component: synology
          annotations:
            summary: 'Synology NAS SNMP scrape failing'
            description: 'snmp-exporter cannot reach __NAS-IP__ — NAS observability is blind.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#synologysnmpdown'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: SynologyDiskUnhealthy
          ## diskHealthStatus: 1 = Normal, 2 = Initialized, 3 = NotInitialized,
          ## 4 = SystemPartitionFailed, 5 = Crashed.
          expr: diskHealthStatus{job="snmp-synology"} > 1
          for: 15m
          labels:
            severity: warning
            component: synology
          annotations:
            summary: 'Synology disk reports non-normal health'
            description: 'diskHealthStatus={{ $value }} on {{ $labels.diskID }} — investigate via DSM Storage Manager.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#synologydiskunhealthy'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: SynologyDiskRemainLifeLow
          ## diskRemainLife is SSD wear-leveling %. Synology reports -1 for
          ## HDDs (no wear concept) and 100 for healthy SSDs. Filter to
          ## >=0 to skip the N/A case so HDDs don't false-fire.
          expr: |
            diskRemainLife{job="snmp-synology"} >= 0
              and diskRemainLife{job="snmp-synology"} < 20
          for: 1h
          labels:
            severity: warning
            component: synology
          annotations:
            summary: 'Synology SSD wear: {{ $labels.diskID }} at {{ $value }}% lifetime'
            description: 'SSD wear-leveling indicator at {{ $value }}%. Plan replacement before <10%.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#synologydiskremainlifelow'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

    - name: homelab.paloalto.rules
      interval: 1m
      rules:
        - alert: PaloAltoSNMPDown
          ## Conditional on prior-observed up — won't fire during initial setup
          ## before SNMPv3 user is configured. Fires only when a previously-up
          ## device goes down.
          expr: |
            up{job=~"snmp-paloalto.*"} == 0
              and max_over_time(up{job=~"snmp-paloalto.*"}[24h]) == 1
          for: 10m
          labels:
            severity: warning
            component: paloalto
          annotations:
            summary: 'Palo Alto SNMP scrape failing ({{ $labels.job }})'
            description: 'snmp-exporter cannot reach __LAN-IP__ via {{ $labels.job }} — firewall observability is blind. Was previously responsive.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltosnmpdown'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

        - alert: PaloAltoSessionUtilizationHigh
          expr: 100 * panSessionActive / panSessionMax > 50
          for: 15m
          labels:
            severity: warning
            component: paloalto
          annotations:
            summary: 'PA session table >50% full ({{ $value | printf "%.1f" }}%)'
            description: 'Active sessions {{ with query "panSessionActive" }}{{ . | first | value }}{{ end }} of {{ with query "panSessionMax" }}{{ . | first | value }}{{ end }}. Investigate scan/attack or runaway client.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltosessionutilizationhigh'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

        - alert: PaloAltoSessionUtilizationCritical
          expr: 100 * panSessionActive / panSessionMax > 80
          for: 5m
          labels:
            severity: critical
            component: paloalto
          annotations:
            summary: 'PA session table >80% full ({{ $value | printf "%.1f" }}%)'
            description: 'Session table near exhaustion. New connections may be dropped imminently.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltosessionutilizationcritical'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

        - alert: PaloAltoSessionDiscardsSpike
          ## panSessionDiscard is cumulative since boot. Rate >5/sec sustained
          ## for 15m is well above a quiet-homelab baseline (currently ~0).
          expr: rate(panSessionDiscard[5m]) > 5
          for: 15m
          labels:
            severity: warning
            component: paloalto
          annotations:
            summary: 'PA session-discard rate elevated ({{ $value | printf "%.1f" }}/s)'
            description: 'Sessions are being discarded at {{ $value | printf "%.1f" }}/s for 15m+. Could indicate scan/attack, policy denial spike, or session-table pressure.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltosessiondiscardsspike'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

        - alert: PaloAltoInterfaceSaturationHigh
          ## Full-duplex links: alert if either direction exceeds 80% of
          ## ifHighSpeed (Mbps). Filter to physical interfaces (HighSpeed>0)
          ## that are admin-up.
          expr: |
            (
              max by(ifName, ifIndex, instance) (
                8 * rate(ifHCInOctets{job="snmp-paloalto-if"}[5m])
                  or 8 * rate(ifHCOutOctets{job="snmp-paloalto-if"}[5m])
              )
              / on(ifIndex) group_left() (ifHighSpeed{job="snmp-paloalto-if"} * 1e6)
            ) * 100 > 80
            and on(ifIndex) ifAdminStatus{job="snmp-paloalto-if"} == 1
            and on(ifIndex) ifHighSpeed{job="snmp-paloalto-if"} > 0
          for: 10m
          labels:
            severity: warning
            component: paloalto
          annotations:
            summary: 'PA interface {{ $labels.ifName }} >80% saturated'
            description: 'Interface {{ $labels.ifName }} sustained >80% link-speed utilization for 10m+ (peak direction).'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltointerfacesaturationhigh'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

        - alert: PaloAltoInterfaceSaturationCritical
          expr: |
            (
              max by(ifName, ifIndex, instance) (
                8 * rate(ifHCInOctets{job="snmp-paloalto-if"}[5m])
                  or 8 * rate(ifHCOutOctets{job="snmp-paloalto-if"}[5m])
              )
              / on(ifIndex) group_left() (ifHighSpeed{job="snmp-paloalto-if"} * 1e6)
            ) * 100 > 95
            and on(ifIndex) ifAdminStatus{job="snmp-paloalto-if"} == 1
            and on(ifIndex) ifHighSpeed{job="snmp-paloalto-if"} > 0
          for: 5m
          labels:
            severity: critical
            component: paloalto
          annotations:
            summary: 'PA interface {{ $labels.ifName }} >95% saturated'
            description: 'Interface {{ $labels.ifName }} pinned to link speed for 5m+. Drops likely.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltointerfacesaturationcritical'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

        - alert: PaloAltoInterfaceErrorsSpike
          expr: |
            rate(ifInErrors{job="snmp-paloalto-if"}[5m]) > 1
            and on(ifIndex) ifAdminStatus{job="snmp-paloalto-if"} == 1
          for: 15m
          labels:
            severity: warning
            component: paloalto
          annotations:
            summary: 'PA interface {{ $labels.ifName }} input errors >1/s'
            description: 'Input error rate {{ $value | printf "%.2f" }}/s for 15m+ — usually a layer-1/cable/duplex issue.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#paloaltointerfaceerrorsspike'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

    - name: homelab.pihole.rules
      interval: 1m
      rules:
        - alert: PiholeExporterDown
          expr: up{job="pihole-exporter"} == 0
          for: 10m
          labels:
            severity: warning
            component: pihole
          annotations:
            summary: 'pihole-exporter scrape failing'
            description: 'Cannot reach pihole-exporter — DNS observability is blind. Either the exporter pod is unhealthy or both Pi-holes are unreachable.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#piholeexporterdown'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-pihole'

        - alert: PiholeDisabled
          ## pihole_status: 1 = blocking enabled, 0 = blocking disabled
          ## (someone manually clicked "Disable" in the admin UI). 15m
          ## buffer because user may temp-disable for troubleshooting.
          expr: pihole_status == 0
          for: 15m
          labels:
            severity: warning
            component: pihole
          annotations:
            summary: 'Pi-hole blocking disabled on {{ $labels.hostname }}'
            description: 'Ad-blocking is OFF on {{ $labels.hostname }}. Re-enable in the admin UI or check why it was disabled.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#piholedisabled'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-pihole'

        - alert: PiholeUpstreamSlow
          ## Upstream DNS resolution time elevated. Excludes cache and
          ## blocklist (those are local instant lookups).
          expr: |
            pihole_forward_destinations_responsetime{destination_name!~"cache|blocklist"} > 0.5
          for: 15m
          labels:
            severity: warning
            component: pihole
          annotations:
            summary: 'Pi-hole upstream {{ $labels.destination_name }} slow ({{ $value | printf "%.2f" }}s)'
            description: 'On {{ $labels.hostname }}, average response time from {{ $labels.destination_name }} is {{ $value | printf "%.2f" }}s for 15m+. Upstream DNS provider issue.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#piholeupstreamslow'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-pihole'

    - name: homelab.network.rules
      interval: 30s
      rules:
        - alert: WANDown
          ## Both public TCP/53 probes failing simultaneously means we've lost
          ## external connectivity (or both Cloudflare AND Google are down).
          expr: |
            min by () (probe_success{target_kind="wan"}) == 0
          for: 2m
          labels:
            severity: critical
            component: network
          annotations:
            summary: 'WAN connectivity lost — all public TCP/53 probes failing'
            description: 'Both 1.1.1.1:53 and 8.8.8.8:53 unreachable for 2m+. Check Palo Alto WAN interface and ISP.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#wandown'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

        - alert: PublicDNSResolutionFailing
          expr: probe_success{target_kind="public_dns"} == 0
          for: 5m
          labels:
            severity: warning
            component: network
          annotations:
            summary: 'Public DNS resolver {{ $labels.instance }} not answering'
            description: 'DNS query against {{ $labels.instance }} has been failing for 5m+.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#publicdnsresolutionfailing'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/paloalto-firewall'

    - name: homelab.k8s.rules
      interval: 1m
      rules:
        - alert: HomelabPVCHigh
          expr: |
            100 * kubelet_volume_stats_used_bytes
              / kubelet_volume_stats_capacity_bytes > 85
          for: 30m
          labels:
            severity: warning
            component: storage
          annotations:
            summary: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} >85% full'
            description: 'PVC at {{ $value | printf "%.1f" }}% on node {{ $labels.kubernetes_node }}.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#homelabpvchigh'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'

        - alert: HomelabPVCCritical
          expr: |
            100 * kubelet_volume_stats_used_bytes
              / kubelet_volume_stats_capacity_bytes > 92
          for: 10m
          labels:
            severity: critical
            component: storage
          annotations:
            summary: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} >92% full'
            description: 'PVC at {{ $value | printf "%.1f" }}% on node {{ $labels.kubernetes_node }}. Resize or free space.'
            runbook_url: 'https://github.com/johntrottadev/homelab/blob/main/monitoring/RUNBOOKS.md#homelabpvccritical'
            dashboard_url: 'https://grafana.__BASE-DOMAIN__/d/homelab-storage'
