## pihole-exporter — eko/pihole-exporter scrapes Pi-hole API and exposes
## Prometheus metrics. Multi-instance support via comma-separated config:
## one Deployment handles both pihole1 (__PIHOLE1-IP__) and pihole2 (__PIHOLE2-IP__).
##
## Credentials live in pihole-exporter-credentials Secret (key: passwords),
## comma-separated, applied separately from /mnt/code/secrets/homelab/...
##
## Apply: kubectl apply -f monitoring/pihole-exporter.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pihole-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole-exporter
    spec:
      containers:
        - name: pihole-exporter
          image: ekofr/pihole-exporter:v1.2.0
          env:
            - name: PIHOLE_HOSTNAME
              value: "__PIHOLE1-IP__,__PIHOLE2-IP__"
            - name: PIHOLE_PORT
              value: "80,80"
            - name: PIHOLE_PROTOCOL
              value: "http,http"
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-exporter-credentials
                  key: passwords
            - name: PORT
              value: "9617"
            - name: INTERVAL
              value: "30s"
          ports:
            - name: metrics
              containerPort: 9617
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pihole-exporter
spec:
  selector:
    app.kubernetes.io/name: pihole-exporter
  ports:
    - name: metrics
      port: 9617
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pihole-exporter
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 15s
