apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-pv
  namespace: monitoring
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "monitoring"
  nfs:
    path: /volume1/kub/homelab/monitoring/prometheus
    server: __NAS-HOST__
