auths:
  synology_v3:
    version: 3
    security_level: authPriv
    username: ${SYNO_SNMP_USER}
    password: ${SYNO_SNMP_AUTH_PASS}
    auth_protocol: SHA
    priv_protocol: AES
    priv_password: ${SYNO_SNMP_PRIV_PASS}
  paloalto_v3:
    version: 3
    security_level: authPriv
    username: ${PA_SNMP_USER}
    password: ${PA_SNMP_AUTH_PASS}
    auth_protocol: SHA
    priv_protocol: AES
    priv_password: ${PA_SNMP_PRIV_PASS}

