fullnameOverride: prometheus

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

alertmanager:
  enabled: true
  fullnameOverride: alertmanager
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "monitoring"
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: "5Gi"
          volumeName: alertmanager-pv

grafana:
  enabled: true
  fullnameOverride: grafana
  persistence:
    enabled: true
    type: sts
    storageClassName: "monitoring"
    accessModes:
      - ReadWriteMany
    size: 10Gi
    volumeName: grafana-pv
    finalizers:
      - kubernetes.io/pvc-protection
  forceDeployDatasources: false
  forceDeployDashboards: false
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: utc
  serviceMonitor:
    enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

kubeApiServer:
  enabled: true

kubelet:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      - action: replace
        sourceLabels:
          - node
        targetLabel: instance

kubeControllerManager:
  enabled: true
  endpoints:
    - __K3S-API-IP__
    - __LAN-IP__
    - __LAN-IP__
    - __LAN-IP__

coreDns:
  enabled: true

kubeDns:
  enabled: false

kubeEtcd:
  enabled: true
  endpoints:
    - __K3S-API-IP__
    - __LAN-IP__
    - __LAN-IP__
    - __LAN-IP__
  service:
    enabled: true
    port: 2381
    targetPort: 2381

kubeScheduler:
  enabled: true
  endpoints:
    - __K3S-API-IP__
    - __LAN-IP__
    - __LAN-IP__
    - __LAN-IP__

kubeProxy:
  enabled: true
  endpoints:
    - __K3S-API-IP__
    - __LAN-IP__
    - __LAN-IP__
    - __LAN-IP__

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  fullnameOverride: kube-state-metrics
  selfMonitor:
    enabled: true
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: kubernetes_node

nodeExporter:
  enabled: true
  serviceMonitor:
    relabelings:
      - action: replace
        regex: (.*)
        replacement: $1
        sourceLabels:
          - __meta_kubernetes_pod_node_name
        targetLabel: kubernetes_node

prometheus-node-exporter:
  fullnameOverride: node-exporter
  podLabels:
    jobLabel: node-exporter
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
  service:
    portName: http-metrics
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: kubernetes_node
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2048Mi

prometheusOperator:
  enabled: true
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 200m
        memory: 50Mi
      limits:
        memory: 100Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: prometheus-pvc
        spec:
          storageClassName: "monitoring"
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: "50Gi"
          volumeName: prometheus-pv
    additionalScrapeConfigs:
      - job_name: "proxmox"
        metrics_path: "/pve?target=__PVE1-IP__"
        static_configs:
          - targets: ["__PVE1-IP__:9221"]

      - job_name: "proxmox"
        metrics_path: "/pve?target=__PVE2-IP__"
        static_configs:
          - targets: ["__PVE2-IP__:9221"]

      - job_name: "proxmox"
        metrics_path: "/pve?target=__PVE3-IP__"
        static_configs:
          - targets: ["__PVE3-IP__:9221"]
thanosRuler:
  enabled: false


