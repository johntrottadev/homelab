fullnameOverride: prometheus

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

alertmanager:
  enabled: true
  fullnameOverride: alertmanager
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "monitoring"
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: "5Gi"
          volumeName: alertmanager-pv

grafana:
  enabled: true
  fullnameOverride: grafana
  ## Pin to latest stable. Chart default tracks kube-prometheus-stack's
  ## appVersion (was 11.5.1 on chart 69.3.1). Bumping here lets us upgrade
  ## Grafana independently of the kps chart.
  image:
    tag: "13.0.1"
  ## NFS-hostile nodes (k3s-6 no nfs-common, k3s-4 evicted) are handled by
  ## taints — Grafana can land on any remaining node freely.
  persistence:
    enabled: true
    type: sts
    storageClassName: "monitoring"
    accessModes:
      - ReadWriteMany
    size: 10Gi
    volumeName: grafana-pv
    finalizers:
      - kubernetes.io/pvc-protection
  forceDeployDatasources: false
  forceDeployDashboards: false
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: utc
  serviceMonitor:
    enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

kubeApiServer:
  enabled: true

kubelet:
  enabled: true
  serviceMonitor:
    metricRelabelings:
      - action: replace
        sourceLabels:
          - node
        targetLabel: instance

kubeControllerManager:
  enabled: true
  endpoints:
    - __K3S-API-IP__
    - __LAN-IP__
    - __LAN-IP__
    - __LAN-IP__

coreDns:
  enabled: true

kubeDns:
  enabled: false

kubeEtcd:
  enabled: true
  endpoints:
    - __K3S-API-IP__
    - __LAN-IP__
    - __LAN-IP__
    - __LAN-IP__
  service:
    enabled: true
    port: 2381
    targetPort: 2381

kubeScheduler:
  enabled: true
  endpoints:
    - __K3S-API-IP__
    - __LAN-IP__
    - __LAN-IP__
    - __LAN-IP__

kubeProxy:
  enabled: true
  endpoints:
    - __K3S-API-IP__
    - __LAN-IP__
    - __LAN-IP__
    - __LAN-IP__

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  fullnameOverride: kube-state-metrics
  selfMonitor:
    enabled: true
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: kubernetes_node
  rbac:
    extraRules:
      - apiGroups: ["velero.io"]
        resources: ["backups", "podvolumebackups", "restores", "schedules"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: PodVolumeBackup
            metricNamePrefix: velero_podvolumebackup
            labelsFromPath:
              name: [metadata, name]
              namespace: [spec, pod, namespace]
              pod: [spec, pod, name]
              volume: [spec, volume]
              node: [spec, node]
              uploader: [spec, uploaderType]
              backup_name: [metadata, labels, "velero.io/backup-name"]
            metrics:
              - name: info
                help: "PodVolumeBackup metadata and current phase"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [status, phase]
                      storage_location: [spec, backupStorageLocation]
                      snapshot_id: [status, snapshotID]
              - name: bytes_done
                help: "Bytes transferred so far for this PodVolumeBackup"
                each:
                  type: Gauge
                  gauge:
                    path: [status, progress, bytesDone]
                    nilIsZero: true
              - name: bytes_total
                help: "Total bytes to transfer for this PodVolumeBackup"
                each:
                  type: Gauge
                  gauge:
                    path: [status, progress, totalBytes]
                    nilIsZero: true
              - name: incremental_bytes
                help: "Incremental bytes written by the uploader (Kopia/Restic)"
                each:
                  type: Gauge
                  gauge:
                    path: [status, incrementalBytes]
                    nilIsZero: true
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: Backup
            metricNamePrefix: velero_backup_cr
            labelsFromPath:
              name: [metadata, name]
              schedule: [metadata, labels, "velero.io/schedule-name"]
              storage_location: [spec, storageLocation]
            metrics:
              - name: info
                help: "Backup metadata and current phase"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [status, phase]
              - name: items_backed_up
                help: "Items successfully backed up in this Backup"
                each:
                  type: Gauge
                  gauge:
                    path: [status, progress, itemsBackedUp]
                    nilIsZero: true
              - name: items_total
                help: "Total items targeted by this Backup"
                each:
                  type: Gauge
                  gauge:
                    path: [status, progress, totalItems]
                    nilIsZero: true

nodeExporter:
  enabled: true
  serviceMonitor:
    relabelings:
      - action: replace
        regex: (.*)
        replacement: $1
        sourceLabels:
          - __meta_kubernetes_pod_node_name
        targetLabel: kubernetes_node

prometheus-node-exporter:
  fullnameOverride: node-exporter
  podLabels:
    jobLabel: node-exporter
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
  service:
    portName: http-metrics
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: kubernetes_node
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2048Mi

prometheusOperator:
  enabled: true
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 200m
        memory: 50Mi
      limits:
        memory: 100Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    ## NFS-hostile nodes are blocked by taints (k3s-6 storage/nfs=unsupported,
    ## k3s-4 evicted). Prometheus is free to land on k3s-1/2/5.
    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: prometheus-pvc
        spec:
          storageClassName: "monitoring"
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: "50Gi"
          volumeName: prometheus-pv
    additionalScrapeConfigs:
      - job_name: "proxmox"
        metrics_path: "/pve"
        static_configs:
          - targets: ["__PVE1-IP__:9221"]
      - job_name: "pihole"
        static_configs:
          - targets: ["__PIHOLE1-IP__:9617"]
thanosRuler:
  enabled: false


