#cloud-config
# dock node bootstrap — runs on every fresh clone from ubuntu-tmp via Proxmox cicustom.
#
# What this DOES configure:
#   - docker.io + docker compose v2 plugin (apt: docker-compose-v2)
#   - cifs-utils (required for the //__NAS-IP__/kub NAS mount that docker-1 uses)
#   - /etc/hosts override for __NAS-HOST__ → __NAS-IP__ (load-bearing per
#     the cluster's DNS topology — see access_paths memory; without this the
#     CIFS mount fails to resolve the NAS hostname after fresh clone reboots)
#   - bastion → docker group (so bastion can run docker without sudo)
#   - dock-data dir tree at /var/lib/<svc>-data/ (matches docker-1 hot/cold convention)
#
# What this does NOT do (operator post-boot steps, see ../README.md):
#   - mount /mnt/kub  → needs /etc/samba/credentials scp'd from docker-1 (secret)
#   - install Komodo Periphery → needs /opt/komodo/.env scp'd from docker-1 (secret)
#   - register the node in Komodo Core UI
#   - update Traefik EndpointSlices in clusters/default/{legacy-vm,...}.yaml
#
# Deploy this snippet to PVE snippets storage on whichever node hosts `local`
# (typically every PVE node has its own; clone target's node needs a copy):
#   scp dock-node-user-data.yaml root@__PVE-NODE-3__:/var/lib/vz/snippets/
# (or whichever node hosts the `local` storage referenced in main.tf cicustom)
#
# Cross-node clones in Proxmox also need the snippet on the SOURCE node's
# `local` storage to be applied. Easiest: scp to all three pve* nodes.

package_update: true
package_upgrade: false

packages:
  - docker.io
  - docker-compose-v2
  - cifs-utils
  - curl
  - jq
  - ca-certificates

write_files:
  # __NAS-HOST__ is overridden because the cluster DNS topology lets the
  # cloudflare wildcard for __BASE-DOMAIN__ resolve internal-only names to k8s
  # node IPs — which would route NAS traffic into NPM and back. Pinning the
  # NAS IP here is the same workaround applied to every kub* node.
  - path: /etc/hosts
    permissions: '0644'
    append: true
    content: |
      # cloud-init: NAS pin (see homelab access_paths memory)
      __NAS-IP__ __NAS-HOST__ storage

  # /etc/fstab entry mirrors docker-1's CIFS mount. Stays commented until the
  # operator scp's /etc/samba/credentials from docker-1 — the mount fails open
  # otherwise and we don't want it to block boot.
  - path: /etc/fstab
    permissions: '0644'
    append: true
    content: |
      # cloud-init: NAS CIFS mount (uncomment after scp'ing credentials from docker-1)
      # //__NAS-IP__/kub  /mnt/kub  cifs  credentials=/etc/samba/credentials,uid=1000,gid=1000,iocharset=utf8,vers=3.0  0  0

runcmd:
  - mkdir -p /mnt/kub
  - mkdir -p /var/lib/komodo-data
  - usermod -aG docker bastion
  - systemctl enable --now docker
