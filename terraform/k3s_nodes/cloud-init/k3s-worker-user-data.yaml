#cloud-config
# k3s worker bootstrap — runs on every fresh clone from kub-tmp via Proxmox cicustom.
#
# Why this exists: the kub-tmp template ships without nfs-common, so any pod with
# an NFS-backed PVC scheduled to a fresh worker hangs in ContainerCreating with
# "mount.nfs helper missing." Discovered on k3s-7 post-rebuild — fix lives here so
# the next clone (kub8+) doesn't repeat it.
#
# Deploy this snippet to the PVE snippets storage before `terraform apply`:
#   scp k3s-worker-user-data.yaml root@<pve-node>:/var/lib/vz/snippets/
# (or whichever node hosts the `local` storage referenced in main.tf cicustom)

package_update: true
packages:
  - nfs-common
