## VeleroUI (seriohub/vui chart) values
## Chart repo: https://seriohub.github.io/velero-helm/
##
## Chart's ingress template forces a TLS block with secretName references.
## Setting exposure.mode: clusterIP gives us plain ClusterIP services; a
## separate simple Ingress (velero/ui/ingress.yaml) handles routing in the
## same style as jellyfin/ingress.yaml. TLS is terminated externally by
## the nginx-proxy-manager layer.
##
## Default login is admin / admin — change after first login.

global:
  veleroNamespace: velero
  clusterName: homelab
  core: false
  agentMode: false
  k8SInclusterMode: true

exposure:
  mode: clusterIP
  clusterIP:
    protocol: http
    wsProtocol: ws

apiService:
  deployment:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

uiService:
  deployment:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

## Disable multi-cluster core, watchdog, nats for single-cluster homelab
coreService:
  enabled: false

watchdogService:
  enabled: false

natsService:
  enabled: false
