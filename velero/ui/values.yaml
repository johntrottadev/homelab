## VeleroUI (seriohub/vui chart) values
## Chart repo: https://seriohub.github.io/velero-helm/
## Exposed at velero-ui.__BASE-DOMAIN__ via existing Traefik ingress
##
## Default login is admin / admin — change after first login.

global:
  veleroNamespace: velero
  clusterName: homelab
  core: false
  agentMode: false
  k8SInclusterMode: true

exposure:
  mode: ingress
  ingress:
    ingressClassName: traefik
    metadata:
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
    spec:
      tls:
        - hosts:
            - velero-ui.__BASE-DOMAIN__
            - velero-ui-api.__BASE-DOMAIN__

## Host configuration for the ingress — vui.__BASE-DOMAIN__ for the UI, vui-api.__BASE-DOMAIN__ for the API
## The chart creates two Ingress resources (one for UI, one for API) by default
uiService:
  ingress:
    host: velero-ui.__BASE-DOMAIN__

apiService:
  ingress:
    host: velero-ui-api.__BASE-DOMAIN__

## Resources
apiService:
  deployment:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  ingress:
    host: velero-ui-api.__BASE-DOMAIN__

uiService:
  deployment:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  ingress:
    host: velero-ui.__BASE-DOMAIN__

## Disable multi-cluster core and watchdog services for single-cluster homelab
coreService:
  enabled: false

watchdogService:
  enabled: false

natsService:
  enabled: false
