## Velero Helm values — vmware-tanzu/velero chart
## Target: Wasabi S3 (us-east-1, bucket=__WASABI-BUCKET__, prefix=velero)
## Uploader: Kopia (file-level, works with static NFS PVs)
##
## Secrets are NOT in this file. Two separate secrets are expected:
##   1. velero-wasabi-creds   (key: cloud)          — Wasabi S3 access keys
##   2. velero-repo-credentials (key: repository-password) — Kopia encryption passphrase
## See README.md for how to create these at install time.

image:
  repository: velero/velero
  pullPolicy: IfNotPresent

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.12.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

upgradeCRDs: false

configuration:
  backupStorageLocation:
    - name: wasabi
      provider: aws
      bucket: __WASABI-BUCKET__
      prefix: velero
      default: true
      config:
        region: us-east-1
        s3Url: https://__WASABI-ENDPOINT__
        s3ForcePathStyle: "true"

  volumeSnapshotLocation: []

  uploaderType: kopia
  defaultVolumesToFsBackup: true
  defaultBackupTTL: 720h

credentials:
  useSecret: true
  existingSecret: velero-wasabi-creds

deployNodeAgent: true

nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: false
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  enabled: true
  scrapeInterval: 30s
  serviceMonitor:
    enabled: true
    namespace: monitoring
    additionalLabels:
      release: kube-prometheus-stack

schedules: {}

cleanUpCRDs: false
