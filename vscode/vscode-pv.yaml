apiVersion: v1
kind: PersistentVolume
metadata:
  name: vscode-pv
  namespace: vscode
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: storage
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
    - nodiratime
    - rw   
  nfs:
    path: /volume1/kub/homelab/vscode
    server: __NAS-HOST__
